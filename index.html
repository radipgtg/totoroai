<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf2e4">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tt_theme")||"light"}catch(e){}</script>
<title>Totoro AI ✿ Toko Digital Hutan</title>
<link rel="icon" href="https://api.totoroai.my.id/api/img/logo">
<link rel="apple-touch-icon" href="https://api.totoroai.my.id/api/img/logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1f1b;
  --card:var(--wash);
  --card2:var(--wash);
  --ln:rgba(255,255,255,.11);
  --t:#eaf3ec;
  --mute:#9db5a8;
  --moss:#8fe3b0;
  --moss2:#3f9a6b;
  --gold:#f4d58d;
  --sky:#9ad4ee;
  --rose:#ff7d92;
  --r:20px;
  --ease:cubic-bezier(.22,.8,.36,1);
  --spring:cubic-bezier(.34,1.35,.64,1);
}
html{scroll-behavior:auto;scroll-padding-top:92px}
body{
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  color:var(--t);
  background:var(--bg);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  overscroll-behavior-x:none;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.serif{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;letter-spacing:-.015em}
button,input,textarea,select,a,.cat,.tile,.feat,.pkg,.ord,.cmdc,.pill,.chip{
  font-family:inherit;
  touch-action:manipulation;
}
a{color:inherit}

/* Hiasan hutan lembut */

.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 8px 28px rgba(var(--shc),.22);transition:border-color .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease)}
.pad{padding:26px}.center{text-align:center}.mt{margin-top:56px}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.2;margin-bottom:6px}
.sub{color:var(--mute);font-size:14px;line-height:1.72}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font:600 11px "Plus Jakarta Sans";letter-spacing:.15em;text-transform:uppercase;color:var(--moss);margin-bottom:8px}

/* Scroll progress bar */
#scrollbar{
  position:fixed;top:0;left:0;width:100%;height:3px;z-index:100;
  transform:scaleX(var(--scroll-progress,0));transform-origin:left center;
  background:linear-gradient(90deg,var(--moss),var(--gold),var(--sky));
  box-shadow:0 0 12px rgba(var(--acc),.65);
  pointer-events:none;border-radius:0 3px 3px 0;will-change:transform;
  transition:transform .08s linear;
}
#scrollbar::after{
  content:"";position:absolute;right:0;top:0;width:34px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));
  filter:blur(1px);opacity:.75;
}

/* Header & navigasi */
header{position:sticky;top:0;z-index:40;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar{
  max-width:1180px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 10px 7px 16px;border-radius:99px;
  background:rgba(13,31,27,.76);
  transition:background .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease),padding .3s var(--ease);
}
header.scrolled .bar{
  background:rgba(10,24,20,.95);
  border-color:rgba(var(--acc),.24);
  box-shadow:0 12px 34px rgba(var(--shc),.38);
  padding:6px 10px 6px 16px;
}
.header-right{display:flex;align-items:center;gap:8px;min-width:0}
.logo{
  display:flex;align-items:center;gap:9px;font-size:19px;cursor:pointer;white-space:nowrap;
  transition:transform .26s var(--spring);
}
.logo:hover{transform:translateY(-1px)}
.logo:active{transform:scale(.94)}
.logo .brand-badge{
  width:31px;height:31px;border-radius:11px;overflow:hidden;
  border:1px solid rgba(var(--acc),.35);
  box-shadow:0 4px 12px rgba(var(--acc2),.25);
  display:grid;place-items:center;flex:none;
}
.logo .brand-badge img{width:100%;height:100%;object-fit:cover;display:block}
.stat-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;
  border:1px solid var(--ln);background:var(--wash);
  color:var(--mute);white-space:nowrap;
  transition:border-color .25s,background .25s,transform .22s var(--ease);
}
.stat-chip b{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 8px var(--moss);flex:none;animation:pulseDot 2.4s ease-in-out infinite}
.stat-chip.off b{background:var(--rose);box-shadow:0 0 8px var(--rose);animation:none}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}

nav{display:flex;gap:3px;align-items:center}
nav a{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--mute);white-space:nowrap;
  transition:color .22s var(--ease),background .22s var(--ease),transform .22s var(--spring);
}
nav a i{font-style:normal;font-size:14px;transition:transform .25s var(--spring)}
nav a:hover{color:var(--t);background:var(--card);transform:translateY(-1px)}
nav a:hover i{transform:scale(1.12)}
nav a:active{transform:scale(.94)}
nav a.on{color:var(--on);background:var(--moss);font-weight:600;box-shadow:0 4px 14px rgba(var(--acc),.28)}
nav img.av{width:20px;height:20px;border-radius:50%;object-fit:cover}

.mb{max-width:1180px;margin:8px auto 0;padding:0 16px;position:sticky;top:68px;z-index:35}
.mb div{padding:10px 18px;border-radius:14px;font-size:13.5px;font-weight:500;background:rgba(var(--gld),.16);border:1px solid rgba(var(--gld),.45);color:var(--gold);animation:rise .4s var(--ease)}
.mb div.red{background:rgba(242,163,163,.15);border-color:rgba(242,163,163,.5);color:var(--rose)}

.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:26px 16px 90px;min-height:70vh}
.view{animation:rise .48s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
#app.out{opacity:0;transform:translate3d(0,-7px,0);transition:opacity .18s ease,transform .2s var(--ease)}

/* Tombol & animasi sentuh */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;cursor:pointer;font:600 14px "Plus Jakarta Sans",sans-serif;
  padding:12px 24px;border-radius:99px;
  background:linear-gradient(135deg,#9be07a,#4f9f62);color:var(--on);
  text-decoration:none;box-shadow:0 6px 20px rgba(var(--acc2),.35);
  transition:transform .25s var(--spring),filter .22s ease,box-shadow .25s var(--ease),background .22s ease;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 10px 26px rgba(var(--acc2),.42)}
.btn:active{transform:scale(.94);filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--t);border:1px solid var(--ln);box-shadow:none}
.btn.ghost:hover{background:var(--card2);border-color:rgba(var(--acc),.28);box-shadow:0 6px 18px rgba(var(--shc),.2)}
.btn.ghost:active{transform:scale(.95)}
.btn.red{background:linear-gradient(135deg,#e07b7b,#b24a4a);color:#fff;box-shadow:none}
.btn.sm{padding:7px 14px;font-size:12px}.full{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.acts.c{justify-content:center}

/* Form */
input,textarea,select{
  width:100%;padding:12px 15px;border-radius:14px;
  border:1px solid var(--ln);background:var(--inset);color:var(--t);
  font-size:15px;outline:none;margin-top:6px;
  transition:border-color .22s var(--ease),box-shadow .22s var(--ease),background .22s var(--ease);
}
select option{background:#10291f}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:rgba(238,243,230,.38)}
input:focus,textarea:focus,select:focus{border-color:var(--moss);background:var(--inset);box-shadow:0 0 0 3px rgba(var(--acc),.16)}
label{font-size:12px;font-weight:600;color:var(--mute);display:block;margin-top:14px}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--t);font-weight:500;cursor:pointer}.chk input{width:auto;margin:0;accent-color:#9be07a}
.pw{position:relative}.pw input{padding-right:50px}
.eye{position:absolute;right:6px;top:calc(50% + 3px);transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;border-radius:50%;transition:background .2s,color .2s,transform .2s var(--spring)}
.eye:hover{background:var(--card);color:var(--t)}.eye:active{transform:translateY(-50%) scale(.86)}

/* Selector paket */
.pkgs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:10px}
.pkg{position:relative;padding:16px 14px;border-radius:16px;background:var(--card);border:2px solid var(--ln);cursor:pointer;transition:transform .26s var(--spring),background .24s ease,border-color .24s ease,box-shadow .26s ease;overflow:hidden}
.pkg:hover{background:var(--card2);transform:translateY(-2px);border-color:rgba(var(--acc),.32)}
.pkg:active{transform:scale(.97)}
.pkg.on{border-color:var(--moss);background:rgba(var(--acc),.1);box-shadow:0 0 0 3px rgba(var(--acc),.15),0 8px 24px rgba(var(--acc2),.25)}
.pkg .radio{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;transition:all .24s var(--spring)}
.pkg.on .radio{border-color:var(--moss);background:var(--moss)}
.pkg.on .radio::after{content:"✓";font-size:11px;font-weight:800;color:var(--on)}
.pkg h4{font-size:14px;font-weight:600;margin-bottom:4px;padding-right:26px}
.pkg .pr{font:700 20px "Bricolage Grotesque",sans-serif;color:var(--gold);line-height:1.1;margin-top:6px}
.pkg .pr s{font-size:12px;color:var(--mute);font-weight:400;display:block;text-decoration:line-through;line-height:1.2}
.pkg .desc{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.pkg .off-badge{position:absolute;top:0;left:0;background:var(--gold);color:#3a2f0a;font:800 9px "Plus Jakarta Sans";letter-spacing:.05em;padding:3px 10px;border-bottom-right-radius:10px}
.pkg.on .off-badge{background:#fff}

/* Hero */
.hero{position:relative;overflow:hidden;padding:54px 36px 0;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;min-height:520px;isolation:isolate}
.hero::after{content:"";position:absolute;width:250px;height:250px;right:6%;top:4%;background:radial-gradient(circle,rgba(var(--acc),.13),transparent 70%);pointer-events:none;z-index:0}
.hero h1{font-size:clamp(36px,5.6vw,62px);line-height:1.05;margin:12px 0 16px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#f2cf7e,#9be07a);-webkit-background-clip:text;color:transparent}
.hero p.lead{color:var(--mute);max-width:490px;font-size:16px;line-height:1.7}
.hero-l{position:relative;z-index:2;padding-bottom:112px}
.hero svg.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;z-index:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:12px;margin:0 6px 6px 0;color:var(--mute);transition:transform .22s var(--spring),background .2s,border-color .2s,color .2s}
.chip:hover{transform:translateY(-1px);background:var(--card2);color:var(--t);border-color:rgba(var(--acc),.25)}
.chip:active{transform:scale(.95)}

.phone{position:relative;z-index:2;max-width:304px;margin:0 auto 70px;border-radius:30px;background:#0d1a15;border:1px solid rgba(var(--acc),.18);box-shadow:0 24px 60px rgba(var(--shc),.48);overflow:hidden;transform:rotate(2.2deg);transition:transform .45s var(--ease)}
.phone:hover{transform:rotate(0deg) translateY(-4px)}
.ph-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#12302a;border-bottom:1px solid var(--ln)}
.ph-top img{width:35px;height:35px;border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(var(--acc),.55)}
.bub .nm{display:block;font-style:normal;font-size:10px;font-weight:700;margin-bottom:2px}.bub.me .nm{color:var(--gold)}.bub.bot .nm{color:var(--moss)}
.ph-top b{font-size:13px;display:block;line-height:1.2}.ph-top small{font-size:10.5px;color:var(--moss)}
.ph-body{padding:14px 12px;display:flex;flex-direction:column;gap:7px;min-height:270px;background:radial-gradient(circle at 50% 0,rgba(var(--acc),.08),transparent 60%)}
.bub{max-width:86%;padding:7px 11px;border-radius:12px;font-size:12px;line-height:1.45;opacity:0;animation:pop .48s var(--ease) forwards}
.bub.me{align-self:flex-end;background:#1f5f46;border-top-right-radius:3px}.bub.bot{align-self:flex-start;background:#1a2a24;border:1px solid var(--ln);border-top-left-radius:3px}
.bub code{font-family:ui-monospace,monospace;color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translate3d(0,8px,0) scale(.96)}to{opacity:1;transform:none}}

/* Stats & grid */
.sgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:18px}
.stat{padding:22px 18px;text-align:center}.stat b{font:600 34px "Bricolage Grotesque",sans-serif;display:block;line-height:1.1;color:var(--gold)}.stat span{font-size:12.5px;color:var(--mute)}
.stat.sm b{font-size:24px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.split{display:grid;gap:18px;grid-template-columns:1fr 1fr;align-items:start}
.split2{display:grid;gap:18px;grid-template-columns:320px 1fr;align-items:start}
@media(max-width:860px){.split,.split2{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:40px 22px 0}.phone{display:none}.hero-l{padding-bottom:120px}}

.cat{padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:transform .28s var(--spring),background .25s ease,border-color .25s ease,box-shadow .28s ease}
.cat:hover,.tile:hover,.feat:hover,.ord:hover,.step:hover,details:hover{transform:translateY(-3px);background:var(--card2);border-color:rgba(var(--gld),.4);box-shadow:0 14px 34px rgba(var(--shc),.26)}
.cat:active,.tile:active,.feat:active,.ord:active{transform:scale(.975)}
.cat .ic{font-size:34px;transition:transform .3s var(--spring)}.cat:hover .ic{transform:scale(1.08) rotate(-3deg)}
.cat small{margin-top:auto;color:var(--moss);font-weight:600}
.tile{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;border-radius:16px;font-size:14px;transition:transform .25s var(--spring),background .22s ease,border-color .22s ease}
.tile b{color:var(--gold);white-space:nowrap}.tile s{display:block;font-size:11px;color:var(--mute)}
.off{background:var(--gold);color:#3a2f0a;border-radius:99px;font-size:11px;font-weight:700;padding:2px 9px;margin-left:6px;vertical-align:middle}
.feat{padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .28s var(--spring),background .25s ease,border-color .25s ease}
.feat .ic{font-size:30px;width:54px;height:54px;border-radius:16px;background:rgba(var(--acc),.12);display:grid;place-items:center;margin-bottom:6px;transition:transform .3s var(--spring)}.feat:hover .ic{transform:scale(1.06)}
.cmd{display:inline-block;font:600 12px ui-monospace,monospace;color:var(--gold);background:rgba(var(--gld),.12);padding:3px 10px;border-radius:99px;width:fit-content;cursor:pointer;transition:background .2s,transform .2s var(--spring)}
.cmd:hover{background:rgba(var(--gld),.22)}.cmd:active{transform:scale(.94)}
.demo{margin-top:8px;padding:10px;border-radius:14px;background:var(--inset);font-size:12px;display:flex;flex-direction:column;gap:5px}
.demo span{padding:5px 9px;border-radius:10px;width:fit-content;max-width:92%}.demo .u{align-self:flex-end;background:#1f5f46}.demo .b{background:#1a2a24;border:1px solid var(--ln)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;font-weight:600;word-break:break-all}
.note{background:rgba(var(--gld),.1);border:1px solid rgba(var(--gld),.35);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:14px;line-height:1.7}
.qr{background:#fff;padding:12px;border-radius:18px;display:inline-block}.qr img{width:240px;max-width:100%;display:block}

/* Loader */
.loader{position:relative;isolation:isolate;min-height:clamp(380px,62vh,580px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px;gap:14px;overflow:hidden;border:1px solid rgba(184,221,153,.13);border-radius:28px;background:radial-gradient(ellipse at 50% 42%,rgba(119,174,104,.17),transparent 48%),linear-gradient(160deg,rgba(20,55,39,.72),rgba(7,23,17,.9));box-shadow:inset 0 1px var(--wash),0 24px 70px rgba(var(--shc),.18)}
.loader::before,.loader::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.loader::before{width:260px;height:260px;background:radial-gradient(circle,rgba(var(--gld),.12),transparent 68%);top:5%;left:50%;transform:translateX(-50%);animation:loaderGlow 5s ease-in-out infinite}
.loader::after{inset:auto 8% 12%;height:1px;background:linear-gradient(90deg,transparent,rgba(180,219,151,.25),transparent)}
.loader-scene{position:relative;width:152px;height:152px;display:grid;place-items:center;margin-bottom:4px}
.loader-orbit{position:absolute;inset:5px;border:1px solid rgba(198,226,169,.2);border-radius:50%;animation:orbit 12s linear infinite}
.loader-orbit::before,.loader-orbit::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px rgba(var(--gld),.7)}
.loader-orbit::before{top:17px;left:24px}.loader-orbit::after{right:13px;bottom:31px;width:5px;height:5px;background:var(--moss)}
.loader-core{width:92px;height:92px;border-radius:34px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,rgba(var(--acc),.2),rgba(31,87,57,.35));border:1px solid rgba(199,231,167,.3);box-shadow:0 0 45px rgba(var(--acc),.16),inset 0 1px rgba(255,255,255,.12);animation:coreFloat 3.8s ease-in-out infinite}
.loader-core img{width:100%;height:100%;object-fit:cover;display:block}
.loader-firefly{position:absolute;font-size:14px;animation:firefly 3s ease-in-out infinite}
.loader-firefly.one{left:0;top:42px}.loader-firefly.two{right:2px;top:24px;animation-delay:-1.2s}.loader-firefly.three{bottom:3px;left:50%;animation-delay:-2s}
.loader-txt{font:600 clamp(17px,3vw,21px) "Bricolage Grotesque",sans-serif;color:var(--t);letter-spacing:.01em;text-align:center}
.loader-sub{font-size:12.5px;color:var(--mute);text-align:center;max-width:300px;line-height:1.7;min-height:42px}
.loader-track{width:min(220px,70%);height:3px;border-radius:99px;background:var(--wash);overflow:hidden;margin-top:3px}
.loader-track i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--moss2),var(--moss),var(--gold));box-shadow:0 0 12px rgba(var(--acc),.5);animation:loaderProgress 1.8s ease-in-out infinite}
.loader-caption{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(197,220,186,.55);margin-top:3px}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes coreFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes firefly{0%,100%{opacity:.25;transform:translateY(4px) scale(.8)}50%{opacity:1;transform:translateY(-8px) scale(1.15)}}
@keyframes loaderGlow{0%,100%{opacity:.55;transform:translateX(-50%) scale(.9)}50%{opacity:1;transform:translateX(-50%) scale(1.12)}}
@keyframes loaderProgress{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}

.badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap}
.s-awaiting{background:#f2cf7e;color:#4a3a05}.s-verifying{background:#9ccbee;color:#12395b}.s-success{background:#a6e08a;color:#1c4a10}.s-rejected{background:#f2a3a3;color:#5a1414}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.ord{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;cursor:pointer;margin-bottom:12px;align-items:center}
.ord small{color:var(--mute)}
.steps{display:grid;gap:26px 16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));counter-reset:s;margin-top:34px}
.step{padding:32px 22px 22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-18px;left:22px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f2cf7e,#d9a93f);color:#3a2f0a;font:700 17px "Bricolage Grotesque",sans-serif;display:grid;place-items:center}
.step h3{font-size:17px;margin-bottom:4px}
.help{padding:20px 24px;margin-top:20px;font-size:13.5px}
.help h4{font:600 16px "Bricolage Grotesque",sans-serif;color:var(--gold);margin-bottom:6px}
.help ol,.help ul{margin-left:20px}.help li{margin:5px 0;color:var(--mute)}.help li b{color:var(--t)}.help p{color:var(--mute)}
details{padding:15px 20px;margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:14px;transition:color .2s}details:hover summary{color:var(--gold)}details p{margin-top:8px;color:var(--mute);font-size:13.5px}
details[open] p{animation:rise .28s var(--ease)}
.back{background:none;border:0;color:var(--t);opacity:.72;cursor:pointer;font:500 13px "Plus Jakarta Sans";margin-bottom:14px;transition:opacity .2s,transform .22s var(--spring)}.back:hover{opacity:1;transform:translateX(-3px)}.back:active{transform:scale(.95)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;text-align:left;border-bottom:1px solid var(--ln)}th{color:var(--mute);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mute);margin-top:10px}

/* Avatar & role */
.avt{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--moss2),#2f6f4a);color:#fff;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.avt img{width:100%;height:100%;object-fit:cover}
.avt.t{position:relative}.avt.t img{position:absolute;inset:0}
.avbtn{position:relative;cursor:pointer;border-radius:50%;display:inline-block}
.avbtn::after{content:"📷 Ganti";position:absolute;inset:0;border-radius:50%;background:rgba(var(--shc),.55);display:grid;place-items:center;font-size:12px;font-weight:600;opacity:0;transition:opacity .24s ease}
.avbtn:hover::after{opacity:1}
.rl{font-size:10px;background:var(--gold);color:#3a2f0a;border-radius:99px;padding:1px 8px;font-weight:700;letter-spacing:.03em;vertical-align:middle;white-space:nowrap;font-family:"Plus Jakarta Sans",sans-serif}
.rl.big{font-size:12px;padding:2px 11px}
.rl.pr{background:var(--sky);color:#0d2b3d}

/* Chat */
.chat{height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 4px 4px 0;margin-top:12px;scroll-behavior:smooth}
.cm{display:flex;gap:10px;align-items:flex-end;animation:rise .3s var(--ease)}.cm.mine{flex-direction:row-reverse}
.cm .bx{max-width:76%;min-width:0}
.cm .nm{font-size:11.5px;color:var(--mute);margin:0 6px 3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cm.mine .nm{justify-content:flex-end}
.cm .tx{padding:9px 14px;border-radius:16px;font-size:14px;background:var(--card2);border:1px solid var(--ln);border-bottom-left-radius:4px;word-break:break-word}
.cm.mine .tx{background:linear-gradient(135deg,#2e7d52,#215f3f);border-color:transparent;border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.cm .x{background:none;border:0;color:var(--rose);cursor:pointer;font-size:11px;opacity:.7}
.m{max-width:82%;padding:11px 15px;border-radius:18px;font-size:14px;animation:rise .28s var(--ease)}
.m.bot{background:var(--card2);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:linear-gradient(135deg,#2e7d52,#215f3f);align-self:flex-end;border-bottom-right-radius:4px}
.send{display:flex;gap:8px;margin-top:12px}.send input{margin:0}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--t);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}

/* Fitur & showcase */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bars.scroll{max-height:380px;overflow-y:auto;padding-right:6px}
.bar-r{display:grid;grid-template-columns:104px 1fr 42px;gap:10px;align-items:center;font-size:12.5px}
.bar-r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-r div{height:9px;border-radius:99px;background:var(--wash);overflow:hidden}.bar-r div i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--moss2),var(--moss));width:0;transition:width .9s var(--ease)}
.bar-r span:last-child{text-align:right;color:var(--mute)}
.cmdc{padding:12px 14px;border-radius:14px;cursor:pointer;font-size:13px;transition:background .2s,transform .22s var(--spring)}.cmdc:hover{background:var(--card2);transform:translateY(-2px)}.cmdc:active{transform:scale(.96)}
.cmdc b{font-family:ui-monospace,monospace;color:var(--gold);font-size:13px;word-break:break-all}.cmdc small{display:block;color:var(--mute);font-size:11.5px;line-height:1.4;margin-top:2px}
.cmdc .rl{margin-left:6px}
.cmdc small.al{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.75}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.pill{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;background:var(--card);border:1px solid var(--ln);color:var(--mute);transition:all .22s var(--spring)}.pill.on{background:var(--moss);color:var(--on);border-color:var(--moss)}
.pill:hover{transform:translateY(-1px)}.pill:active{transform:scale(.95)}
.pill em{font-style:normal;opacity:.7;margin-left:4px;font-weight:500}

.shot{overflow:hidden;display:flex;flex-direction:column;transition:transform .28s var(--spring),border-color .25s ease}
.shot:hover{transform:translateY(-4px);border-color:rgba(var(--gld),.45)}.shot .cmd{cursor:copy}
.shot .im{position:relative;background:radial-gradient(circle at 50% 0,rgba(var(--acc),.1),rgba(var(--shc),.35));padding:12px;display:grid;place-items:center;cursor:zoom-in}
.shot img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block;border-radius:10px;transition:transform .38s var(--ease)}.shot:hover img{transform:scale(1.03)}
.shot .zoom{position:absolute;right:14px;bottom:14px;font-style:normal;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(var(--shc),.65);opacity:0;transition:opacity .2s}.shot:hover .zoom{opacity:1}
@media(hover:none){.shot .zoom{opacity:1}}
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,15,11,.93);display:flex;opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}#lb.on{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:14px;box-shadow:0 20px 60px rgba(var(--shc),.6);transform:scale(.94);transition:transform .32s var(--ease)}#lb.on img{transform:none}#lb small{color:var(--mute)}
.shot .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.shot.more{align-items:center;justify-content:center;text-align:center;padding:30px;min-height:240px;gap:8px;cursor:default}
.shots{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

/* Promo */
.promo{position:relative;overflow:hidden;padding:28px 30px;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:linear-gradient(120deg,rgba(var(--gld),.2),rgba(var(--acc),.11) 55%,rgba(var(--skc),.09));border-color:rgba(var(--gld),.5)}
.promo::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:radial-gradient(circle,rgba(var(--gld),.25),transparent 70%)}
.promo .ribbon{position:absolute;top:14px;left:-34px;transform:rotate(-35deg);background:var(--gold);color:#3a2f0a;font:800 10px "Plus Jakarta Sans";letter-spacing:.18em;padding:4px 40px}
.promo .pd{position:absolute;font-style:normal;opacity:.5;pointer-events:none}.promo .p1{right:24%;top:10px;font-size:20px}.promo .p2{left:34%;bottom:8px;font-size:18px}.promo .p3{right:6px;bottom:12px;font-size:22px}
.pbadge{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#f2cf7e,#d9a93f);color:#3a2f0a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(217,169,63,.4),inset 0 0 0 5px rgba(255,255,255,.28);line-height:1.05;flex:none}
.pbadge b{font:700 32px "Bricolage Grotesque",sans-serif}.pbadge small{font-size:9px;font-weight:800;letter-spacing:.1em}
.pbody{position:relative;min-width:0}.pbody h2{margin:2px 0 6px;font-size:clamp(22px,3vw,30px)}
.pchips{margin-top:12px}.pchips .chip{color:var(--t)}.pchips .chip b{color:var(--gold)}
.pside{position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right}.pside small{color:var(--mute);font-size:12px;font-weight:600}
.cd{display:flex;gap:7px}.cdb{min-width:54px;padding:8px 6px;border-radius:12px;background:var(--inset);border:1px solid var(--ln);text-align:center}.cdb b{display:block;font:700 22px "Bricolage Grotesque",sans-serif;color:var(--gold);line-height:1.1}.cdb span{font-size:10px;color:var(--mute)}
@media(max-width:860px){.promo{grid-template-columns:1fr;padding:30px 22px 24px;gap:16px}.pbadge{width:92px;height:92px}.pbadge b{font-size:26px}.pside{align-items:flex-start;text-align:left}.pside .btn{width:100%}}

footer{position:relative;z-index:1;text-align:center;padding:30px 18px 100px;font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,18px);padding:11px 22px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s ease,transform .35s var(--spring);z-index:99;pointer-events:none;background:rgba(13,31,27,.96);border:1px solid rgba(var(--acc),.28);box-shadow:0 12px 30px rgba(var(--shc),.4);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:761px){#toast{bottom:26px}footer{padding-bottom:50px}}

/* Scroll reveal */
.reveal{opacity:0;transform:translate3d(0,16px,0);transition:opacity .48s var(--ease),transform .48s var(--ease);backface-visibility:hidden}
.reveal.in{opacity:1;transform:translate3d(0,0,0)}
.reveal.d1{transition-delay:.05s}.reveal.d2{transition-delay:.1s}.reveal.d3{transition-delay:.15s}
.reveal.d4{transition-delay:.2s}.reveal.d5{transition-delay:.25s}

/* Hamburger & drawer */
.menu-toggle{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--ln);border-radius:50%;background:var(--wash);cursor:pointer;position:relative;transition:background .22s,border-color .22s,transform .28s var(--spring)}
.menu-toggle:hover{background:rgba(var(--acc),.14);border-color:rgba(var(--acc),.4)}
.menu-toggle:active{transform:scale(.9)}
.menu-toggle span{position:absolute;width:16px;height:1.7px;border-radius:4px;background:var(--t);transition:transform .3s var(--ease),opacity .2s ease}
.menu-toggle span:nth-child(1){transform:translateY(-5px)}
.menu-toggle span:nth-child(2){transform:translateY(0)}
.menu-toggle span:nth-child(3){transform:translateY(5px)}
.menu-toggle.active span:nth-child(1){transform:rotate(45deg)}
.menu-toggle.active span:nth-child(2){opacity:0;transform:scaleX(.3)}
.menu-toggle.active span:nth-child(3){transform:rotate(-45deg)}

.drawer-backdrop{position:fixed;inset:0;z-index:80;background:rgba(2,10,7,.6);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
.drawer-backdrop.open{opacity:1;visibility:visible}
.forest-drawer{position:absolute;top:12px;right:12px;width:min(370px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:22px;border:1px solid rgba(183,220,157,.22);border-radius:26px;background:linear-gradient(155deg,rgba(19,49,35,.98),rgba(7,22,16,.99));box-shadow:0 28px 90px rgba(var(--shc),.52);transform:translate3d(16px,-8px,0) scale(.97);opacity:0;transition:transform .34s var(--ease),opacity .28s ease}
.drawer-backdrop.open .forest-drawer{transform:translate3d(0,0,0) scale(1);opacity:1}
.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.drawer-brand{display:flex;align-items:center;gap:10px;font:600 19px "Bricolage Grotesque",sans-serif}
.drawer-brand img{width:36px;height:36px;border-radius:12px;object-fit:cover;border:1px solid rgba(var(--acc),.35)}
.drawer-close{width:34px;height:34px;border:1px solid var(--ln);border-radius:50%;background:var(--wash);color:var(--t);font-size:18px;cursor:pointer;transition:transform .22s var(--spring),background .2s}.drawer-close:hover{background:var(--card2)}.drawer-close:active{transform:scale(.88)}
.drawer-quote{padding:14px 16px;margin-bottom:16px;border-radius:17px;background:linear-gradient(120deg,rgba(var(--acc),.12),rgba(var(--gld),.07));border:1px solid rgba(var(--acc),.16);color:#dce9d2;font:italic 13.5px "Bricolage Grotesque",sans-serif;line-height:1.65}
.drawer-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:14px 2px 8px}
.drawer-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer-link{display:flex;align-items:center;gap:10px;min-height:50px;padding:10px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--wash);color:var(--t);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;transition:transform .22s var(--spring),background .2s,border-color .2s}
.drawer-link:hover{transform:translateY(-2px);background:rgba(var(--acc),.1);border-color:rgba(var(--acc),.28)}
.drawer-link:active{transform:scale(.96)}
.drawer-link b{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:rgba(var(--acc),.12);font-size:14px;flex:none}
.drawer-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--ln);font-size:11px;color:var(--mute);line-height:1.7}

::selection{background:rgba(var(--acc),.28);color:var(--t)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media(max-width:760px){

}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto!important}

/* ===== upgrade UI ===== */
html{scroll-behavior:smooth}
.hr2{display:flex;align-items:center;gap:8px}

.bdg i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}.bdg b{display:block;font-size:13px}.bdg small{display:block;color:var(--mute);font-size:11px;margin-top:2px;line-height:1.35}

/* ===================== TEMA BARU: hangat, terang, jaring kotak ===================== */
:root{
  --bg:#fbf2e4;--t:#3a2a20;--mute:#7b6858;--card:rgba(255,251,244,.84);--card2:#fffdf8;--ln:rgba(125,85,45,.17);
  --moss:#d9603b;--moss2:#b84a2b;--gold:#b0701a;--sky:#2f7fb5;--rose:#d23c63;--sage:#4d9473;--lav:#7b62c9;--ok:#3b8c5c;
  --acc:217,96,59;--acc2:184,74,43;--gld:200,135,30;--skc:47,127,181;--lavc:123,98,201;--sagec:77,148,115;--shc:120,70,30;
  --wash:rgba(125,85,45,.06);--inset:rgba(125,85,45,.07);--surf:#fffaf1;--on:#fff;--hbg:rgba(255,250,240,.86);
  --grid:rgba(165,115,60,.14);--me:#ffe2cd;--bot:#fff;--r:24px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#161210;--t:#f6ebdb;--mute:#bba995;--card:rgba(255,236,214,.06);--card2:rgba(255,236,214,.11);--ln:rgba(255,226,190,.14);
  --moss:#ff9468;--moss2:#e2603a;--gold:#f2c36a;--sky:#8ccbf2;--rose:#ff8da8;--sage:#7fd0a6;--lav:#b5a2f5;--ok:#8fe3b0;
  --acc:255,148,104;--acc2:226,96,58;--gld:242,195,106;--skc:140,203,242;--lavc:181,162,245;--sagec:127,208,166;--shc:0,0,0;
  --wash:rgba(255,236,214,.06);--inset:rgba(0,0,0,.28);--surf:#211a15;--on:#26150c;--hbg:rgba(26,20,16,.86);
  --grid:rgba(255,226,190,.07);--me:#6b3b24;--bot:#271e18;color-scheme:dark;
}
body{background:var(--bg);color:var(--t)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/38px 38px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/38px 38px,
    radial-gradient(60% 45% at 6% 0%,rgba(var(--acc),.17),transparent 70%),
    radial-gradient(50% 45% at 100% 6%,rgba(var(--lavc),.14),transparent 70%),
    radial-gradient(55% 45% at 92% 100%,rgba(var(--sagec),.16),transparent 70%),
    radial-gradient(45% 40% at 0% 100%,rgba(var(--gld),.15),transparent 70%)}
.loader-firefly{display:none}
::selection{background:rgba(var(--acc),.25)}

/* animasi ganti tema */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
html.tt-anim *,html.tt-anim *::before,html.tt-anim *::after{transition:background-color .6s ease,color .6s ease,border-color .6s ease,box-shadow .6s ease!important}
.tbtn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--ln);background:var(--wash);color:var(--t);cursor:pointer;position:relative;display:grid;place-items:center;overflow:hidden;transition:transform .3s var(--spring),border-color .2s}
.tbtn:hover{border-color:var(--moss)}.tbtn:active{transform:scale(.88)}
.tbtn svg{position:absolute;width:19px;height:19px;transition:transform .6s var(--spring),opacity .35s ease}
.tbtn .sun{transform:rotate(0) scale(1);opacity:1;color:var(--gold)}.tbtn .moon{transform:rotate(-90deg) scale(.3);opacity:0;color:var(--moss)}
:root[data-theme="dark"] .tbtn .sun{transform:rotate(90deg) scale(.3);opacity:0}
:root[data-theme="dark"] .tbtn .moon{transform:rotate(0) scale(1);opacity:1}

/* header, tombol, form */
.bar,header.scrolled .bar{background:var(--hbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header.scrolled .bar{border-color:rgba(var(--acc),.35);box-shadow:0 12px 30px -14px rgba(var(--shc),.4)}
.btn{background:linear-gradient(135deg,var(--moss),#e9953d);color:var(--on);box-shadow:0 8px 20px -8px rgba(var(--acc),.7)}
:root[data-theme="dark"] .btn{background:linear-gradient(135deg,#ff9468,#f2c36a)}
.btn:hover{box-shadow:0 12px 26px -8px rgba(var(--acc),.8)}
.btn.ghost{background:var(--card);color:var(--t);border:1px solid var(--ln);box-shadow:none}
.btn.red{color:#fff}
input,textarea,select{background:var(--inset);color:var(--t);border-color:var(--ln)}
input:focus,textarea:focus,select:focus{background:var(--card2);border-color:var(--moss);box-shadow:0 0 0 3px rgba(var(--acc),.18)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.7}
select option{background:var(--surf);color:var(--t)}
nav a.on,.pill.on,.lg i,.ptabs button.on{background:linear-gradient(135deg,var(--moss),#e9953d);color:var(--on)}
:root[data-theme="dark"] nav a.on,:root[data-theme="dark"] .pill.on,:root[data-theme="dark"] .lg i,:root[data-theme="dark"] .ptabs button.on{background:linear-gradient(135deg,#ff9468,#f2c36a)}
.lg button.on{color:var(--on)}
.stat-chip b{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hero h1 em,.hero2 h1 em{background:linear-gradient(90deg,var(--moss),var(--gold) 55%,var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-toggle{background:var(--wash)}
.avt{background:linear-gradient(135deg,var(--moss),var(--lav));color:#fff}
.cam{border-color:var(--bg);background:var(--moss);color:#fff}
.glass{--ca:var(--moss);box-shadow:0 14px 30px -18px rgba(var(--shc),.45);border-radius:var(--r)}
.glass:hover{border-color:rgba(var(--acc),.38)}

/* permukaan yang tadinya gelap */
.phone{background:var(--surf);border-color:var(--ln);box-shadow:0 26px 50px -24px rgba(var(--shc),.5)}
.ph-top{background:var(--card2)}.ph-body{background:var(--wash)}
.bub.me,.demo .u,.m.me,.cm.mine .tx{background:var(--me);color:var(--t);border:1px solid var(--ln)}
.bub.bot,.demo .b,.m.bot,.cm .tx{background:var(--bot);color:var(--t);border:1px solid var(--ln)}
.bub code{color:var(--moss2)}
.loader{background:var(--card);border-color:var(--ln)}
.shot .im{background:var(--wash)}.shot .zoom{color:#fff;background:rgba(40,25,15,.72)}
#lb{background:rgba(35,22,12,.9)}#lb small,#lb b{color:#f6ebdb}
#toast{background:var(--surf);color:var(--t);border-color:var(--ln)}
.forest-drawer{background:var(--surf);border-color:var(--ln);color:var(--t)}
.drawer-backdrop{background:rgba(50,30,15,.42)}
.drawer-quote{color:var(--t);background:linear-gradient(120deg,rgba(var(--acc),.12),rgba(var(--lavc),.1))}
.totop{background:var(--surf);color:var(--moss)}
.cdb{background:var(--inset)}.demo{background:var(--inset)}.bt2{background:var(--wash)}
.tbtn,.clk,.stat-chip{background:var(--wash)}
.face .r{stroke:var(--ln)}
@media(max-width:760px){nav{background:var(--hbg)!important}.bar.glass{background:var(--hbg)}}

/* ===================== BENTUK BOX BERBEDA-BEDA ===================== */
.grid>*,.g3>*,.sgrid>*,.bento>*,.steps>*,.pkgs>*,.wagrid>*,.bdgs>*,#faqL>*{--ca:var(--moss)}
.grid>*:nth-child(6n+2),.g3>*:nth-child(6n+2),.sgrid>*:nth-child(6n+2),.bento>*:nth-child(6n+2),.steps>*:nth-child(6n+2),.pkgs>*:nth-child(6n+2),.wagrid>*:nth-child(6n+2),.bdgs>*:nth-child(6n+2),#faqL>*:nth-child(6n+2){--ca:var(--sage)}
.grid>*:nth-child(6n+3),.g3>*:nth-child(6n+3),.sgrid>*:nth-child(6n+3),.bento>*:nth-child(6n+3),.steps>*:nth-child(6n+3),.pkgs>*:nth-child(6n+3),.wagrid>*:nth-child(6n+3),.bdgs>*:nth-child(6n+3),#faqL>*:nth-child(6n+3){--ca:var(--gold)}
.grid>*:nth-child(6n+4),.g3>*:nth-child(6n+4),.sgrid>*:nth-child(6n+4),.bento>*:nth-child(6n+4),.steps>*:nth-child(6n+4),.pkgs>*:nth-child(6n+4),.wagrid>*:nth-child(6n+4),.bdgs>*:nth-child(6n+4),#faqL>*:nth-child(6n+4){--ca:var(--sky)}
.grid>*:nth-child(6n+5),.g3>*:nth-child(6n+5),.sgrid>*:nth-child(6n+5),.bento>*:nth-child(6n+5),.steps>*:nth-child(6n+5),.pkgs>*:nth-child(6n+5),.wagrid>*:nth-child(6n+5),.bdgs>*:nth-child(6n+5),#faqL>*:nth-child(6n+5){--ca:var(--lav)}
.grid>*:nth-child(6n+6),.g3>*:nth-child(6n+6),.sgrid>*:nth-child(6n+6),.bento>*:nth-child(6n+6),.steps>*:nth-child(6n+6),.pkgs>*:nth-child(6n+6),.wagrid>*:nth-child(6n+6),.bdgs>*:nth-child(6n+6),#faqL>*:nth-child(6n+6){--ca:var(--rose)}

/* kartu kategori: tab map */
.cat{border-radius:38px 38px 38px 8px;border-top:6px solid var(--ca);background:linear-gradient(180deg,color-mix(in srgb,var(--ca) 9%,transparent),var(--card) 55%)}
.cat:nth-child(even){border-radius:8px 38px 38px 38px}
.cat .ic{width:66px;height:66px;display:grid;place-items:center;font-size:32px;border-radius:50% 50% 50% 14px;background:color-mix(in srgb,var(--ca) 18%,transparent)}
.cat small{color:var(--ca)}
.cat:hover,.tile:hover,.feat:hover,.ord:hover,.step:hover,details:hover,.shot:hover{border-color:var(--ca);background:var(--card2);box-shadow:0 18px 34px -18px color-mix(in srgb,var(--ca) 55%,transparent)}
/* fitur: label tag */
.feat{border-radius:6px 28px 28px 28px;border-left:7px solid var(--ca)}
.feat:nth-child(even){border-radius:28px 6px 28px 28px}
.feat .ic{border-radius:18px 18px 18px 4px;background:color-mix(in srgb,var(--ca) 16%,transparent)}
.feat:nth-child(3n) .ic{border-radius:50%}
/* paket: tiket */
.tile{border-radius:999px 20px 20px 999px;padding-left:24px;border-left:6px solid var(--ca)}
.tile:nth-child(even){border-radius:20px 999px 999px 20px;border-left:1px solid var(--ln);border-right:6px solid var(--ca);padding-right:24px}
.pkg{border:2px dashed var(--ln);border-radius:26px 6px 26px 6px;background:var(--card)}
.pkg:nth-child(even){border-radius:6px 26px 6px 26px}
.pkg:hover{border-color:var(--ca)}
.pkg.on{border-style:solid;border-color:var(--ca);background:color-mix(in srgb,var(--ca) 11%,var(--card));box-shadow:0 12px 26px -14px var(--ca)}
.pkg.on .radio{background:var(--ca);border-color:var(--ca)}.pkg.on .radio::after{color:#fff}
.pkg .pr{color:var(--ca)}
/* statistik: blob bergantian */
.stat{border-bottom:5px solid var(--ca);border-radius:30px 30px 30px 6px}
.stat:nth-child(4n+2){border-radius:6px 30px 30px 30px}
.stat:nth-child(4n+3){border-radius:56px 12px 56px 12px}
.stat:nth-child(4n+4){border-radius:12px 56px 12px 56px}
.stat b{color:var(--ca)}
/* langkah */
.step{border:2px dashed var(--ln);border-radius:6px 32px 32px 32px}
.step:nth-child(even){border-radius:32px 6px 32px 32px}
.step::before{background:var(--ca);color:#fff;border-radius:14px 50% 50% 50%}
/* bento sistem */
.bento>.bc:nth-child(odd){border-radius:34px 10px 34px 10px}
.bento>.bc:nth-child(even){border-radius:10px 34px 10px 34px}
.bento>.bc{border-top:4px solid var(--ca)}
.lv{border-radius:40px 40px 40px 10px}
/* showcase */
.shot{border-radius:34px 34px 8px 34px}.shot:nth-child(even){border-radius:8px 34px 34px 34px}
.shot .im{border-radius:0}
/* pesanan */
.ord{border-radius:8px 26px 26px 8px;border-left:7px solid var(--ca)}
.ord:nth-child(even){border-radius:26px 8px 8px 26px;border-left:1px solid var(--ln);border-right:7px solid var(--ca)}
/* FAQ */
.faqi{border-radius:16px 30px 16px 30px;border-left:6px solid var(--ca)}
.faqi:nth-child(even){border-radius:30px 16px 30px 16px}
.faqi summary::after{color:var(--ca)}
.faqi[open]{border-color:var(--ca)}
.faqcta{border-radius:44px 14px 44px 14px}
.help{border-radius:8px 28px 28px 28px;border-left:6px solid var(--sage)}
.promo{border-radius:48px 14px 48px 14px}
/* leaderboard */
.lr{border-radius:999px 22px 22px 999px;border-left:6px solid var(--ca)}
.lr:nth-child(even){border-radius:22px 999px 999px 22px}
.pd:nth-child(1){border-radius:30px 30px 0 0}.pd:nth-child(2){border-radius:40px 40px 0 0}.pd:nth-child(3){border-radius:22px 22px 0 0}
.rkstats>*:nth-child(1){border-radius:28px 6px 28px 6px}.rkstats>*:nth-child(2){border-radius:6px 28px 6px 28px}.rkstats>*:nth-child(3){border-radius:28px 28px 6px 28px}
/* lencana */
.bdg{border-radius:26px 26px 26px 6px;border-top:4px solid var(--ca)}
.bdg:nth-child(even){border-radius:6px 26px 26px 26px}
.bdg.on{background:color-mix(in srgb,var(--ca) 12%,var(--card))}
.pill,.chip{border-radius:14px 99px 99px 14px}
.chip:nth-child(even),.pill:nth-child(even){border-radius:99px 14px 14px 99px}

/* ===================== PROFIL ala profil WhatsApp ===================== */
.phero{padding:0;border-radius:44px 44px 22px 22px;overflow:hidden;background:var(--card2);border:1px solid var(--ln);box-shadow:0 22px 44px -26px rgba(var(--shc),.5)}
.pbg{display:none}
.pcover{position:relative;height:132px;background:
  linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(120deg,var(--moss) 0%,#e9953d 50%,var(--lav) 100%)}
:root[data-theme="dark"] .pcover{background:
  linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(120deg,#c2512f 0%,#c58a32 50%,#6a55b8 100%)}
.pcl{position:absolute;right:18px;top:14px;font:700 11px "Plus Jakarta Sans";letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.22);padding:5px 12px;border-radius:99px}
.phero .pin{display:flex;align-items:flex-end;gap:18px;padding:0 26px 20px;margin-top:-56px;flex-wrap:wrap}
.pavw{padding:5px;background:var(--card2);box-shadow:0 0 0 5px var(--card2),0 14px 30px -12px rgba(var(--shc),.55);border-radius:50%}
.pmeta{padding-top:58px}
.pmeta h2{font-size:clamp(22px,4vw,30px)}
.ptitle{color:var(--ca,var(--moss));font-weight:700}
.ptitle span{background:rgba(var(--acc),.14);color:var(--moss2)}
:root[data-theme="dark"] .ptitle span{color:var(--moss)}
.xp{background:var(--wash);border:1px solid var(--ln)}.xp i{background:linear-gradient(90deg,var(--moss),var(--gold),var(--lav))}
.pout{margin-left:auto;align-self:flex-start;margin-top:64px}
.pinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid var(--ln)}
.pi{display:flex;align-items:center;gap:13px;padding:15px 24px;border-bottom:1px dashed var(--ln);cursor:default;min-width:0}

.ptabs{background:var(--card);border-radius:20px 8px 20px 8px}

.wagrid>div:nth-child(2){border-radius:6px 28px 28px 28px}.wagrid>div:nth-child(3){border-radius:28px 6px 28px 28px}.wagrid>div:nth-child(4){border-radius:28px 28px 6px 28px}
.wagrid b{display:block;font:700 20px "Bricolage Grotesque",sans-serif;color:var(--ca)}
@media(max-width:700px){.wagrid{grid-template-columns:1fr 1fr!important}.pout{margin-top:12px}.pmeta{padding-top:6px}}

/* ===== HEADER ngikut tema ===== */

header.scrolled{box-shadow:0 10px 26px -14px rgba(var(--shc),.45)!important}

/* ===== BANNER PROMO BARU: tiket + pita berjalan ===== */

@keyframes pr2m{to{transform:translateX(-50%)}}
.pr2-body{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch}
.pr2-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:180px;padding:26px 34px;color:var(--on);background:linear-gradient(160deg,var(--moss),#e9953d);border-right:3px dashed rgba(255,255,255,.6)}
.pr2-stub b{font:800 58px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.pr2-stub small{font:700 11px "Plus Jakarta Sans";letter-spacing:.18em}
.pr2-stub::before,.pr2-stub::after{content:"";position:absolute;right:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);z-index:2}
.pr2-stub::before{top:-11px}.pr2-stub::after{bottom:-11px}
.pr2-main{padding:24px 28px;min-width:0}
.pr2-main h2{margin:2px 0 6px}
.pr2-side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px 28px;background:var(--wash);text-align:center}
.pr2-side small{color:var(--mute);font-weight:600;font-size:12px}
@media(max-width:860px){.pr2-body{grid-template-columns:1fr}.pr2-stub{flex-direction:row;gap:12px;padding:16px;border-right:0;border-bottom:3px dashed rgba(255,255,255,.6)}.pr2-stub b{font-size:40px}.pr2-stub::before,.pr2-stub::after{display:none}.pr2-side .btn{width:100%}}

/* banner maintenance: pita hazard */
.mb div{position:relative;padding:12px 18px 12px 56px;border-radius:18px 6px 18px 6px;background:var(--card2);border:1px solid rgba(var(--gld),.5);color:var(--t);box-shadow:0 12px 26px -16px rgba(var(--gld),.6);overflow:hidden}
.mb div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:38px;background:repeating-linear-gradient(-45deg,rgba(var(--gld),.95) 0 8px,#3a2a20 8px 16px)}
.mb div.red{background:var(--card2);border-color:var(--rose);color:var(--t)}
.mb div.red::before{background:repeating-linear-gradient(-45deg,var(--rose) 0 8px,#fff 8px 16px)}

/* ===== TATA LETAK BEDA-BEDA ===== */
.catmap{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.catmap .cat:nth-child(1){grid-column:span 4;grid-row:span 2;min-height:360px;padding:32px}
.catmap .cat:nth-child(1) h3{font-size:30px!important}
.catmap .cat:nth-child(2),.catmap .cat:nth-child(3){grid-column:span 2}
.catmap .cat:nth-child(4){grid-column:span 6;min-height:0;flex-direction:row;align-items:center;gap:20px}
.catmap .cat:nth-child(4) small{margin:0 0 0 auto}
@media(max-width:860px){.catmap{grid-template-columns:1fr}.catmap .cat{grid-column:auto!important;grid-row:auto!important;min-height:0!important}.catmap .cat:nth-child(4){flex-direction:column;align-items:flex-start}}
.sgrid{gap:14px!important;background:none!important;border:0!important;overflow:visible!important}
.sgrid .stat{border:1px solid var(--ln)!important;border-bottom:5px solid var(--ca)!important;background:var(--card)!important;text-align:center!important}
.sgrid .stat:nth-child(even){transform:translateY(16px)}
.sgrid{margin-bottom:16px}
.steps .step:nth-child(even){margin-top:28px}
.g3>.glass:nth-child(2){margin-top:26px}
.g3>.glass:nth-child(3){margin-top:52px}
@media(max-width:860px){.sgrid .stat:nth-child(even),.steps .step:nth-child(even),.g3>.glass{margin-top:0;transform:none}}

/* ===== DATABASE FITUR DIPAKAI ===== */
.usg{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:22px}
.usg-hero{grid-column:span 6;grid-row:span 3;padding:30px;border-radius:46px 12px 46px 12px;background:linear-gradient(150deg,rgba(var(--acc),.14),var(--card))}
.usg-big{font:800 clamp(44px,7vw,76px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;color:var(--moss);margin:14px 0 4px}
.usg-big small{font-size:.4em;margin-left:4px;color:var(--mute)}
.usg-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.usg-meta div{padding:10px 12px;border-radius:16px 16px 16px 4px;background:var(--wash);border:1px solid var(--ln)}
.usg-meta b{display:block;font:700 20px "Bricolage Grotesque",sans-serif;color:var(--gold)}.usg-meta span{font-size:11.5px;color:var(--mute)}
.usg-p{position:relative;padding:18px 20px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.usg-p1{grid-column:span 6;border-radius:12px 40px 12px 40px;border-top:5px solid var(--gold)}
.usg-p2{grid-column:span 3;border-radius:34px 12px 34px 12px;border-top:5px solid var(--sky)}
.usg-p3{grid-column:span 3;border-radius:12px 34px 12px 34px;border-top:5px solid var(--rose)}
.usg-p code{font:700 18px ui-monospace,monospace}.usg-p b{font:700 22px "Bricolage Grotesque",sans-serif;color:var(--gold)}
.usg-rk{position:absolute;right:16px;top:12px;font-size:24px}
.ub{height:5px;border-radius:5px;background:var(--wash);overflow:hidden;margin-top:6px}
.ub i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--moss2),var(--moss),var(--gold))}
.usg-list{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.usg-i{padding:10px 18px;cursor:pointer;border-radius:999px 18px 18px 999px;border-left:5px solid var(--ca)}
.usg-i:nth-child(even){border-radius:18px 999px 999px 18px;border-left:1px solid var(--ln);border-right:5px solid var(--ca)}
.usg-i div{display:flex;justify-content:space-between;gap:8px;font-size:13px}.usg-i code{font-weight:700}.usg-i span{color:var(--gold);font-weight:700}
@media(max-width:860px){.usg>*{grid-column:1/-1!important;grid-row:auto!important}.usg-p2,.usg-p3{grid-column:span 6!important}}

/* ================= V2: tiap bagian punya bentuk & penempatan sendiri ================= */
:root{--paper:#fff8dc;--paper2:#fdf0b8;--ink:#2f2616}
:root[data-theme="dark"]{--paper:#2a2318;--paper2:#352c1c;--ink:#f1e6c8}
body .center.mt{text-align:left;border-left:6px solid var(--gold);padding-left:18px;max-width:760px}
body .center.mt .sub{max-width:620px}
/* 1. HERO: judul raksasa, kartu jam miring menimpa */
body .hero2{grid-template-columns:1.3fr .7fr;gap:0;position:relative;padding:44px 0 30px}
body .hero2 h1{font-size:clamp(46px,8.4vw,104px);line-height:.92;letter-spacing:-.045em}
body .hero2 .lvs{transform:rotate(1.6deg) translateX(-26px);z-index:2;margin-top:34px}
/* 2. STAT: pil panjang, angka besar sejajar */
body .sgrid{border-radius:999px;border:2px solid var(--t);background:transparent}
body .sgrid .stat{text-align:center;padding:16px 10px}
body .sgrid .stat:nth-child(even){transform:none}
body .sgrid .stat b{font-size:30px}
/* 3. BENTO: slab gelap + sudut tajam bergantian */
body .bento .b-st{background:#12261f;color:#e8f4ea;border-radius:4px 40px 4px 40px;border:0}
body .bento .b-st small,body .bento .b-st h4{color:#9db5a8}
body .bento .bc:nth-child(odd):not(.b-st){border-radius:30px 6px 30px 6px}
body .bento .bc:nth-child(even):not(.b-st){border-radius:6px 30px 6px 30px}
/* 4. FITUR UNGGULAN: majalah, aksen kiri, tanpa kotak penuh */
body .fb{grid-template-columns:1.25fr 1fr 1fr;gap:0 22px}
body .fb .feat{background:transparent;backdrop-filter:none;box-shadow:none;border:0;border-left:4px solid var(--gold);border-radius:0;padding:6px 0 6px 18px;margin-bottom:22px}
body .fb .feat:first-child{background:var(--card);border:0;border-left:0;border-radius:34px 4px 34px 4px;padding:30px;margin-bottom:0}
body .fb .feat:nth-child(3n){border-left-color:var(--sky)}
body .fb .feat:nth-child(3n+2){border-left-color:var(--rose)}
/* 5. KATEGORI: daftar bernomor, bukan kartu */
body .catmap{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--t);counter-reset:cm;margin-top:22px}
body .catmap .cat{counter-increment:cm;display:grid;grid-template-columns:70px 1fr auto;grid-template-areas:"n h s" "n p s";align-items:center;gap:2px 18px;min-height:0;padding:24px 10px;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
body .catmap .cat::before{content:"0" counter(cm);grid-area:n;font:600 40px "Bricolage Grotesque",sans-serif;color:var(--gold);opacity:.8}
body .catmap .cat .ic{display:none}
body .catmap .cat h3{grid-area:h;font-size:24px!important}
body .catmap .cat .sub{grid-area:p}
body .catmap .cat small{grid-area:s;margin:0;padding:8px 16px;border:1.5px solid var(--moss);border-radius:99px;white-space:nowrap}
body .catmap .cat:hover{transform:none;padding-left:26px;background:var(--wash);box-shadow:none}
/* 6. LANGKAH: timeline vertikal */
body .steps{display:block;max-width:720px;margin:30px 0 0 16px;padding-left:38px;border-left:2px dashed var(--ln)}
body .step{background:transparent;border:0;box-shadow:none;backdrop-filter:none;border-radius:0;padding:0 0 30px}
body .step:hover{transform:none;background:transparent;box-shadow:none}
body .step::before{top:-2px;left:-60px;width:42px;height:42px}
/* 7. ALASAN: satu buku besar dengan 3 kolom */
body .g3{gap:0;border:2px solid var(--t);border-radius:6px 44px 6px 44px;overflow:hidden;background:var(--card)}
body .g3>.glass{border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;border-right:1px dashed var(--ln);padding:30px 26px}
body .g3>.glass:last-child{border-right:0}
/* 8. SHOWCASE: carousel geser (beranda) / masonry (halaman fitur) */
body .shots{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;-webkit-overflow-scrolling:touch}
body .shots .shot{flex:0 0 min(80%,330px);scroll-snap-align:start;border-radius:30px 30px 6px 6px}
body #app:has(#notesWrap) .shots{display:block;columns:3 240px;column-gap:18px;overflow:visible}
body #app:has(#notesWrap) .shots .shot{break-inside:avoid;margin-bottom:18px;border-radius:6px 30px 6px 30px}
/* 9. FAQ: dua kolom, judul kiri & daftar kanan, tanpa kotak */
body .faq{max-width:1100px;margin:70px auto 0;display:grid;grid-template-columns:330px minmax(0,1fr);column-gap:54px;align-items:start}
body .faq>*{grid-column:1}
body .faq #faqL{grid-column:2;grid-row:1/span 7}
body .faq .fh,body .faq #faqN{text-align:left}
body .faq .pills{justify-content:flex-start}
body .faq .faqi{background:transparent;backdrop-filter:none;box-shadow:none;border:0;border-bottom:1px solid var(--ln);border-radius:0;margin:0}
body .faq .faqi[open]{background:var(--wash)}
body .faq .faqcta{border-radius:30px 4px 30px 4px;margin-top:22px}
/* 10. FOOTER: papan gelap bersudut besar */
body .f2{--t:#eaf3ec;--mute:#9db5a8;--ln:rgba(255,255,255,.14);background:#10231c;color:#eaf3ec;margin-top:90px;padding:56px 20px 30px;border-radius:56px 56px 0 0}
body .f2 .up{background:transparent}
/* 11. HALAMAN PAKET: struk dengan garis titik */
body #app>.glass.pad{border-radius:6px 36px 36px 36px;border-left:8px solid var(--moss)}
body #app>.glass.pad>.grid{display:block;max-width:640px}
body #app>.glass.pad .tile{background:transparent;backdrop-filter:none;box-shadow:none;border:0;border-bottom:2px dotted var(--ln);border-radius:0;padding:18px 4px}
body #app>.glass.pad .tile:hover{transform:none;padding-left:14px;background:var(--wash)}
body .help{background:rgba(var(--gld),.16);backdrop-filter:none;border:0;border-left:6px solid var(--gold);border-radius:4px 4px 30px 4px;transform:rotate(-.5deg)}
/* 12. PERINGKAT: strip bergaris + baris tabel */
body .rkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--t);border-radius:0}
body .rkstats .glass{background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;border-right:1px solid var(--ln)}
body .rkstats .glass:last-child{border-right:0}
body .lr{border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;margin-top:0}
/* 13. CHAT & AI: panel samping lengket + jendela besar */
body .split2{grid-template-columns:280px minmax(0,1fr)}
body .split2>.glass:first-child{position:sticky;top:90px;border-radius:30px 30px 4px 30px}
body .split2>.glass:last-child{border-radius:4px 34px 34px 34px;min-height:480px}
/* 14. MASUK: tiket dengan pita atas */
body .authc{border-radius:6px 44px 6px 44px;border-top:10px solid var(--moss);max-width:460px}
/* ================= CATATAN ala macOS Notes ================= */
.nt-head{margin-top:38px}
.nt{margin-top:14px;border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:var(--surf,var(--card));box-shadow:0 30px 70px -20px rgba(var(--shc),.45)}
.nt-bar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--wash);border-bottom:1px solid var(--ln);font-size:13px}
.nt-bar b{flex:1;text-align:center;font-weight:600;margin-right:46px}.nt-bar em{font-style:normal;color:var(--mute);font-size:12px;margin-left:-40px}
.dots3{display:flex;gap:7px}.dots3 i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.dots3 i:nth-child(2){background:#febc2e}.dots3 i:nth-child(3){background:#28c840}
.nt-body{display:grid;grid-template-columns:210px 290px minmax(0,1fr);height:min(640px,78vh)}
.nt-side{background:var(--wash);border-right:1px solid var(--ln);padding:12px 8px;overflow:auto}
.nt-side h5{font:600 11px "Plus Jakarta Sans";color:var(--mute);margin:10px 10px 6px;letter-spacing:.04em}
.nt-f{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;color:var(--t);font-size:13px;cursor:pointer;text-align:left}
.nt-f span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nt-f em{font-style:normal;color:var(--mute);font-size:12px}
.nt-f:hover{background:var(--inset)}.nt-f.on{background:var(--gold);color:#2b2108}.nt-f.on em{color:#2b2108}
.nt-list{border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.nt-search{display:flex;gap:8px;align-items:center;margin:10px;padding:0 10px;border-radius:9px;background:var(--inset)}
.nt-search input{flex:1;border:0!important;background:none!important;box-shadow:none!important;padding:9px 0!important;margin:0!important;font-size:13px;color:var(--t);outline:0}
.nt-rows{overflow:auto;flex:1;padding:0 8px 10px}
.nt-rows h6{font:600 12px "Plus Jakarta Sans";margin:12px 8px 4px;color:var(--mute)}
.nt-r{padding:9px 12px;border-radius:9px;cursor:pointer}.nt-r+.nt-r{border-top:1px solid var(--ln)}
.nt-r b{display:block;font-size:14px}.nt-r span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-r span i{font-style:normal;color:var(--t);margin-right:6px;font-weight:600}
.nt-r.on{background:var(--gold);border-color:transparent}.nt-r.on,.nt-r.on span,.nt-r.on span i{color:#2b2108}.nt-r.on+.nt-r,.nt-r:has(+.nt-r.on){border-color:transparent}
.nt-ed{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.nt-tool{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--ln);color:var(--ink)}
.nt-tool .sp{flex:1;font-size:12px;opacity:.65}
.nt-tool button{border:0;background:none;color:var(--ink);font-size:17px;padding:6px 9px;border-radius:8px;cursor:pointer}.nt-tool button:hover{background:rgba(var(--gld),.3)}
.nt-back{display:none;font-size:14px!important}
.nt-paper{padding:26px 34px 40px;overflow:auto;color:var(--ink);background:repeating-linear-gradient(transparent 0 31px,rgba(var(--gld),.28) 31px 32px);line-height:32px;flex:1}
.nt-paper h3{font:700 30px/1.25 "Bricolage Grotesque",sans-serif;margin-bottom:4px;word-break:break-all}
.nt-paper h4{font:700 16px/32px "Plus Jakarta Sans";margin-top:20px}
.nt-paper p,.nt-paper li{font-size:15px;line-height:32px}.nt-paper ul{list-style:none}
.nt-paper code{padding:3px 9px;border-radius:7px;background:rgba(var(--gld),.3);font-weight:700;cursor:pointer}
.nt-tag{display:inline-block;font-size:11px;line-height:1;padding:5px 10px;border-radius:99px;background:rgba(var(--gld),.35);margin-right:6px;font-weight:600}
.nt-empty{margin:auto;text-align:center;color:var(--ink);opacity:.6;font-size:14px;padding:20px}
.nt-more{display:block;width:calc(100% - 16px);margin:8px;padding:9px;border-radius:9px;border:1px dashed var(--ln);background:none;color:var(--mute);cursor:pointer}
@media(max-width:900px){
 body .hero2{grid-template-columns:1fr}body .hero2 .lvs{transform:none;margin-top:10px}
 body .fb,body .g3{grid-template-columns:1fr}body .g3>.glass{border-right:0;border-bottom:1px dashed var(--ln)}
 body .faq{display:block}body .faq #faqL{margin-top:14px}
 body .split2{grid-template-columns:1fr}body .split2>.glass:first-child{position:static}
 body .catmap .cat{grid-template-columns:46px 1fr;grid-template-areas:"n h" "n p" "n s"}body .catmap .cat small{justify-self:start;margin-top:8px}
 body .sgrid{border-radius:28px}body .rkstats{grid-template-columns:1fr}body .rkstats .glass{border-right:0;border-bottom:1px solid var(--ln)}
 .nt-body{grid-template-columns:150px 1fr}.nt-ed{display:none}.nt.ed .nt-ed{display:flex;grid-column:1/-1;grid-row:1}.nt.ed .nt-side,.nt.ed .nt-list{display:none}.nt-back{display:inline-block}
}
@media(max-width:560px){.nt-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:78vh}
 .nt-side{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:8px}.nt-side h5{display:none}.nt-f{width:auto;flex:none;white-space:nowrap}
 .nt.ed .nt-body{grid-template-rows:1fr}.nt-paper{padding:20px 18px 30px}}
body .hero2 h1{font-size:clamp(44px,7vw,92px)}
body .hero2 .lvs{transform:rotate(1.4deg) translateX(-6px)}
body .catmap .cat{align-content:center}
body .catmap .cat h3 .off{display:inline-block;font-size:12px;line-height:1.5;margin-left:10px;vertical-align:middle}
body .catmap .cat:first-child{min-height:0}
.nt-tool{min-height:46px;box-sizing:border-box}.nt-tool button{line-height:1;height:34px;min-height:0;margin:0}
body .fb .feat:first-child{grid-row:span 2;justify-content:flex-start}


/* ================= V3: SEMUA halaman (drawer, AI, chat, profil, beli, order, owner, masuk) ================= */
/* --- Hamburger: daftar isi layar penuh, dua kolom --- */
body .drawer-backdrop{background:var(--bg)!important;backdrop-filter:none!important}
body .forest-drawer{position:absolute;inset:0;width:auto;max-height:none;overflow:auto;border:0;border-radius:0;box-shadow:none;padding:clamp(20px,4.5vw,60px);background:var(--bg);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-rows:auto auto auto auto 1fr;column-gap:clamp(24px,6vw,96px);transform:translate3d(0,-26px,0)}
body .drawer-backdrop.open .forest-drawer{transform:none}
body .drawer-top{grid-column:1/-1;grid-row:1;margin-bottom:clamp(18px,5vh,50px)}
body .drawer-quote{grid-column:1;grid-row:2/span 3;align-self:start;margin:0;padding:0 0 0 22px;background:none;border:0;border-left:5px solid var(--gold);border-radius:0;font-size:clamp(20px,2.6vw,32px);line-height:1.35;color:var(--t)}
body .drawer-foot{grid-column:1;grid-row:5;align-self:end;border:0;margin:0;padding:0}
body .drawer-label{margin:0 0 6px}
body .forest-drawer>:nth-child(3){grid-column:2;grid-row:2}
body .forest-drawer>:nth-child(4){grid-column:2;grid-row:3}
body .forest-drawer>:nth-child(5){grid-column:2;grid-row:4;margin-top:26px}
body .forest-drawer>:nth-child(6){grid-column:2;grid-row:5;align-self:start}
body .drawer-links{display:flex;flex-direction:column;gap:0}
body .drawer-link{min-height:0;padding:10px 0;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:none;font:600 clamp(22px,3.1vw,36px)/1.15 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;transition:padding .25s var(--ease),color .2s}
body .drawer-link b{background:none;width:auto;height:auto;font-size:.7em}
body .drawer-link::after{content:"↗";margin-left:auto;font-size:.6em;color:var(--mute)}
body .drawer-link:hover{transform:none;padding-left:16px;background:var(--wash);color:var(--gold)}
body .forest-drawer>:nth-child(6) .drawer-link{font-size:18px}
/* --- AI: pesan besar di kiri, panel info lengket di kanan --- */
body .split2:has(>.glass>img){grid-template-columns:minmax(0,1fr) 300px}
body .split2:has(>.glass>img)>.glass:first-child{order:2;border-radius:30px 4px 30px 30px}

/* --- Order: struk bergerigi di tengah --- */

 body .forest-drawer{display:block}body .drawer-quote{font-size:18px;margin-bottom:18px}body .drawer-foot{margin-top:26px}

/* ================= V5: KOTAK SOLID GAYA STIKER + HAMBURGER + DRAWER BARU ================= */
:root{--solid:#fffaf1;--edge:#3a2a20;--ink0:#3a2a20;--mute0:#7b6858}
:root[data-theme="dark"]{--solid:#241c16;--edge:rgba(240,220,190,.68);--ink0:#f6ebdb;--mute0:#bba995}

/* --- aksen warna beda tiap halaman --- */
html body .wrap:has(.split2):not(:has(.split2>.glass>img)){--moss:var(--sage);--moss2:#2f7a5a;--acc:77,148,115}
html body .wrap:has(.split2>.glass>img){--moss:var(--lav);--moss2:#5e49b0;--acc:123,98,201}
html body .wrap:has(.podium),html body .wrap:has(.rkstats){--moss:var(--gold);--moss2:#8a5510;--acc:200,135,30}
html body .wrap:has(#notesWrap){--moss:var(--sky);--moss2:#215f8a;--acc:47,127,181}

/* --- semua kotak: solid, tepi tebal, bayangan keras --- */
html body .glass{background:var(--solid)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:2px solid var(--edge)!important;box-shadow:5px 5px 0 var(--ca,var(--moss))!important;transition:transform .22s var(--spring),box-shadow .22s var(--ease)}
html body :is(.cmdc,.lr,.tc,.usg-i,.faqi,.ord,.tile,.bdg,.wagrid>div,.rkstats .glass,.cgrid .glass){box-shadow:3px 3px 0 var(--ca,var(--moss))!important}
html body :is(.wagrid>div,.bdg,.pkg,.pi){background:var(--solid);border:2px solid var(--edge)}
html body :is(.cat,.tile,.feat,.ord,.shot,.tc,.usg-p,.usg-i,.cmdc,.lr,.pkg):hover{transform:translate(-2px,-3px);background:var(--solid)!important;border-color:var(--edge)!important;box-shadow:8px 8px 0 var(--ca,var(--moss))!important}
html body :is(.cat,.tile,.feat,.ord,.shot,.tc,.usg-p,.usg-i,.cmdc,.lr,.pkg):active{transform:translate(3px,3px)!important;box-shadow:1px 1px 0 var(--ca,var(--moss))!important}
html body .help{background:color-mix(in srgb,var(--gold) 16%,var(--solid))!important;transform:none}
html body :is(.b-st,.usg-hero,.fb .feat:first-child){background:color-mix(in srgb,var(--moss) 13%,var(--solid))!important}
html body .bento .b-st{color:var(--t)}
html body .bento .b-st small,html body .bento .b-st h4{color:var(--mute)}
html body .faqi[open]{background:color-mix(in srgb,var(--ca) 10%,var(--solid))!important}
html body .note{border:2px dashed var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--solid))}

/* --- tombol, chip, input --- */
html body .btn{border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge);background:var(--moss);color:var(--on)}
:root[data-theme="dark"] body .btn{background:var(--moss)}
html body .btn:hover{transform:translate(-1px,-2px);box-shadow:5px 5px 0 var(--edge);filter:none}
html body .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
html body .btn.ghost{background:var(--solid);color:var(--t)}
html body .btn.red{background:var(--rose);color:#fff}
html body .btn:disabled{box-shadow:1px 1px 0 var(--edge)}
html body :is(.pill,.chip){background:var(--solid);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge);color:var(--t);font-weight:600}
html body .pill.on{background:var(--moss);color:var(--on)}
html body input:not([type=checkbox]):not([type=file]),html body :is(textarea,select){border:2px solid var(--edge);background:var(--solid);border-radius:14px}
html body :is(input,textarea,select):focus{border-color:var(--edge);box-shadow:3px 3px 0 var(--moss);background:var(--solid);outline:0}
html body .nt-search input{box-shadow:none!important}
html body #toast{border:2px solid var(--edge);box-shadow:4px 4px 0 var(--moss)}
html body .mb div{border:2px solid var(--edge);box-shadow:4px 4px 0 var(--gold)}
html body .loader{background:var(--solid);border:2px solid var(--edge);box-shadow:6px 6px 0 var(--moss)}

/* --- header menempel dengan garis warna --- */
html body header,html body header.scrolled{background:var(--solid)!important;border-bottom:2px solid var(--edge)!important;box-shadow:0 5px 0 var(--moss)!important}
html body header .bar.glass{background:transparent!important;border:0!important;box-shadow:none!important}
html body :is(.tbtn,.clk,.stat-chip,.lg){background:var(--solid);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge)}
html body .logo .brand-badge{border:2px solid var(--edge);box-shadow:2px 2px 0 var(--moss)}

/* ===== HAMBURGER BARU ===== */
html body .menu-toggle{width:46px;height:46px;border-radius:15px 15px 15px 5px;border:2px solid var(--edge);background:var(--moss);box-shadow:3px 3px 0 var(--edge);transition:transform .2s var(--spring),box-shadow .2s,background .25s,border-radius .3s}
html body .menu-toggle:hover{background:var(--moss);transform:translate(-1px,-2px);box-shadow:5px 5px 0 var(--edge);border-color:var(--edge)}
html body .menu-toggle:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
html body .menu-toggle.active{background:var(--gold);border-radius:15px 5px 15px 15px}
html body .menu-toggle span{left:50%;top:50%;width:20px;height:3px;margin:-1.5px 0 0 -10px;border-radius:3px;background:var(--on);transition:transform .35s var(--spring),width .25s var(--ease),opacity .2s}
html body .menu-toggle span:nth-child(1){transform:translateY(-7px)}
html body .menu-toggle span:nth-child(2){width:12px;transform:translateX(4px)}
html body .menu-toggle span:nth-child(3){transform:translateY(7px)}
html body .menu-toggle:hover span:nth-child(2){width:20px;transform:translateX(0)}
html body .menu-toggle.active span:nth-child(1){transform:rotate(45deg)}
html body .menu-toggle.active span:nth-child(2){opacity:0;transform:scaleX(.2)}
html body .menu-toggle.active span:nth-child(3){transform:rotate(-45deg)}

/* ===== DRAWER: panel stiker + kartu menu berwarna ===== */
html body .drawer-backdrop{background:rgba(45,28,14,.55)!important;backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
:root[data-theme="dark"] .drawer-backdrop{background:rgba(0,0,0,.68)!important}
html body .forest-drawer{position:relative;inset:auto;top:auto;right:auto;left:auto;bottom:auto;width:min(1060px,100%);max-height:calc(100dvh - 32px);margin:auto;overflow:auto;padding:clamp(18px,3vw,34px);background:var(--solid);border:2px solid var(--edge);border-radius:40px 12px 40px 12px;box-shadow:10px 10px 0 var(--moss);display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);grid-template-rows:auto auto auto auto 1fr;gap:0 clamp(18px,3vw,34px);transform:translateY(26px) rotate(-.8deg) scale(.97);opacity:0;transition:transform .42s var(--spring),opacity .26s ease}
html body .drawer-backdrop.open .forest-drawer{transform:none;opacity:1}
html body .drawer-top{grid-column:1/-1;margin-bottom:22px;padding-bottom:16px;border-bottom:2px dashed var(--ln)}
html body .drawer-brand{font-size:22px}
html body .drawer-brand img{width:46px;height:46px;border-radius:14px 14px 14px 4px;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--moss)}
html body .drawer-close{width:42px;height:42px;border-radius:13px 13px 13px 4px;border:2px solid var(--edge);background:var(--rose);color:#fff;box-shadow:3px 3px 0 var(--edge);font-size:22px;font-weight:700;line-height:1}
html body .drawer-close:hover{background:var(--rose);transform:translate(-1px,-1px) rotate(8deg)}
html body .drawer-close:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
html body .drawer-quote{grid-column:1;grid-row:2/span 3;align-self:stretch;position:relative;margin:0;padding:70px 24px 24px;border:2px solid var(--edge);border-radius:32px 32px 32px 8px;background:radial-gradient(rgba(255,255,255,.28) 1.6px,transparent 1.7px) 0 0/16px 16px,linear-gradient(150deg,var(--moss),#e9953d);color:var(--on);font:italic 600 clamp(17px,1.9vw,23px)/1.5 "Bricolage Grotesque",sans-serif;box-shadow:5px 5px 0 var(--edge);display:flex;align-items:flex-end}
html body .drawer-quote::before{content:"“";position:absolute;top:8px;left:20px;font:800 96px/1 "Bricolage Grotesque",sans-serif;opacity:.5}
html body .drawer-foot{grid-column:1;grid-row:5;align-self:end;margin:16px 0 0;padding:12px 14px;border:2px dashed var(--ln);border-radius:16px;background:var(--wash);font-size:11.5px;color:var(--mute)}
html body .drawer-label{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:700 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--moss2)}
html body .drawer-label::after{content:"";flex:1;border-top:2px dashed var(--ln)}
html body .forest-drawer>:nth-child(5){margin-top:24px}
html body .drawer-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
html body .drawer-link{--ca:var(--moss);position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:12px;min-height:0;padding:11px 14px 11px 12px;text-align:left;background:var(--solid);border:2px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--ca);font:inherit;color:var(--t);cursor:pointer;transition:transform .22s var(--spring),box-shadow .22s var(--ease)}
html body .drawer-link:nth-child(6n+2){--ca:var(--sage)}
html body .drawer-link:nth-child(6n+3){--ca:var(--gold)}
html body .drawer-link:nth-child(6n+4){--ca:var(--sky)}
html body .drawer-link:nth-child(6n+5){--ca:var(--lav)}
html body .drawer-link:nth-child(6n+6){--ca:var(--rose)}
html body .drawer-link:nth-child(even){border-radius:18px 18px 4px 18px}
html body .drawer-link b{width:46px;height:46px;display:grid;place-items:center;border-radius:14px 14px 14px 4px;background:color-mix(in srgb,var(--ca) 24%,var(--solid));border:2px solid var(--edge);font-size:22px}
html body .drawer-link span{min-width:0}
html body .drawer-link em{display:block;font:700 15px/1.2 "Bricolage Grotesque",sans-serif;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
html body .drawer-link small{display:block;margin-top:3px;font-size:11.5px;line-height:1.3;color:var(--mute);font-weight:500}
html body .drawer-link::after{content:"↗";position:absolute;right:11px;top:9px;margin:0;font-size:13px;font-weight:700;color:var(--ca);transition:transform .25s var(--spring)}
html body .drawer-link:hover{transform:translate(-2px,-3px);padding:11px 14px 11px 12px;background:var(--solid);color:var(--t);box-shadow:7px 7px 0 var(--ca)}
html body .drawer-link:hover::after{transform:translate(2px,-2px)}
html body .drawer-link:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ca)}
html body .forest-drawer>:nth-child(6) .drawer-link{font-size:inherit}
@media(max-width:900px){
 html body .forest-drawer{display:block;border-radius:30px 10px 30px 10px;box-shadow:6px 6px 0 var(--moss)}
 html body .drawer-quote{padding:60px 20px 20px;margin-bottom:22px;display:block;font-size:18px}

html body .phone{border:2px solid var(--edge);box-shadow:8px 8px 0 var(--sky)}
html body .bub{border:2px solid var(--edge)}
html body .pr2{border:2px solid var(--edge);box-shadow:8px 8px 0 var(--gold)}
html body .lv{border-radius:40px 40px 40px 10px}
