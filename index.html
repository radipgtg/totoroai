function toggleForestMenu(){

async function pullChat(first){
 const c=$("#chat");if(!c||location.hash!=="#komunitas")return;
 let j;try{j=await api("/api/chat")}catch{return}
 const key=j.messages.length+":"+(j.messages.at(-1)?.id||"");if(key===CHK&&!first)return;CHK=key;

 c.innerHTML=j.messages.length?j.messages.map(m=>{const mine=ME&&m.uid===ME.id,u=mine?{...m,name:ME.name,av:ME.av,id:ME.id}:m,own=m.role==="owner"||(mine&&ME.role==="owner");return `<div class="cm ${mine?"mine":""}">${avatarTry({...u,id:m.uid||u.id},32)}<div class="bx"><div class="nm"><b style="color:var(--t)">${esc(u.name)}</b>${own?'<span class="rl">Owner</span>':""}<span>${hm(m.t)}</span>${ME?.role==="owner"?`<button class="x" onclick="delChat('${m.id}')">hapus</button>`:""}</div><div class="tx">${esc(m.text)}</div></div></div>`}).join(""):`<div class="center sub" style="margin:auto">Belum ada obrolan.</div>`;
 if(near)c.scrollTop=c.scrollHeight}

function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};i.onerror=no;i.src=URL.createObjectURL(f)})}
function square(f,S=256){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=S;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,S,S);ok(c.toDataURL("image/jpeg",.86))};i.onerror=no;i.src=URL.createObjectURL(f)})}

function nList(){
 const q=NQ.trim().toLowerCase().replace(/^\./,""),fv=nFavs();
 return FEAT.items.filter(i=>(NF==="all"||(NF==="fav"?fv.includes(i.n):i.c===NF))&&(!q||i.n.toLowerCase().includes(q)||(i.d||"").toLowerCase().includes(q)||i.c.includes(q)||(i.a||[]).some(a=>a.toLowerCase().includes(q))))}
function notesInit(){
 const w=$("#notesWrap");if(!w||!FEAT)return;
 if(NF!=="all"&&NF!=="fav"&&!FEAT.cats.some(c=>c.c===NF))NF="all";
 w.innerHTML=`<div class="nt${NED?" ed":""}" id="nt"><div class="nt-bar"><span class="dots3"><i></i><i></i><i></i></span><b>${T("Daftar Perintah","Command Notes")}</b><em id="ntC"></em></div>
 <div class="nt-body"><aside class="nt-side" id="ntS"></aside><section class="nt-list"><div class="nt-search"><input id="fq" placeholder="${T("Cari perintah…","Search commands…")}" value="${esc(NQ)}" oninput="nSearch(this.value)"></div><div class="nt-rows" id="ntR"></div></section><article class="nt-ed" id="ntE"></article></div></div>`;
 nSide();nRows();nEd()}
function nSide(){
 const N=FEAT.items.length,fv=nFavs().length,b=(k,l,n)=>`<button class="nt-f${NF===k?" on":""}" data-k="${esc(k)}" onclick="nFolder(this.dataset.k)"><span>${l}</span><em>${n}</em></button>`;
 $("#ntS").innerHTML=`<h5>${T("Menu","Menu")}</h5>${b("all",T("Semua","All"),N)}${b("fav",T("Disematkan","Pinned"),fv)}<h5>${T("Kategori","Categories")}</h5>${FEAT.cats.map(c=>b(c.c,esc(c.c),c.n)).join("")}`}
function nRows(){
 const L=nList(),fv=nFavs(),el=$("#ntR");if(!el)return;
 if(!L.some(i=>i.n===NSEL))NSEL=L[0]?L[0].n:"";
 const row=i=>`<div class="nt-r${i.n===NSEL?" on":""}" data-n="${esc(i.n)}" onclick="nPick(this.dataset.n)"><b>.${esc(i.n)}</b><span><i>${esc(i.c)}</i>${esc(i.d||"")}</span></div>`;
 const pin=NF==="all"&&!NQ.trim()?L.filter(i=>fv.includes(i.n)):[],rest=pin.length?L.filter(i=>!fv.includes(i.n)):L,sh=rest.slice(0,NMORE);
 el.innerHTML=(pin.length?`<h6>${T("Disematkan","Pinned")}</h6>${pin.map(row).join("")}<h6>${T("Semua","All")}</h6>`:"")+sh.map(row).join("")
  +(rest.length>NMORE?`<button class="nt-more" onclick="NMORE+=300;nRows()">${T("Tampilkan lebih banyak","Show more")} (${rest.length-NMORE})</button>`:"")
  +(L.length?"":`<div class="nt-empty">${T("Tidak ada yang cocok.","No matches.")}</div>`);
 $("#ntC").textContent=L.length.toLocaleString(LANG==="en"?"en-US":"id-ID")+" "+T("perintah","commands")}
function nEd(){
 const el=$("#ntE");if(!el)return;const i=FEAT.items.find(x=>x.n===NSEL);
 if(!i){el.innerHTML=`<div class="nt-empty">${T("Pilih perintah untuk membaca detailnya.","Select a command to view details.")}</div>`;return}
 const fv=nFavs().includes(i.n),fl=i.f==="owner"?T("Khusus owner bot.","Owner only."):i.f==="premium"?T("Khusus pengguna premium.","Premium users only."):T("Dapat dipakai semua pengguna.","Available to all users.");
 el.innerHTML=`<div class="nt-tool"><button class="nt-back" onclick="nBack()">‹ ${T("Daftar","List")}</button><span class="sp">${esc(i.c)}</span><button onclick="nFav()">${fv?T("Lepas pin","Unpin"):T("Pin","Pin")}</button><button onclick="nCopy('.'+NSEL)">${T("Salin","Copy")}</button></div>
 <div class="nt-paper"><h3>.${esc(i.n)}</h3><div><span class="nt-tag">${esc(i.c)}</span>${i.f?`<span class="nt-tag">${i.f}</span>`:""}</div>
 <p style="margin-top:10px">${esc(i.d)||T("Belum ada deskripsi.","No description.")}</p>
 <h4>${T("Cara pakai","How to use")}</h4><ul><li>${T("Ketik","Type")} <code onclick="nCopy('.${esc(i.n)}')">.${esc(i.n)}</code> ${T("di WhatsApp","in WhatsApp")}</li><li>${esc(fl)}</li></ul>
 ${i.a&&i.a.length?`<h4>${T("Alias","Aliases")}</h4><p>${i.a.map(a=>`<code onclick="nCopy('.${esc(a)}')">.${esc(a)}</code>`).join(" ")}</p>`:""}</div>`}
function nCopy(c){navigator.clipboard?.writeText(c);toast(T("Disalin: ","Copied: ")+c)}
function nPick(n){NSEL=n;NED=true;nRows();nEd();$("#nt").classList.add("ed")}
function nBack(){NED=false;$("#nt").classList.remove("ed")}
function nFolder(k){NF=k;NMORE=200;NED=false;$("#nt").classList.remove("ed");nSide();nRows();nEd()}
function nSearch(v){NQ=v;NMORE=200;nRows();nEd()}
function nFav(){const a=nFavs(),k=a.indexOf(NSEL);k>-1?a.splice(k,1):a.push(NSEL);nSaveFav(a);nSide();nRows();nEd();toast(k>-1?T("Sematan dilepas","Unpinned"):T("Disematkan","Pinned"))}

/* Tema gelap/terang */
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("tt_theme",t)}catch(e){}
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#0F1713":"#FAF7F0"}
function toggleTheme(){
 const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
 setTheme(next);
}
setTheme(document.documentElement.dataset.theme||"light");

/* Translator ID -> EN */
const TD=new Map(Object.entries({"Sudut Hutan Totoro":"Totoro's Forest Corner","Masuk Akun":"Log In","Pilih Paket":"Choose Package","Bayar QRIS":"Pay QRIS","Owner ACC":"Owner Approves","Cepat":"Fast","Responsif":"Responsive","Bergaransi":"Guaranteed","Belum bayar":"Unpaid","Menunggu ACC":"Awaiting approval","Berhasil":"Successful","Ditolak":"Rejected","Konfirmasi Pesanan":"Confirm Order","Pilih paket":"Choose package","Buat Pesanan & Bayar":"Place Order & Pay","Ringkasan Pesanan":"Order Summary","Cara pembayaran":"Payment steps","1. Scan QRIS & Bayar":"1. Scan QRIS & Pay","2. Kirim Bukti Transfer":"2. Send Transfer Proof","Kirim Bukti Transfer":"Send Transfer Proof","Unduh QRIS":"Download QRIS","Total yang harus dibayar":"Total amount to pay","Ruang Owner":"Owner Room","Siaran ke Channel":"Broadcast to Channel","Diskon & Banner Promo":"Discounts & Promo Banner","Pesanan Terbaru":"Latest Orders","Simpan Pengaturan":"Save Settings","Kirim ke Channel":"Send to Channel","Pertanyaan Umum":"Frequently Asked Questions"}));
const TX=[[/\b(\d+) Hari\b/,"$1 Days"],[/\bReseller (\d+) Bulan\b/,"Reseller $1 Months"],[/^Sewa Bot WA/,"WA Bot Rental"],[/^Jasa & Tools/,"Services & Tools"]];
function trStr(s){if(LANG!=="en"||!s||typeof s!=="string")return s;const d=TD.get(s.trim());if(d)return d;for(const[r,v]of TX)if(r.test(s))return s.replace(r,v);return s}
function trTree(root){if(!root||LANG!=="en")return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode?.nodeName||""))continue;const r=trStr(n.nodeValue);if(r!==n.nodeValue){if(n.__o===undefined)n.__o=n.nodeValue;n.nodeValue=r}}}
function trAll(){if(LANG==="en")trTree(document.body);else{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.__o!==undefined){n.nodeValue=n.__o;n.__o=undefined}}}
new MutationObserver(ms=>{if(LANG!=="en")return;ms.forEach(m=>m.addedNodes.forEach(trTree))}).observe(document.body,{childList:true,subtree:true});

async function claimGo(){
  const b=$("#gB"),wa=$("#gW").value;
  const digits=String(wa||"").replace(/\D/g,"");
  if(digits.length<10){toast("Nomor WhatsApp-nya belum pas, coba periksa lagi");return}
  b.disabled=true;b.textContent="Mengirim…";
  try{
    const j=await api("/api/claim",{b:{wa}});
    if(ME&&!ME.wa)ME.wa=j.number;
    toast("Hadiah premium berhasil diklaim!");
    vGratis();
  }catch(e){
    toast(""+(e.message||"Hadiah belum bisa terkirim"));
    b.disabled=false;b.textContent="Terima Hadiah";
  }
}

async function vGratis(){
  if(!ME){NEXT="gratis";go("masuk");return}
  app.innerHTML=`<section class="gr-wrap"><div class="glass pad center">Memuat status hadiah…</div></section>`;
  let st={claimed:false};
  try{st=await api("/api/claim/status")}catch(e){st={error:e.message}}
  const ben=[
    "Akses fitur premium bot WhatsApp selama 30 hari",
    "Aktif otomatis di nomor WhatsApp pilihanmu",
    "Gratis tanpa biaya tambahan dan tanpa kartu"
  ];
  const body=st.error
    ?`<div class="gr-error">${esc(st.error)}</div>`
    :st.claimed
      ?`<div class="gr-already"><div><h3>Hadiah premium sudah aktif</h3><p class="sub">Premium tercatat untuk nomor <b>+${esc(st.number||"")}</b> dan berlaku sampai <b>${st.expiredAt?dt(st.expiredAt):"-"}</b>.</p></div></div>
        <button class="gr-btn gr-btn-ghost" onclick="go('katalog')">Jelajahi Katalog</button>`
      :`<label for="gW">Nomor WhatsApp-mu</label>
        <input id="gW" inputmode="tel" value="${esc(ME.wa||"")}" placeholder="08123456789" onkeydown="if(event.key==='Enter')claimGo()">
        <p class="gr-hint">Pastikan nomor benar dan aktif karena hanya bisa diklaim sekali per akun.</p>
        <button class="gr-btn" id="gB" onclick="claimGo()">Terima Hadiah</button>
        <p class="gr-note">Satu kali per akun dan per nomor WhatsApp.</p>`;
  app.innerHTML=`<section class="gr-wrap">
    <div class="gr-box">
      <div class="gr-head">
        <span class="gr-icon">${ic("gratis",24)}</span>
        <span class="gr-eyebrow">Hadiah Pengguna</span>
        <h2>Premium Gratis 30 Hari</h2>
        <p class="gr-sub">Aktifkan akses premium bot WhatsApp selama 30 hari untuk nomor WhatsApp-mu.</p>
      </div>
      <ul class="gr-benefits">${ben.map(x=>`<li><i>✓</i><span>${x}</span></li>`).join("")}</ul>
      <div class="gr-form">${body}</div>
    </div>
  </section>`;
  setTimeout(initReveal,40);
}

/* Two-panel layout for checkout */
let RLB=false;
function relayout(){
 if(RLB)return;RLB=true;
 try{
  const c=document.querySelector("#app>.glass.pad:has(#pkgs):not(.bxp)");
  if(c){c.classList.add("bxp");
   const ks=[...c.children],hi=ks.findIndex(k=>k.matches(".help")),cut=hi>-1?hi+1:2;
   const w=document.createElement("div"),sd=document.createElement("aside"),mn=document.createElement("div");
   w.className="bx";sd.className="bx-side";mn.className="bx-main";
   ks.forEach((k,i)=>(i<cut?sd:mn).appendChild(k));w.append(sd,mn);c.appendChild(w)}
 }catch(e){}finally{RLB=false}}
new MutationObserver(()=>relayout()).observe(document.getElementById("app"),{childList:true});

boot();
