/* ===== KATALOG: kartu berwarna dengan pita ikon ===== */
html body .catmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;border-top:0;margin-top:22px}
html body .catmap .cat{position:relative;display:flex;flex-direction:column;gap:10px;padding:0 0 22px;min-height:0;overflow:hidden;background:var(--solid);border-radius:30px 30px 30px 8px;transition:transform .25s var(--spring),box-shadow .25s}

/* Scroll progress + reveal */
const sb=$("#scrollbar");
let scrollFrame=0,obs=null,resizeWatch=null;
function updateSB(){
 const root=document.scrollingElement||document.documentElement;
 const max=Math.max(0,root.scrollHeight-root.clientHeight);
 const progress=max>0?Math.max(0,Math.min(1,root.scrollTop/max)):0;
 sb.style.setProperty("--scroll-progress",progress.toFixed(4));
 document.querySelector("header")?.classList.toggle("scrolled",root.scrollTop>14);
}
function scheduleSB(){
 if(scrollFrame)return;
 scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;updateSB()});
}
addEventListener("scroll",scheduleSB,{passive:true});
addEventListener("resize",scheduleSB,{passive:true});
addEventListener("pageshow",scheduleSB);
addEventListener("load",scheduleSB,{once:true});
if("ResizeObserver" in window){
 resizeWatch=new ResizeObserver(scheduleSB);
 resizeWatch.observe(document.documentElement);
 resizeWatch.observe(document.body);
}
scheduleSB();

function revealAll(){
 document.querySelectorAll(".reveal:not(.in)").forEach(el=>el.classList.add("in"));
}
function initReveal(){
 const items=document.querySelectorAll(".reveal:not(.in)");
 if(!items.length)return;
 if(!("IntersectionObserver" in window)){revealAll();return}
 if(!obs){
  obs=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
    if(entry.isIntersecting){
     entry.target.classList.add("in");
     obs.unobserve(entry.target);
    }
   });
  },{threshold:0.01,rootMargin:"0px 0px -6% 0px"});
 }
 items.forEach(el=>obs.observe(el));
}
setTimeout(initReveal,100);
addEventListener("hashchange",()=>{scheduleSB();requestAnimationFrame(initReveal)});

{c:"pay",k:"bayar pembayaran qris transfer dana gopay ovo shopeepay metode nominal",q:"Pembayaran bisa lewat apa saja?",a:`<p>Pembayaran hanya lewat <b>QRIS</b>, jadi bisa memakai Dana, GoPay, OVO, ShopeePay, LinkAja, dan mobile banking apa pun yang mendukung QRIS.</p><ol><li>Buka halaman pesananmu, QRIS tampil di sana. Tombol unduh tersedia kalau kamu ingin membukanya dari galeri.</li><li>Scan, lalu masukkan nominal <b>persis sama dengan total pesanan</b>, termasuk diskon yang sedang berlaku.</li><li>Selesaikan pembayaran dan simpan tangkapan layar buktinya.</li></ol><div class="tip">Nominal kurang atau lebih bisa membuat pesanan ditolak. Periksa total sekali lagi sebelum menekan bayar.</div>`},

{c:"bot",k:"sewa bot siapkan link grup masuk otomatis perpanjang",q:"Apa yang harus disiapkan, dan bagaimana bot masuk ke grup?",a:`<p>Siapkan <b>link undangan grup</b> berbentuk https://chat.whatsapp.com/… lalu tempel saat membuat pesanan. Pastikan link masih aktif dan belum direset.</p><ul><li>Setelah di-ACC, bot masuk sendiri ke grup dan mengirim salam perkenalan. Masa sewa mulai dihitung saat itu.</li><li>Kalau grupmu memakai persetujuan admin untuk anggota baru, setujui permintaan masuk bot.</li><li><b>Perpanjang:</b> pesan paket lagi dengan link grup yang sama. Durasinya ditambahkan ke sisa masa sewa. Paket Permanen tidak akan berakhir.</li></ul>`},
{c:"panel",k:"panel pterodactyl ram gb server hosting 24 jam unlimited",q:"Panel Pterodactyl itu apa, dan pilih RAM berapa?",a:`<p>Panel adalah server untuk menjalankan bot WhatsApp atau Telegram buatanmu selama 24 jam tanpa harus menyalakan komputer.</p>${pl("panel")}<p>Panduan memilih: <b>3-4 GB</b> cukup untuk satu bot ringan atau bot pribadi; <b>5-7 GB</b> untuk bot dengan banyak fitur atau grup ramai; <b>8 GB ke atas</b> atau <b>Unlimited</b> kalau menjalankan beberapa bot sekaligus.</p><div class="tip">Setelah di-ACC, owner mengirim detail login panel ke nomor WhatsApp yang kamu isi. Cukup tunggu, tidak perlu chat duluan.</div>`},
{c:"am",k:"alight motion buyer seller bulk reseller beda perbedaan harga premium",q:"Apa beda Buyer, Seller, Bulk, dan Reseller di Alight Motion?",a:`${pl("am")}<ul><li><b>Buyer:</b> akun Alight Motion milikmu sendiri dipremiumkan lewat email dan link verifikasi.</li><li><b>Seller:</b> kamu menerima 1 akun siap pakai yang dikirim otomatis.</li><li><b>Bulk:</b> beli banyak akun sekaligus (10-50 akun per pesanan), cocok untuk dijual lagi.</li><li><b>Reseller:</b> membuka akses fitur Alight Motion di bot untuk nomor WhatsApp-mu dan masuk ke grup reseller. Tersedia 1, 2, 3 bulan, atau permanen.</li></ul>`},
{c:"am",k:"buyer email link magic verifikasi alight motion akun sendiri langkah",q:"Bagaimana langkah paket Buyer (pakai email sendiri)?",a:`<ol><li>Buat pesanan Buyer, bayar, dan tunggu ACC.</li><li>Setelah di-ACC, buka halaman pesanan. Muncul <b>Langkah 1</b>: isi email akun Alight Motion yang mau dipremiumkan, lalu kirim. Bot langsung mengirim link verifikasi ke email itu.</li><li>Buka inbox emailmu (cek folder spam), cari email dari Alight Motion, lalu salin <b>link magic</b> utuh.</li><li>Di <b>Langkah 2</b> tempel link itu dan tekan Verifikasi. Premium aktif otomatis dan kabarnya masuk ke WhatsApp-mu.</li></ol><div class="tip">Gunakan link yang masih baru dan salin utuh. Salah email? Tekan "Ganti email / kirim ulang link". Ada batas percobaan, jadi jangan menekan tombol berulang-ulang.</div>`},
{c:"am",k:"seller bulk akun login cara masuk dikirim otomatis",q:"Bagaimana menerima dan memakai akun Seller atau Bulk?",a:`<p>Setelah di-ACC, sistem mengambil akunnya otomatis. Daftar email dan link inbox tampil di halaman pesanan dan juga dikirim ke WhatsApp-mu. Cara masuk:</p><ol><li>Buka aplikasi Alight Motion, pilih login lewat <b>Email</b>.</li><li>Masukkan email akun, lalu tekan Berikutnya.</li><li>Buka link inbox akun itu di browser dan klik Refresh.</li><li>Cari email dari Alight Motion, klik <b>"Login ke alight creative"</b>, lalu pilih Alight Motion.</li></ol><p>Kalau stok sedang habis, pesanan tetap menunggu dan owner bisa mencoba ACC ulang, akun yang sudah terambil tidak hilang.</p>`},
{c:"lain",k:"jasa tools install run script tutor",q:"Apa saja layanan Jasa & Tools?",a:`${pl("jasa")}<ul><li><b>Run & Install Bot:</b> owner memasang dan menjalankan bot di panelmu.</li><li><b>Script Bot Totoro AI:</b> source code bot untuk kamu kembangkan sendiri.</li><li><b>Tutor Pembuatan Bot:</b> bimbingan membuat bot dari nol.</li></ul><p>Setelah di-ACC, owner menghubungimu lewat WhatsApp untuk langkah berikutnya.</p>`},
{c:"akun",k:"akun daftar profil username foto password ganti lupa",q:"Bagaimana mengatur akun, username, foto, dan password?",a:`<p>Buka menu <b>Profil</b>. Di sana kamu bisa:</p><ul><li>Mengganti foto profil (otomatis dipotong persegi).</li><li>Mengganti username, 3-24 karakter dan tidak boleh sama dengan pengguna lain.</li><li>Mengganti password dengan memasukkan password lama dan password baru minimal 6 karakter. Perangkat lain yang sedang masuk akan otomatis keluar.</li></ul><p>Saat ini belum ada tombol reset password otomatis. Kalau lupa password, hubungi WA Order agar dibantu.</p>`},
{c:"akun",k:"aman keamanan data privasi password nomor",q:"Apakah data saya aman?",a:`<ul><li>Password disimpan dalam bentuk acak (hash), jadi tidak ada yang bisa membacanya, termasuk owner.</li><li>Bukti transfer hanya dikirim ke owner untuk pemeriksaan.</li><li>Nomor WhatsApp di leaderboard dan pengumuman channel disamarkan sebagian.</li><li>Percobaan masuk yang salah dibatasi supaya akunmu sulit ditebak orang lain.</li></ul><div class="tip">Totoro dan admin tidak pernah meminta password atau kode OTP-mu. Abaikan siapa pun yang memintanya.</div>`},
{c:"lain",k:"garansi jaminan refund kendala rusak masalah",q:"Apakah ada garansi?",a:`<p>Ada, garansi berlaku <b>selama masa aktif produk</b>. Kalau terjadi kendala (bot tidak merespons, akun bermasalah, dan sebagainya), hubungi WA Order dengan membawa ID pesananmu dan penjelasan singkat masalahnya agar cepat ditelusuri.</p>`},
{c:"lain",k:"leaderboard peringkat koin top ranking naik",q:"Apa itu leaderboard koin dan bagaimana masuk peringkat?",a:`<p>Leaderboard menampilkan 10 pengguna bot dengan koin terbanyak. Koin dikumpulkan lewat fitur ekonomi dan game di bot. Rapalkan mantra <b>.leaderboard</b> (atau <b>.top</b>) di WhatsApp untuk melihatnya beserta posisimu, atau buka halaman <a onclick="go('peringkat')" style="color:var(--moss);cursor:pointer">Peringkat</a> di website. Nomor disamarkan demi privasi.</p>`},
{c:"lain",k:"offline maintenance mati bot tersambung banner tutup",q:"Kenapa ada banner maintenance atau bot offline?",a:`<p>Banner muncul saat bot atau website sedang dirapikan atau terkendala. Saat bot offline, pesanan baru bisa tertunda dan bukti transfer belum bisa dikirim sampai bot tersambung lagi. Kadang pesanan baru ditutup sementara selama maintenance. Informasi dan estimasi selesainya selalu muncul di banner dan di channel WhatsApp kami.</p>`},
{c:"lain",k:"kontak admin owner hubungi telegram instagram wa",q:"Bagaimana menghubungi admin?",a:`<ul><li>WhatsApp Order: <b>0856-0265-4058</b> (untuk pesanan dan kendala)</li><li>WhatsApp Owner: <b>0857-1117-0694</b></li><li>Telegram: <b>@radipgtg</b></li><li>Instagram: <b>@radipppppp</b></li></ul><p>Sertakan ID pesanan supaya balasannya lebih cepat.</p>`}

const htmlTxt=h=>h.replace(/<li>/g,"\n• ").replace(/<\/(p|ul|ol|div)>/g,"\n").replace(/<[^>]+>/g,"").replace(/\n{3,}/g,"\n\n").trim();
const local0=local;
local=function(q){
 const t=" "+norm(q)+" ";
 if(/(\d+) ?(gb|g|hari|hr|akun)\b/.test(t)||/^ *(hai|halo|hi|hello|hey|p|permisi|assalamualaikum)( |$)/.test(t)||/terima kasih|makasih|thanks|thx|tengkyu/.test(t))return local0(q);
 let best=null,bs=0;
 for(const f of FAQS()){const s=f.k.split(" ").filter(w=>w&&t.includes(" "+w)).length;if(s>bs){bs=s;best=f}}
 if(best&&bs>=1)return{s:1,t:best.q+"\n\n"+htmlTxt(best.a)+"\n\nAda yang masih kurang jelas? Tanya saja lagi ya ✿"};
 return local0(q)};

/* ===== Buku Sihir: tampilan Catatan ala macOS Notes ===== */
let NF="all",NQ="",NSEL="",NMORE=200,NED=false;
const nFavs=()=>{try{return JSON.parse(localStorage.getItem("tt_fav")||"[]")}catch{return[]}};
const nSaveFav=a=>{try{localStorage.setItem("tt_fav",JSON.stringify(a))}catch{}};
const NIC={downloader:"⬇️",game:"🎮",ai:"🧠",sticker:"🏷️",stiker:"🏷️",owner:"👑",group:"👥",tools:"🛠️",search:"🔎",music:"🎵",islamic:"🕌",fun:"🎉",anime:"🌸",nsfw:"🔞",premium:"💎",other:"📁",main:"🏠",economy:"💰",info:"ℹ️",maker:"🎨",convert:"🔄"};
const nIc=c=>NIC[c]||"📁";
function nList(){
 const q=NQ.trim().toLowerCase().replace(/^\./,""),fv=nFavs();
 return FEAT.items.filter(i=>(NF==="all"||(NF==="fav"?fv.includes(i.n):i.c===NF))&&(!q||i.n.toLowerCase().includes(q)||(i.d||"").toLowerCase().includes(q)||i.c.includes(q)||(i.a||[]).some(a=>a.toLowerCase().includes(q))))}
function notesInit(){
 const w=$("#notesWrap");if(!w||!FEAT)return;
 if(NF!=="all"&&NF!=="fav"&&!FEAT.cats.some(c=>c.c===NF))NF="all";
 w.innerHTML=`<div class="nt${NED?" ed":""}" id="nt"><div class="nt-bar"><span class="dots3"><i></i><i></i><i></i></span><b>${T("Catatan Sihir","Spell Notes")}</b><em id="ntC"></em></div>
 <div class="nt-body"><aside class="nt-side" id="ntS"></aside><section class="nt-list"><div class="nt-search"><span>🔍</span><input id="fq" placeholder="${T("Cari mantra, alias, atau kategori","Search spells, aliases or categories")}" value="${esc(NQ)}" oninput="nSearch(this.value)"></div><div class="nt-rows" id="ntR"></div></section><article class="nt-ed" id="ntE"></article></div></div>`;
 nSide();nRows();nEd()}
function nSide(){
 const N=FEAT.items.length,fv=nFavs().length,b=(k,ic,l,n)=>`<button class="nt-f${NF===k?" on":""}" data-k="${esc(k)}" onclick="nFolder(this.dataset.k)"><b>${ic}</b><span>${l}</span><em>${n}</em></button>`;
 $("#ntS").innerHTML=`<h5>${T("Buku Sihir","Spellbook")}</h5>${b("all","📚",T("Semua mantra","All spells"),N)}${b("fav","📌",T("Disematkan","Pinned"),fv)}<h5>${T("Kategori","Categories")}</h5>${FEAT.cats.map(c=>b(c.c,nIc(c.c),esc(c.c),c.n)).join("")}`}
function nRows(){
 const L=nList(),fv=nFavs(),el=$("#ntR");if(!el)return;
 if(!L.some(i=>i.n===NSEL))NSEL=L[0]?L[0].n:"";
 const row=i=>`<div class="nt-r${i.n===NSEL?" on":""}" data-n="${esc(i.n)}" onclick="nPick(this.dataset.n)"><b>${fv.includes(i.n)?"📌 ":""}.${esc(i.n)}</b><span><i>${esc(i.c)}</i>${esc(i.d||"")}</span></div>`;
 const pin=NF==="all"&&!NQ.trim()?L.filter(i=>fv.includes(i.n)):[],rest=pin.length?L.filter(i=>!fv.includes(i.n)):L,sh=rest.slice(0,NMORE);
 el.innerHTML=(pin.length?`<h6>📌 ${T("Disematkan","Pinned")}</h6>${pin.map(row).join("")}<h6>${T("Semua mantra","All spells")}</h6>`:"")+sh.map(row).join("")
  +(rest.length>NMORE?`<button class="nt-more" onclick="NMORE+=300;nRows()">${T("Tampilkan lebih banyak","Show more")} (${rest.length-NMORE})</button>`:"")
  +(L.length?"":`<div class="nt-empty">${T("Tidak ada catatan yang cocok.","No matching notes.")}</div>`);
 $("#ntC").textContent=L.length.toLocaleString(LANG==="en"?"en-US":"id-ID")+" "+T("catatan","notes")}
function nEd(){
 const el=$("#ntE");if(!el)return;const i=FEAT.items.find(x=>x.n===NSEL);
 if(!i){el.innerHTML=`<div class="nt-empty">${T("Pilih satu mantra di daftar untuk membacanya.","Pick a spell from the list to read it.")}</div>`;return}
 const fv=nFavs().includes(i.n),fl=i.f==="owner"?T("Hanya bisa dipakai owner bot.","Only the bot owner can use this."):i.f==="premium"?T("Khusus pengguna premium.","Premium users only."):T("Bisa dipakai semua anggota grup.","Everyone in the group can use this.");
 el.innerHTML=`<div class="nt-tool"><button class="nt-back" onclick="nBack()">‹ ${T("Catatan","Notes")}</button><span class="sp">${nIc(i.c)} ${esc(i.c)}</span><button title="${T("Sematkan","Pin")}" onclick="nFav()">${fv?"📌":"📍"}</button><button title="${T("Salin","Copy")}" onclick="nCopy('.'+NSEL)">⧉</button></div>
 <div class="nt-paper"><h3>.${esc(i.n)}</h3><div><span class="nt-tag">${esc(i.c)}</span>${i.f?`<span class="nt-tag">${i.f}</span>`:""}</div>
 <p>${esc(i.d)||T("Belum ada deskripsi untuk mantra ini.","No description for this spell yet.")}</p>
 <h4>${T("Cara pakai","How to use")}</h4><ul><li>☑ ${T("Buka chat bot atau grup yang ada botnya","Open the bot chat or a group that has the bot")}</li><li>☑ ${T("Ketik","Type")} <code onclick="nCopy('.${esc(i.n)}')">.${esc(i.n)}</code> ${T("lalu kirim","and send it")}</li><li>☑ ${esc(fl)}</li></ul>
 ${i.a&&i.a.length?`<h4>${T("Nama lain","Aliases")}</h4><p>${i.a.map(a=>`<code onclick="nCopy('.${esc(a)}')">.${esc(a)}</code>`).join(" ")}</p>`:""}</div>`}
function nCopy(c){navigator.clipboard?.writeText(c);toast(T("Disalin: ","Copied: ")+c)}
function nPick(n){NSEL=n;NED=true;nRows();nEd();$("#nt").classList.add("ed")}
function nBack(){NED=false;$("#nt").classList.remove("ed")}
function nFolder(k){NF=k;NMORE=200;NED=false;$("#nt").classList.remove("ed");nSide();nRows();nEd()}
function nSearch(v){NQ=v;NMORE=200;nRows();nEd()}
function nFav(){const a=nFavs(),k=a.indexOf(NSEL);k>-1?a.splice(k,1):a.push(NSEL);nSaveFav(a);nSide();nRows();nEd();toast(k>-1?T("Sematan dilepas","Unpinned"):T("Disematkan ke atas","Pinned to the top"))}

/* ===== Tema gelap/terang ===== */
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("tt_theme",t)}catch(e){}
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#161210":"#fbf2e4"}
function toggleTheme(e){
 const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
 const b=e&&e.currentTarget?e.currentTarget.getBoundingClientRect():null;
 const x=b?b.left+b.width/2:innerWidth-40,y=b?b.top+b.height/2:30;
 const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 if(document.startViewTransition&&!calm){
  const vt=document.startViewTransition(()=>setTheme(next));
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:750,easing:"cubic-bezier(.65,0,.2,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
 }else{const h=document.documentElement;h.classList.add("tt-anim");setTheme(next);setTimeout(()=>h.classList.remove("tt-anim"),700)}
}
setTheme(document.documentElement.dataset.theme||"light");

an tiap kartu, lalu pilih paket yang cocok.": "Read each card's explanation, then pick a suitable package.", "Lengkapi data.": "Complete the details.", "Nomor WhatsApp wajib benar karena dipakai untuk mengirim pesanan, akun, atau info login. Untuk sewa bot, link grup WhatsApp juga wajib. Kolom catatan boleh dikosongkan.": "The WhatsApp number must be correct because it's used to send orders, accounts or login info. For bot rental, the WhatsApp group link is also required. The note field can be left empty.", "Tekan \"Buat Pesanan & Bayar\".": "Press \"Place Order & Pay\".", "Kamu diarahkan ke halaman pesanan berisi QRIS dan total yang harus dibayar.": "You're taken to the order page with the QRIS and the total to pay.", "Scan QRIS dan bayar": "Scan the QRIS and pay", "sesuai nominal yang tertera.": "according to the stated amount.", "Unggah bukti transfer": "Upload the transfer proof", "di halaman pesanan yang sama.": "on the same order page.", "Tunggu owner memeriksa dan menekan ACC.": "Wait for the owner to check and press approve.", "Halaman pesanan berubah menjadi Berhasil, dan kabarnya juga dikirim ke WhatsApp-mu.": "The order page changes to Successful, and you're also notified on WhatsApp.", "Simpan ID pesananmu (format TR…). ID ini dipakai kalau kamu perlu bertanya ke admin.": "Keep your order ID (format TR…). You'll use it if you need to ask the admin.", "Kamu tidak perlu menyegarkan halaman terus-menerus, status pesanan ikut berubah otomatis.": "You don't need to keep refreshing, the order status updates automatically.", "Setelah bukti transfer terkirim, owner langsung menerima notifikasi di WhatsApp lengkap dengan fotonya, jadi biasanya prosesnya hitungan menit. Waktu bisa lebih lama kalau owner sedang tidak memegang ponsel, misalnya larut malam.": "After the transfer proof is sent, the owner immediately gets a WhatsApp notification with the photo, so it usually takes only minutes. It may take longer if the owner isn't holding their phone, for example late at night.", "Setelah di-ACC, sebagian besar layanan berjalan otomatis: bot masuk ke grup, akun Alight Motion Seller dan Bulk langsung dikirim, dan akses Reseller diaktifkan. Untuk Panel dan Jasa, owner menghubungimu manual lewat WhatsApp sesudah ACC, jadi tunggu saja kabarnya tanpa perlu chat duluan.": "After approval, most services run automatically: the bot joins the group, Alight Motion Seller and Bulk accounts are sent right away, and Reseller access is activated. For Panels and Services, the owner contacts you manually via WhatsApp after approval, so just wait for the news without needing to chat first.", "Belum bayar:": "Unpaid:", "pesanan sudah dibuat tetapi bukti transfer belum diunggah.": "the order has been created but the transfer proof hasn't been uploaded.", "Menunggu ACC:": "Awaiting approval:", "bukti sudah sampai ke owner dan sedang diperiksa.": "the proof has reached the owner and is being checked.", "Berhasil:": "Successful:", "pembayaran dikonfirmasi dan layanan sudah dijalankan.": "payment is confirmed and the service has been delivered.", "Ditolak:": "Rejected:", "pesanan belum bisa diproses, misalnya nominal tidak sesuai atau bukti tidak jelas.": "the order can't be processed yet, for example the amount doesn't match or the proof is unclear.", "Semua riwayat ada di menu Profil, lengkap dengan total dan tanggalnya.": "All history is in the Profile menu, with totals and dates.", "Kalau belum membayar, tinggalkan saja pesanan itu lalu buat pesanan baru dengan paket yang benar. Pesanan berstatus Belum bayar tidak diproses dan tidak ditagih.": "If you haven't paid, just leave that order and create a new one with the right package. Orders with Unpaid status aren't processed or billed.", "Kalau sudah terlanjur membayar, jangan buat pesanan ganda. Hubungi WA Order dan sertakan ID pesanan serta paket yang kamu inginkan, lalu admin membantu mencari penyelesaiannya.": "If you've already paid, don't create a duplicate order. Contact WA Order with your order ID and the package you want, and the admin will help find a solution.", "Pembayaran hanya lewat": "Payments are only via", ", jadi bisa memakai Dana, GoPay, OVO, ShopeePay, LinkAja, dan mobile banking apa pun yang mendukung QRIS.": ", so you can use Dana, GoPay, OVO, ShopeePay, LinkAja and any mobile banking that supports QRIS.", "Buka halaman pesananmu, QRIS tampil di sana. Tombol unduh tersedia kalau kamu ingin membukanya dari galeri.": "Open your order page, the QRIS is shown there. A download button is available if you want to open it from your gallery.", "Scan, lalu masukkan nominal": "Scan, then enter an amount", "persis sama dengan total pesanan": "exactly equal to the order total", ", termasuk diskon yang sedang berlaku.": ", including any active discount.", "Selesaikan pembayaran dan simpan tangkapan layar buktinya.": "Complete the payment and save a screenshot of the proof.", "Nominal kurang atau lebih bisa membuat pesanan ditolak. Periksa total sekali lagi sebelum menekan bayar.": "A short or excess amount may cause the order to be rejected. Double-check the total before paying.", "Di halaman pesanan, pilih foto bukti pada bagian \"Kirim Bukti\", lalu tekan tombol kirim. Format yang diterima adalah JPG, PNG, atau WebP. Foto besar otomatis diperkecil di browser, jadi aman dipakai dari kamera ponsel.": "On the order page, choose the proof photo in the \"Send Proof\" section, then press send. Accepted formats are JPG, PNG or WebP. Large photos are automatically shrunk in the browser, so phone camera photos are fine.", "Pastikan nominal, tanggal, jam, dan status berhasil terlihat jelas.": "Make sure the amount, date, time and success status are clearly visible.", "Satu bukti hanya berlaku untuk satu pesanan. Sistem otomatis menolak bukti yang pernah dipakai di pesanan lain, walaupun sudah diganti nama atau dikompres ulang.": "One proof is valid for one order only. The system automatically rejects proof used on another order, even if renamed or recompressed.", "Bukti hanya bisa dikirim saat bot tersambung. Kalau muncul \"Bot belum tersambung\", tunggu sebentar lalu coba lagi.": "Proof can only be sent while the bot is connected. If \"Bot is not connected\" appears, wait a moment and try again.", "Kamu menerima pesan WhatsApp berisi ID pesanan dan tombol langsung ke admin. Penyebab paling umum: nominal tidak sama dengan total, bukti kabur atau terpotong, atau bukti yang sama sudah dipakai di pesanan lain.": "You'll receive a WhatsApp message with the order ID and a direct button to the admin. Most common causes: the amount doesn't match the total, the proof is blurry or cropped, or the same proof was already used on another order.", "Periksa total di halaman pesanan dan bandingkan dengan bukti.": "Check the total on the order page and compare it with the proof.", "Kalau memang ada yang kurang, kirim bukti yang benar atau lengkap sesuai petunjuk di halaman pesanan.": "If something is indeed missing, send the correct or complete proof following the instructions on the order page.", "Kalau yakin sudah benar, hubungi WA Order dengan ID pesanan dan bukti aslinya agar diperiksa manual.": "If you're sure it's correct, contact WA Order with the order ID and the original proof so it can be checked manually.", "Kamu menyewa bot WhatsApp Totoro AI untuk satu grup. Bot punya": "You rent the Totoro AI WhatsApp bot for one group. The bot has", "1300+ fitur": "1300+ features", ": AI, downloader (TikTok, YouTube, Instagram, dll.), pembuat stiker, game, alat edit gambar dan video, serta fitur Alight Motion. Tidak perlu hosting atau instalasi sendiri.": ": AI, downloaders (TikTok, YouTube, Instagram, etc.), sticker maker, games, image and video editing tools, plus Alight Motion features. No need for your own hosting or installation.", "Pilihan paketnya:": "Package options:", "Rapalkan mantra": "Cast the spell", "di grup untuk melihat seluruh fitur.": "in the group to see all features.", "Siapkan": "Prepare the", "link undangan grup": "group invite link", "berbentuk https://chat.whatsapp.com/… lalu tempel saat membuat pesanan. Pastikan link masih aktif dan belum direset.": "in the form https://chat.whatsapp.com/… and paste it when creating an order. Make sure the link is still active and hasn't been reset.", "Setelah di-ACC, bot masuk sendiri ke grup dan mengirim salam perkenalan. Masa sewa mulai dihitung saat itu.": "After approval, the bot joins the group by itself and sends an introduction. The rental period starts counting then.", "Kalau grupmu memakai persetujuan admin untuk anggota baru, setujui permintaan masuk bot.": "If your group requires admin approval for new members, approve the bot's join request.", "pesan paket lagi dengan link grup yang sama. Durasinya ditambahkan ke sisa masa sewa. Paket Permanen tidak akan berakhir.": "order a package again with the same group link. The duration is added to the remaining rental time. Permanent packages never expire.", "Panel adalah server untuk menjalankan bot WhatsApp atau Telegram buatanmu selama 24 jam tanpa harus menyalakan komputer.": "A panel is a server to run your own WhatsApp or Telegram bot 24 hours a day without keeping a computer on.", "Panduan memilih:": "Selection guide:", "3-4 GB": "3-4 GB", "cukup untuk satu bot ringan atau bot pribadi;": "is enough for one light or personal bot;", "5-7 GB": "5-7 GB", "untuk bot dengan banyak fitur atau grup ramai;": "for bots with many features or busy groups;", "8 GB ke atas": "8 GB and up", "kalau menjalankan beberapa bot sekaligus.": "if you run several bots at once.", "Setelah di-ACC, owner mengirim detail login panel ke nomor WhatsApp yang kamu isi. Cukup tunggu, tidak perlu chat duluan.": "After approval, the owner sends the panel login details to the WhatsApp number you entered. Just wait, no need to chat first.", "Buyer:": "Buyer:", "akun Alight Motion milikmu sendiri dipremiumkan lewat email dan link verifikasi.": "your own Alight Motion account is upgraded to premium via email and a veri const SYM="[\\s\\p{Extended_Pictographic}\\uFE0F\\u200d✿✦➜➶❀☘❐⧉↻←→↑↓⬇♡●★☁⚠⏳·]";
const SYL=new RegExp("^"+SYM+"+","u"),SYT=new RegExp(SYM+"+$","u");
function trCore(s){const n=s.replace(/\s+/g," ").trim();if(!n)return null;const d=TD.get(n);if(d!==undefined)return d;for(const[re,r]of TX)if(re.test(n))return n.replace(re,r);return null}
function trStr(s){if(LANG!=="en"||!s||typeof s!=="string")return s;
 const w=trCore(s);if(w!==null)return s.match(/^\s*/)[0]+w+s.match(/\s*$/)[0];
 const l=(s.match(SYL)||[""])[0];let c=s.slice(l.length);const t=(c.match(SYT)||[""])[0];c=c.slice(0,c.length-t.length);
 const r=trCore(c);return r===null?s:l+r+t}
let TRB=false;
function trText(n){if(n.__o===undefined){const r=trStr(n.nodeValue);if(r!==n.nodeValue){n.__o=n.nodeValue;n.nodeValue=r}}else if(LANG==="en"){/* sudah diterjemahkan */}}
function trAttrs(el){for(const a of["placeholder","title","aria-label","alt"]){const v=el.getAttribute&&el.getAttribute(a);if(!v)continue;const k="o_"+a.replace("-","_");if(el.dataset&&el.dataset[k]===undefined){const r=trStr(v);if(r!==v){el.dataset[k]=v;el.setAttribute(a,r)}}}}
function trTree(root){if(!root)return;if(root.nodeType===3){if(!/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.parentNode?.nodeName||""))trText(root);return}
 if(root.nodeType!==1||/^(SCRIPT|STYLE)$/.test(root.nodeName))return;
 trAttrs(root);const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
 while(n=w.nextNode()){if(n.nodeType===3){if(!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))trText(n)}else trAttrs(n)}}
function untr(){document.body.querySelectorAll("*").forEach(e=>{if(e.dataset)for(const k of Object.keys(e.dataset)){if(k.startsWith("o_")){e.setAttribute(k.slice(2).replace("_","-"),e.dataset[k]);delete e.dataset[k]}}});
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.__o!==undefined){n.nodeValue=n.__o;n.__o=undefined}}}
function trAll(){TRB=true;try{if(LANG==="en")trTree(document.body);else untr()}finally{TRB=false;trObs.takeRecords()}}
const trObs=new MutationObserver(ms=>{if(LANG!=="en"||TRB)return;TRB=true;
 try{for(const m of ms){if(m.type==="childList")m.addedNodes.forEach(trTree);else if(m.type==="characterData"){if(m.target.__o===undefined)trText(m.target)}}}finally{TRB=false;trObs.takeRecords()}});
trObs.observe(document.body,{childList:true,subtree:true,characterData:true});
trAll();

 if(RLB)return;RLB=true;
 try{

   const ks=[...c.children],hi=ks.findIndex(k=>k.matches(".help")),cut=hi>-1?hi+1:2;

 }catch(e){}finally{RLB=false}}
