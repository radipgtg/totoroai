<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1e17">
<title>Totoro AI ✿ Toko Digital Hutan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1e17;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.095);--ln:rgba(255,255,255,.11);--t:#eef3e6;--mute:#a3bbac;--moss:#9be07a;--moss2:#4f9f62;--gold:#f2cf7e;--sky:#8ec9e8;--rose:#f2a3a3;--r:20px}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;color:var(--t);background:var(--bg);line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 50% at 12% 0%,rgba(155,224,122,.13),transparent 70%),radial-gradient(50% 45% at 100% 100%,rgba(242,207,126,.1),transparent 70%),radial-gradient(40% 40% at 90% 20%,rgba(142,201,232,.07),transparent 70%)}
h1,h2,h3,.serif{font-family:Fraunces,serif;font-weight:600;letter-spacing:-.015em}
button,input,textarea,select{font-family:inherit}
a{color:inherit}
.ff{position:fixed;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,233,168,.4);animation:fly 12s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.1}50%{transform:translate(30px,-50px);opacity:.8}}
.leaf{position:fixed;top:-40px;z-index:0;pointer-events:none;opacity:.35;animation:fall linear infinite}
@keyframes fall{to{transform:translate(70px,115vh) rotate(300deg)}}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.22)}
.pad{padding:26px}.center{text-align:center}.mt{margin-top:56px}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.2;margin-bottom:6px}
.sub{color:var(--mute);font-size:14px}
.eyebrow{display:inline-block;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);margin-bottom:8px}
/* header */
header{position:sticky;top:0;z-index:40;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px 8px 18px;border-radius:99px;background:rgba(10,30,23,.72)}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;cursor:pointer;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--moss),var(--moss2));display:grid;place-items:center;font-style:normal;font-size:16px}
.stat-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--ln);color:var(--mute);white-space:nowrap}
.stat-chip b{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 8px var(--moss)}
.stat-chip.off b{background:var(--rose);box-shadow:0 0 8px var(--rose)}
nav{display:flex;gap:2px;align-items:center}
nav a{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--mute);transition:.2s;white-space:nowrap}
nav a i{font-style:normal;font-size:14px}
nav a:hover{color:var(--t);background:var(--card)}
nav a.on{color:#0a1e17;background:var(--moss);font-weight:600}
nav img.av{width:20px;height:20px;border-radius:50%;object-fit:cover}
.mb{max-width:1180px;margin:8px auto 0;padding:0 16px;position:sticky;top:70px;z-index:35}
.mb div{padding:10px 18px;border-radius:14px;font-size:13.5px;font-weight:500;background:rgba(242,207,126,.16);border:1px solid rgba(242,207,126,.45);color:var(--gold)}
.mb div.red{background:rgba(242,163,163,.15);border-color:rgba(242,163,163,.5);color:var(--rose)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:26px 16px 90px;min-height:70vh}
.view{animation:rise .4s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 14px Inter,sans-serif;padding:12px 24px;border-radius:99px;background:linear-gradient(135deg,#9be07a,#4f9f62);color:#082015;text-decoration:none;box-shadow:0 6px 20px rgba(79,159,98,.35);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:wait;transform:none}
.btn.ghost{background:var(--card);color:var(--t);border:1px solid var(--ln);box-shadow:none}.btn.ghost:hover{background:var(--card2)}
.btn.red{background:linear-gradient(135deg,#e07b7b,#b24a4a);color:#fff;box-shadow:none}.btn.sm{padding:7px 14px;font-size:12px}.full{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.acts.c{justify-content:center}
input,textarea,select{width:100%;padding:12px 15px;border-radius:14px;border:1px solid var(--ln);background:rgba(0,0,0,.22);color:var(--t);font-size:15px;outline:none;margin-top:6px;transition:.2s}
select option{background:#10291f}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:rgba(238,243,230,.38)}
input:focus,textarea:focus,select:focus{border-color:var(--moss);box-shadow:0 0 0 3px rgba(155,224,122,.15)}
label{font-size:12px;font-weight:600;color:var(--mute);display:block;margin-top:14px}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--t);font-weight:500;cursor:pointer}.chk input{width:auto;margin:0;accent-color:#9be07a}
/* hero */
.hero{position:relative;overflow:hidden;padding:56px 36px 0;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;min-height:520px}
.hero h1{font-size:clamp(36px,5.6vw,62px);line-height:1.04;margin:12px 0 16px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#f2cf7e,#9be07a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--mute);max-width:480px;font-size:16px}
.hero-l{position:relative;z-index:2;padding-bottom:110px}
.hero svg.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;z-index:1}
.chip{display:inline-block;padding:5px 13px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:12px;margin:0 6px 6px 0;color:var(--mute)}
.phone{position:relative;z-index:2;max-width:300px;margin:0 auto 70px;border-radius:30px;background:#0d1a15;border:1px solid var(--ln);box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;transform:rotate(2.5deg)}
.ph-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#12302a;border-bottom:1px solid var(--ln)}
.ph-top img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(155,224,122,.5)}
.bub .nm{display:block;font-style:normal;font-size:10px;font-weight:700;margin-bottom:2px}.bub.me .nm{color:var(--gold)}.bub.bot .nm{color:var(--moss)}
.ph-top i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--moss),var(--moss2));display:grid;place-items:center;font-style:normal}
.ph-top b{font-size:13px;display:block;line-height:1.2}.ph-top small{font-size:10.5px;color:var(--moss)}
.ph-body{padding:14px 12px;display:flex;flex-direction:column;gap:7px;min-height:270px;background:radial-gradient(circle at 50% 0,rgba(155,224,122,.07),transparent 60%)}
.bub{max-width:86%;padding:7px 11px;border-radius:12px;font-size:12px;line-height:1.45;opacity:0;animation:pop .5s ease forwards}
.bub.me{align-self:flex-end;background:#1f5f46;border-top-right-radius:3px}.bub.bot{align-self:flex-start;background:#1a2a24;border:1px solid var(--ln);border-top-left-radius:3px}
.bub code{font-family:ui-monospace,monospace;color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
/* stats */
.sgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:18px}
.stat{padding:22px 18px;text-align:center}.stat b{font:600 34px Fraunces,serif;display:block;line-height:1.1;color:var(--gold)}.stat span{font-size:12.5px;color:var(--mute)}
.stat.sm b{font-size:24px}
/* grids */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.split{display:grid;gap:18px;grid-template-columns:1fr 1fr;align-items:start}
.split2{display:grid;gap:18px;grid-template-columns:320px 1fr;align-items:start}
@media(max-width:860px){.split,.split2{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:40px 22px 0}.phone{display:none}.hero-l{padding-bottom:120px}}
.cat{padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.25s;min-height:200px}
.cat:hover,.tile:hover,.feat:hover{transform:translateY(-4px);background:var(--card2);border-color:rgba(242,207,126,.45)}
.cat .ic{font-size:34px}.cat small{margin-top:auto;color:var(--moss);font-weight:600}
.tile{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;border-radius:16px;transition:.2s;font-size:14px}
.tile b{color:var(--gold);white-space:nowrap}.tile s{display:block;font-size:11px;color:var(--mute)}
.off{background:var(--gold);color:#3a2f0a;border-radius:99px;font-size:11px;font-weight:700;padding:2px 9px;margin-left:6px;vertical-align:middle}
.feat{padding:22px;transition:.25s;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.feat .ic{font-size:30px;width:54px;height:54px;border-radius:16px;background:rgba(155,224,122,.12);display:grid;place-items:center;margin-bottom:6px}
.cmd{display:inline-block;font:600 12px ui-monospace,monospace;color:var(--gold);background:rgba(242,207,126,.12);padding:3px 10px;border-radius:99px;width:fit-content}
.demo{margin-top:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);font-size:12px;display:flex;flex-direction:column;gap:5px}
.demo span{padding:5px 9px;border-radius:10px;width:fit-content;max-width:92%}.demo .u{align-self:flex-end;background:#1f5f46}.demo .b{background:#1a2a24;border:1px solid var(--ln)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;font-weight:600;word-break:break-all}
.note{background:rgba(242,207,126,.1);border:1px solid rgba(242,207,126,.35);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:14px}
.qr{background:#fff;padding:12px;border-radius:18px;display:inline-block}.qr img{width:240px;max-width:100%;display:block}
.spin{font-size:38px;display:inline-block;animation:sp 2.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap}
.s-awaiting{background:#f2cf7e;color:#4a3a05}.s-verifying{background:#9ccbee;color:#12395b}.s-success{background:#a6e08a;color:#1c4a10}.s-rejected{background:#f2a3a3;color:#5a1414}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.ord{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;cursor:pointer;margin-bottom:12px;transition:.2s;align-items:center}
.ord:hover{background:var(--card2)}.ord small{color:var(--mute)}
.steps{display:grid;gap:26px 16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));counter-reset:s;margin-top:34px}
.step{padding:32px 22px 22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-18px;left:22px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f2cf7e,#d9a93f);color:#3a2f0a;font:700 17px Fraunces,serif;display:grid;place-items:center}
.step h3{font-size:17px;margin-bottom:4px}
.help{padding:20px 24px;margin-top:20px;font-size:13.5px}
.help h4{font:600 16px Fraunces,serif;color:var(--gold);margin-bottom:6px}
.help ol,.help ul{margin-left:20px}.help li{margin:5px 0;color:var(--mute)}.help li b{color:var(--t)}.help p{color:var(--mute)}
details{padding:15px 20px;margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:14px}details p{margin-top:8px;color:var(--mute);font-size:13.5px}
.back{background:none;border:0;color:var(--t);opacity:.7;cursor:pointer;font:500 13px Inter;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;text-align:left;border-bottom:1px solid var(--ln)}th{color:var(--mute);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mute);margin-top:10px}
/* avatar */
.avt{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--moss2),#2f6f4a);color:#fff;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.avt img{width:100%;height:100%;object-fit:cover}
.avbtn{position:relative;cursor:pointer;border-radius:50%;display:inline-block}
.avbtn::after{content:"📷 Ganti";position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:12px;font-weight:600;opacity:0;transition:.2s}
.avbtn:hover::after{opacity:1}
/* chat */
.chat{height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 4px 4px 0;margin-top:12px;scroll-behavior:smooth}
.cm{display:flex;gap:10px;align-items:flex-end}.cm.mine{flex-direction:row-reverse}
.cm .bx{max-width:76%}
.cm .nm{font-size:11.5px;color:var(--mute);margin:0 6px 3px;display:flex;gap:6px;align-items:center}.cm.mine .nm{justify-content:flex-end}
.cm .tx{padding:9px 14px;border-radius:16px;font-size:14px;background:var(--card2);border:1px solid var(--ln);border-bottom-left-radius:4px;word-break:break-word}
.cm.mine .tx{background:linear-gradient(135deg,#2e7d52,#215f3f);border-color:transparent;border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.cm .rl{font-size:10px;background:var(--gold);color:#3a2f0a;border-radius:99px;padding:0 7px;font-weight:700}
.cm .x{background:none;border:0;color:var(--rose);cursor:pointer;font-size:11px;opacity:.7}
.m{max-width:82%;padding:11px 15px;border-radius:18px;font-size:14px}
.m.bot{background:var(--card2);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:linear-gradient(135deg,#2e7d52,#215f3f);align-self:flex-end;border-bottom-right-radius:4px}
.send{display:flex;gap:8px;margin-top:12px}.send input{margin:0}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--t);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}
/* bar chart fitur */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar-r{display:grid;grid-template-columns:104px 1fr 42px;gap:10px;align-items:center;font-size:12.5px}
.bar-r div{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar-r div i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--moss2),var(--moss));width:0;transition:width 1s ease}
.bar-r span:last-child{text-align:right;color:var(--mute)}
.cmdc{padding:12px 14px;border-radius:14px;cursor:pointer;transition:.2s;font-size:13px}.cmdc:hover{background:var(--card2)}
.cmdc b{font-family:ui-monospace,monospace;color:var(--gold);font-size:13px}.cmdc small{display:block;color:var(--mute);font-size:11.5px;line-height:1.4;margin-top:2px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.pill{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;background:var(--card);border:1px solid var(--ln);color:var(--mute);transition:.2s}.pill.on{background:var(--moss);color:#0a1e17;border-color:var(--moss)}
.shot{overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.shot:hover{transform:translateY(-4px);border-color:rgba(242,207,126,.45)}.shot .cmd{cursor:copy}
.shot .im{position:relative;background:radial-gradient(circle at 50% 0,rgba(155,224,122,.1),rgba(0,0,0,.35));padding:12px;display:grid;place-items:center;cursor:zoom-in}
.shot img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block;border-radius:10px;transition:.4s}.shot:hover img{transform:scale(1.03)}
.shot .zoom{position:absolute;right:14px;bottom:14px;font-style:normal;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.6);opacity:0;transition:.2s}.shot:hover .zoom{opacity:1}
@media(hover:none){.shot .zoom{opacity:1}}
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,15,11,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}#lb small{color:var(--mute)}
.shot .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.shot.more{align-items:center;justify-content:center;text-align:center;padding:30px;min-height:240px;gap:8px;cursor:default}
.shots{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.promo{position:relative;overflow:hidden;padding:28px 30px;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:linear-gradient(120deg,rgba(242,207,126,.2),rgba(155,224,122,.11) 55%,rgba(142,201,232,.09));border-color:rgba(242,207,126,.5)}
.promo::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:radial-gradient(circle,rgba(242,207,126,.25),transparent 70%)}
.promo .ribbon{position:absolute;top:14px;left:-34px;transform:rotate(-35deg);background:var(--gold);color:#3a2f0a;font:800 10px Inter;letter-spacing:.18em;padding:4px 40px}
.promo .pd{position:absolute;font-style:normal;opacity:.5;pointer-events:none}.promo .p1{right:24%;top:10px;font-size:20px}.promo .p2{left:34%;bottom:8px;font-size:18px}.promo .p3{right:6px;bottom:12px;font-size:22px}
.pbadge{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#f2cf7e,#d9a93f);color:#3a2f0a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(217,169,63,.4),inset 0 0 0 5px rgba(255,255,255,.28);line-height:1.05;flex:none}
.pbadge b{font:700 32px Fraunces,serif}.pbadge small{font-size:9px;font-weight:800;letter-spacing:.1em}
.pbody{position:relative;min-width:0}.pbody h2{margin:2px 0 6px;font-size:clamp(22px,3vw,30px)}
.pchips{margin-top:12px}.pchips .chip{color:var(--t)}.pchips .chip b{color:var(--gold)}
.pside{position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right}.pside small{color:var(--mute);font-size:12px;font-weight:600}
.cd{display:flex;gap:7px}.cdb{min-width:54px;padding:8px 6px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--ln);text-align:center}.cdb b{display:block;font:700 22px Fraunces,serif;color:var(--gold);line-height:1.1}.cdb span{font-size:10px;color:var(--mute)}
@media(max-width:860px){.promo{grid-template-columns:1fr;padding:30px 22px 24px;gap:16px}.pbadge{width:92px;height:92px}.pbadge b{font-size:26px}.pside{align-items:flex-start;text-align:left}.pside .btn{width:100%}}
footer{position:relative;z-index:1;text-align:center;padding:30px 18px 100px;font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);padding:11px 22px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:99;pointer-events:none;background:rgba(10,30,23,.96);border:1px solid var(--ln)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:761px){#toast{bottom:26px}footer{padding-bottom:50px}}
/* mobile bottom nav */
@media(max-width:760px){
 .bar .stat-chip span{display:none}

function square(f,S=256){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=S;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,S,S);ok(c.toDataURL("image/jpeg",.86))};i.onerror=no;i.src=URL.createObjectURL(f)})}

 <label>Jenis</label><select id="n_t"><option value="maintenance">🛠️ Maintenance</option><option value="offline">🔴 Gangguan</option><option value="online">🟢 Kembali online (hapus banner)</option><option value="info">📢 Pengumuman</option><option value="update">✨ Update fitur</option><option value="promo">🎁 Promo</option></select>
 <label>Judul (opsional)</label><input id="n_h" maxlength="80" placeholder="Mis. Perbaikan server"><label>Pesan</label><textarea id="n_m" maxlength="600" placeholder="Tulis isi pengumuman…"></textarea><label>Estimasi selesai (opsional)</label><input id="n_e" maxlength="60" placeholder="Mis. 30 menit / pukul 23.00 WIB">
 <label class="chk"><input type="checkbox" id="n_b" checked> Tampilkan banner di website</label><label class="chk"><input type="checkbox" id="n_k"> Tutup pesanan baru selama banner aktif</label>
 <button class="btn full" style="margin-top:16px" id="n_s" onclick="sendAnn()">➶ Kirim ke Channel</button></div>
 <div class="glass pad"><h3>🎁 Diskon & Banner Promo</h3><p class="sub">Atur diskon per kategori, tampilan banner, dan berapa lama promo berlaku.</p>
 ${(s.discUntil||s.banner||Object.keys(s.disc||{}).length)?`<div class="note">🎁 Promo aktif · ${s.discUntil?`sisa <b data-until="${s.discUntil}" data-t="1"></b>`:"tanpa batas waktu"}</div>`:""}
 <div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">${[["all","Semua %"],["bot","Bot %"],["panel","Panel %"],["am","AM %"],["jasa","Jasa %"]].map(([k,t])=>`<div><label>${t}</label><input type="number" min="0" max="90" id="d_${k}" value="${dv(k)}"></div>`).join("")}</div>
 <label>Judul banner</label><input id="d_bn" maxlength="160" value="${esc(s.banner)}" placeholder="Diskon akhir bulan!">
 <label>Penjelasan promo</label><textarea id="d_bd" maxlength="300" placeholder="Mis. Diskon berlaku untuk semua paket sewa bot. Pesan sekarang sebelum waktu habis!">${esc(s.bannerDesc||"")}</textarea>
 <label>Durasi promo</label><div style="display:flex;gap:10px"><input id="d_dn" type="number" min="1" placeholder="Mis. 24" style="flex:1"><select id="d_du" style="flex:1"><option value="jam">Jam</option><option value="hari">Hari</option><option value="none">Tanpa batas waktu</option></select></div>
 <p class="sub" style="font-size:12px;margin-top:4px">Isi angka untuk memulai hitungan baru dari sekarang. Kosongkan untuk mempertahankan waktu yang sedang berjalan. Diskon dan banner hilang otomatis saat waktu habis.</p>
 <label class="chk"><input type="checkbox" id="d_ann"> Kirim info promo ke channel WhatsApp</label>
 <label class="chk"><input type="checkbox" id="d_an" ${s.autoNotify!==false?"checked":""}> Kabari channel otomatis saat bot/website mati lalu hidup lagi</label>
 <button class="btn full" style="margin-top:16px" onclick="saveSet()">✿ Simpan</button></div></div>
 <div class="glass pad" style="overflow:auto;margin-top:18px"><h3>♡ Pesanan Terbaru</h3><table><tr><th>ID</th><th>Produk</th><th>Status</th><th></th></tr>${d.orders.slice(0,30).map(o=>`<tr><td style="font-family:monospace;font-size:11px">${o.id}<br><span class="sub">${rp(o.amount)}</span></td><td>${esc(o.product)}<br><span class="sub">${esc(o.name)} · +${o.wa}</span></td><td><span class="badge s-${o.status}">${ST[o.status]}</span></td>
 <td style="white-space:nowrap">${o.proofAt?`<a class="btn ghost sm" target="_blank" href="${API}/api/owner/proof/${o.id}?t=${TOK}">Bukti</a> `:""}${o.status==="verifying"?`<button class="btn sm" onclick="act('${o.id}','approve')">ACC</button> <button class="btn red sm" onclick="act('${o.id}','reject')">Tolak</button>`:""}</td></tr>`).join("")}</table></div>`;tick()}
async function saveSet(){
 const disc={};for(const k of ["all","bot","panel","am","jasa"])disc[k]=$("#d_"+k).value;
 try{const j=await api("/api/owner/settings",{b:{disc,banner:$("#d_bn").value,bannerDesc:$("#d_bd").value,durNum:$("#d_dn").value,durUnit:$("#d_du").value,autoNotify:$("#d_an").checked,announce:$("#d_ann").checked}});CAT=await api("/api/catalog");toast(j.announced?"✿ Tersimpan & dikirim ke channel":"✿ Tersimpan");vOwner()}catch(e){toast("⚠ "+e.message)}}
async function sendAnn(){
 const m=$("#n_m").value.trim();if(m.length<3)return toast("⚠ Isi pesan dulu");
 const b=$("#n_s");b.disabled=true;
 try{const j=await api("/api/owner/announce",{b:{type:$("#n_t").value,title:$("#n_h").value,message:m,eta:$("#n_e").value,banner:$("#n_b").checked,block:$("#n_k").checked}});toast("✿ "+j.message);applyState(await api("/api/status"));vOwner()}
 catch(e){toast("⚠ "+e.message);b.disabled=false}}
async function clrMaint(){try{await api("/api/owner/maint/clear",{b:{}});applyState(await api("/api/status"));toast("✿ Banner dimatikan");vOwner()}catch(e){toast("⚠ "+e.message)}}
async function act(id,a){
 if(!confirm((a==="approve"?"ACC":"Tolak")+" pesanan "+id+"?"))return;toast("Memproses…");
 try{const j=await api(`/api/owner/orders/${id}/${a}`,{b:{}});toast("✿ "+j.message)}catch(e){toast("⚠ "+e.message)}vOwner()}
/* ===== AI: logika lokal dulu, lalu server ===== */
let chat=[],busy=false;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ");
const bl=k=>CAT.cats[k].it.map(i=>"• "+i.l+": "+rp(i.p)).join("\n");
const mn=k=>rp(Math.min(...CAT.cats[k].it.map(i=>i.p)));
function local(q){
 const t=" "+norm(q)+" ",has=r=>r.test(t),C=CAT.cats;let m;
 if((m=t.match(/(\d+) ?(gb|g)\b/))&&has(/panel|ram|gb|server/)){const it=C.panel.it.find(i=>parseInt(i.l)==m[1]);if(it)return{s:1,t:`Panel ${it.l} harganya ${rp(it.p)} ✿ ${+m[1]<=4?"Pas untuk bot ringan atau bot pribadi.":"Cukup lega untuk bot yang makin ramai."} Pilih di Katalog › Panel.`}}
 if((m=t.match(/(\d+) ?(hari|hr)\b/))&&has(/sewa|bot|hari|hr/)){const it=C.bot.it.find(i=>parseInt(i.l)==m[1]);if(it)return{s:1,t:`Sewa bot ${it.l} harganya ${rp(it.p)} ✿ Siapkan link grup WhatsApp-mu; setelah di-ACC bot langsung masuk ke grup.`}}
 if((m=t.match(/(\d+) ?akun/))&&has(/bulk|akun|alight|am/)){const n=+m[1],b=C.am.it.find(i=>i.k==="bulk");return{s:1,t:n>=10&&n<=50?`Bulk ${n} akun = ${rp(b.p*n)} (${rp(b.p)} per akun) ✿ Akun dikirim otomatis setelah di-ACC.`:`Bulk bisa 10-50 akun per pesanan, ${rp(b.p)} per akun ✿`}}
 if(has(/^ *(hai|halo|hi|hello|hey|p|permisi|assalamualaikum)( |$)/))return{s:1,t:"Halo, selamat datang di hutan Totoro ☁ Mau tanya harga, cara order, atau pembayaran?"};
 if(has(/terima kasih|makasih|thanks|thx|tengkyu/))return{s:1,t:"Sama-sama! Kalau ada yang mau ditanyakan lagi, Totoro di sini ✿"};
 if(has(/cara|gimana|bagaimana/)&&has(/order|beli|pesan|bayar|sewa/)||has(/ orderan | order /))return{s:1,t:"Cara order ➶\n1. Masuk atau daftar akun\n2. Pilih paket di Katalog\n3. Isi nomor WhatsApp (dan link grup untuk sewa bot)\n4. Scan QRIS, bayar sesuai total\n5. Unggah bukti transfer\n6. Tunggu owner menekan ACC, halaman otomatis berubah jadi berhasil ✿"};
 if(has(/bayar|pembayaran|qris|transfer|bukti|dana|gopay|ovo/))return{s:1,t:"Pembayaran lewat QRIS (semua e-wallet dan m-banking). Setelah pesanan dibuat, scan QRIS, bayar tepat sesuai total, lalu unggah foto bukti transfer di halaman pesanan. Owner akan memeriksanya ✿"};
 if(has(/diskon|promo|murah|potongan/)){const d=Object.values(C).filter(c=>c.disc).map(c=>`• ${c.n}: -${c.disc}%`).join("\n");return{s:1,t:d?"Diskon yang sedang berjalan ✿\n"+d:"Saat ini belum ada diskon aktif 🍃 Pantau banner di beranda ya."}}
 if(has(/fitur|command|perintah|tiktok|preset|render|finder|slowmo|swhd/))return{s:1,t:`Bot Totoro AI punya ${SS.stats.features}+ fitur ✿ Unggulannya: Alight Motion, AM Render, AM Preset, AM Finder, SW HD, dan Slowmo. Lihat semuanya di menu Fitur.`};
 if(has(/panel|ram|pterodactyl|hosting|server/))return{s:1,t:"Panel Pterodactyl adalah server untuk menjalankan bot 24 jam ✿\n"+bl("panel")};
 if(has(/alight|\bam\b|reseller|seller|buyer|bulk|premium|edit video/))return{s:1,t:"Alight Motion Premium ✨\n"+bl("am")+"\nSeller dan Bulk dikirim otomatis setelah di-ACC."};
 if(has(/jasa|script|source|tutor|install|setup|run bot/))return{s:1,t:"Jasa & Tools 🧰\n"+bl("jasa")};
 if(has(/sewa|bot|addsewa|grup|group/))return{s:1,t:`Sewa Bot WA 🤖 (${SS.stats.features}+ fitur)\n`+bl("bot")+"\nLink grup WhatsApp wajib diisi saat order. Setelah di-ACC, bot otomatis masuk ke grupmu."};
 if(has(/garansi|jaminan|refund/))return{s:1,t:"Ada garansi selama masa aktif produk. Kalau ada kendala, hubungi WA Order 0856-0265-4058 ✿"};
 if(has(/kontak|admin|owner|wa order|whatsapp|telegram|instagram|hubungi/))return{s:1,t:"Kontak ✿\n• WA Order: 0856-0265-4058\n• WA Owner: 0857-1117-0694\n• Telegram: @radipgtg\n• Instagram: @radipppppp"};
 if(has(/lama|cepat|proses|acc|nunggu|menunggu/))return{s:1,t:"Biasanya hitungan menit setelah bukti transfer terkirim. Status di halaman pesanan berubah otomatis begitu owner menekan ACC ✿"};
 if(has(/password|sandi|ganti pass/))return{s:1,t:"Buka Profil › Ganti Password. Kamu perlu mengisi password lama, lalu password baru ✿"};
 if(has(/login|masuk|daftar|riwayat|profil|akun saya/))return{s:1,t:"Daftar atau masuk lewat tombol Masuk. Di Profil kamu bisa melihat semua transaksi, mengganti foto, dan mengganti password ✿"};
 if(has(/error|gagal|bug|rusak|tidak bisa|gabisa|ga bisa/))return{s:1,t:"Maaf ya 🍃 Coba muat ulang halaman. Kalau masih bermasalah, chat WA Order 0856-0265-4058 dengan ID pesananmu."};
 if(has(/harga|katalog|produk|jual|list|daftar harga/))return{s:1,t:`Harga mulai dari ✿\n• Sewa Bot: ${mn("bot")}\n• Panel: ${mn("panel")}\n• Alight Motion: ${mn("am")}\n• Jasa: ${mn("jasa")}\nBuka Katalog untuk detailnya.`};
 return{s:0,t:"Hmm, daun-daun belum paham maksudmu 🍃 Coba tanya soal harga bot, panel, Alight Motion, cara order, atau pembayaran. Atau chat WA Order 0856-0265-4058."};
}
function vAi(){
 if(!chat.length)chat=[{r:"bot",t:"Halo, aku Totoro ☁ Tanya apa saja soal harga, produk, cara order, atau pembayaran ya ✿"}];
 app.innerHTML=`<div class="split2"><div class="glass pad"><div style="font-size:42px">🌳</div><h2>Tanya Totoro</h2><p class="sub">Asisten hutan yang menjawab seputar toko ini.</p>
 <div class="help" style="padding:0;margin-top:14px"><h4>Bisa ditanya soal</h4><ul><li>Harga sewa bot, panel, Alight Motion, jasa</li><li>Cara order dan cara bayar</li><li>Diskon yang sedang aktif</li><li>Lama proses dan garansi</li><li>Kontak owner dan admin</li></ul></div>
 <div style="margin-top:12px">${["Berapa harga sewa bot?","Panel 5 GB berapa?","Bulk 20 akun berapa?","Cara order?","Ada diskon?"].map(q=>`<span class="chip" style="cursor:pointer" onclick="ask('${q}')">${q}</span>`).join("")}</div></div>
 <div class="glass pad"><div class="chat" id="chat" style="height:56vh;margin-top:0">${chat.map(m=>`<div class="m ${m.r}">${m.typing?'<span class="dots"><i></i><i></i><i></i></span>':esc(m.t).replace(/\n/g,"<br>")}</div>`).join("")}</div>
 <div class="send"><input id="aiIn" placeholder="Ketik pertanyaan…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">➤</button></div></div></div>`;
 const c=$("#chat");c.scrollTop=c.scrollHeight}
async function ask(q){
 if(busy)return;const t=(q||$("#aiIn")?.value||"").trim();if(!t)return;busy=true;
 chat.push({r:"me",t},{r:"bot",t:"",typing:1});vAi();
 const L=local(t);let a=null;
 if(L.s)a=L.t;else{a=await api("/api/ai",{b:{message:t}}).then(j=>j.reply).catch(()=>null);if(!a)a=L.t}
 await new Promise(r=>setTimeout(r,450));
 chat[chat.length-1]={r:"bot",t:a};busy=false;if(location.hash==="#ai")vAi()}
boot();
</script>
</body>
</html>
