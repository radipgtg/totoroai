 c.innerHTML=j.messages.length?j.messages.map(m=>{const mine=ME&&m.uid===ME.id,u=mine?{...m,name:ME.name,av:ME.av,id:ME.id}:m,own=m.role==="owner"||(mine&&ME.role==="owner");return `<div class="cm ${mine?"mine":""}">${avatarTry({...u,id:m.uid||u.id},32)}<div class="bx"><div class="nm"><b style="color:var(--t)">${esc(u.name)}</b>${own?'<span class="rl">Owner</span>':""}<span>${hm(m.t)}</span>${ME?.role==="owner"?`<button class="x" onclick="delChat('${m.id}')">hapus</button>`:""}</div><div class="tx">${esc(m.text)}</div></div></div>`}).join(""):`<div class="center sub" style="margin:auto">Belum ada obrolan.</div>`;
 if(near)c.scrollTop=c.scrollHeight}

function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};i.onerror=no;i.src=URL.createObjectURL(f)})}
function square(f,S=256){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=S;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,S,S);ok(c.toDataURL("image/jpeg",.86))};i.onerror=no;i.src=URL.createObjectURL(f)})}

function trTree(root){if(!root||LANG!=="en")return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode?.nodeName||""))continue;const r=trStr(n.nodeValue);if(r!==n.nodeValue){if(n.__o===undefined)n.__o=n.nodeValue;n.nodeValue=r}}}

/* ---------- Scroll reveal dengan stagger ---------- */
initReveal=function(){
 const it=[...document.querySelectorAll(".reveal:not(.in)")];if(!it.length)return;
 if(!("IntersectionObserver" in window)){it.forEach(e=>e.classList.add("in"));return}
 if(!obs)obs=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return;const t=en.target;obs.unobserve(t);t.classList.add("in");
  setTimeout(()=>t.classList.add("rv-done"),900+(parseInt(t.style.getPropertyValue("--stagger"))||0))
 }),{threshold:.08,rootMargin:"0px 0px -6% 0px"});
 it.forEach(el=>{if(el.dataset.sg)return;el.dataset.sg=1;
  const sib=[...el.parentElement.children].filter(x=>x.classList.contains("reveal"));
  el.style.setProperty("--stagger",Math.min(sib.indexOf(el),6)*70+"ms");obs.observe(el)})};

const LBL={pagi:"Pagi",siang:"Siang",sore:"Sore",malam:"Malam",larut:"Larut malam"};
function period(){
  const q=new URLSearchParams(location.search).get("tod");if(SKY[q])return q;
  const h=new Date().getHours();
  return h>=22||h<5?"larut":h<11?"pagi":h<15?"siang":h<18?"sore":"malam"
}
function paintLv(){
  const p=period();

    s.dataset.p=p;
    $$("img",s).forEach(im=>{
      if(im.dataset.p!==p){im.classList.remove("on");return}
      if(im.getAttribute("src")){im.classList.add("on");return}
      im.onload=()=>{if(period()===p)im.classList.add("on")};im.src=SKY[p]
    })
  });
  const lv=$1(".lvs .lv");

    let t=$1(".lv-tag",lv);
    if(!t){lv.insertAdjacentHTML("beforeend",'<span class="lv-tag"><i></i><b></b></span>');t=$1(".lv-tag",lv)}
    const b=$1("b",t);if(b.textContent!==LBL[p])b.textContent=LBL[p]
  }
}

/* ---------- 9. Carousel: drag + inersia, kartu aktif, buka kartu ---------- */
function tweenLeft(el,to,dur){
  if(ANIM){G.killTweensOf(el);el.style.scrollSnapType="none";G.to(el,{scrollLeft:to,duration:dur,ease:EX,overwrite:true,onComplete(){el.style.scrollSnapType=""}})}
  else el.scrollTo({left:to,behavior:"smooth"})
}
function metrics(trk){
  const cs=getComputedStyle(trk),padL=parseFloat(cs.paddingLeft)||0,padR=parseFloat(cs.paddingRight)||0,gap=parseFloat(cs.columnGap)||16;
  return{padL,padR,gap,inW:trk.clientWidth-padL-padR}
}
function upState(trk){
  const kids=[...trk.children],mid=trk.scrollLeft+trk.clientWidth/2;
  let best=null,bd=1e9;
  kids.forEach(c=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=c}});
  kids.forEach(c=>{const on=c===best;if(c.classList.contains("act")!==on)c.classList.toggle("act",on)});
  const bar=$1(".oc-prog i",trk.parentElement);
  if(bar){
    const W=bar.parentElement.clientWidth,ratio=Math.min(1,trk.clientWidth/Math.max(1,trk.scrollWidth));
    const bw=Math.max(36,W*ratio),max=Math.max(1,trk.scrollWidth-trk.clientWidth);
    bar.style.width=bw+"px";bar.style.transform="translate3d("+(trk.scrollLeft/max)*(W-bw)+"px,0,0)"
  }
}
const drag={on:false,trk:null,sx:0,sl:0,moved:0,lx:0,lt:0,v:0,raf:0,block:false};
addEventListener("pointermove",e=>{
  if(!drag.on)return;
  const dx=e.clientX-drag.sx;drag.moved=Math.max(drag.moved,Math.abs(dx));
  if(drag.moved>5)drag.trk.classList.add("drag");
  drag.trk.scrollLeft=drag.sl-dx;
  const now=performance.now(),dt=Math.max(1,now-drag.lt);
  drag.v=.75*drag.v+.25*((e.clientX-drag.lx)/dt*16);drag.lx=e.clientX;drag.lt=now
},{passive:true});
function endDrag(){
  if(!drag.on)return;drag.on=false;
  const trk=drag.trk,was=drag.moved>5;trk.classList.remove("drag");
  if(!was){trk.style.scrollSnapType="";return}
  drag.block=true;setTimeout(()=>{drag.block=false;drag.moved=0},80);
  let vel=-drag.v;
  const glide=()=>{
    if(!trk.isConnected)return;
    trk.scrollLeft+=vel;vel*=.94;
    if(Math.abs(vel)>.35){drag.raf=requestAnimationFrame(glide);return}
    if(trk.classList.contains("has-open")){trk.style.scrollSnapType="";return}
    const m=metrics(trk),W=trk.children[0]?trk.children[0].offsetWidth:300;
    const idx=Math.max(0,Math.min(trk.children.length-1,Math.round(trk.scrollLeft/(W+m.gap))));
    tweenLeft(trk,Math.max(0,idx*(W+m.gap)),.9)
  };
  drag.raf=requestAnimationFrame(glide)
}
addEventListener("pointerup",endDrag);addEventListener("pointercancel",endDrag);
addEventListener("resize",()=>{const t=document.getElementById("ocT");if(t)upState(t)},{passive:true});
function carousel(){
  const trk=document.getElementById("ocT");
  if(!trk||trk.dataset.m)return;trk.dataset.m=1;
  if(!$1(".oc-prog",trk.parentElement))trk.insertAdjacentHTML("afterend",'<div class="oc-prog" aria-hidden="true"><i></i></div>');
  let tk=0;
  trk.addEventListener("scroll",()=>{if(!tk)tk=requestAnimationFrame(()=>{tk=0;upState(trk)})},{passive:true});
  upState(trk);setTimeout(()=>upState(trk),350);
  trk.addEventListener("dragstart",e=>e.preventDefault());
  trk.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="mouse"||e.button!==0)return;
    if(G)G.killTweensOf(trk);cancelAnimationFrame(drag.raf);
    Object.assign(drag,{on:true,trk:trk,sx:e.clientX,lx:e.clientX,sl:trk.scrollLeft,moved:0,v:0,lt:performance.now()});
    trk.style.scrollSnapType="none"
  });
  trk.addEventListener("click",e=>{if(drag.block){e.stopPropagation();e.preventDefault()}},true);
  if(ANIM){
    const cards=[...trk.children];
    cards.forEach(c=>c.classList.add("mo"));
    G.set(cards,{opacity:0,x:60});
    onceVisible(trk,()=>G.to(cards,{opacity:1,x:0,duration:1.1,ease:EX,stagger:.09,clearProps:CLR,onComplete(){cards.forEach(c=>c.classList.remove("mo"));upState(trk)}}),.15)
  }
}
window.ocToggle=function(e){
  const c=e.currentTarget,t=c.parentNode,was=c.classList.contains("open");
  const kids=[...t.children],idx=kids.indexOf(c);
  t.querySelectorAll(".oc-c").forEach(x=>x.classList.remove("open"));
  t.classList.toggle("has-open",!was);
  if(!was){
    c.classList.add("open");
    const m=metrics(t),W0=Math.min(300,.78*m.inW),target=Math.min(640,m.inW);
    const total=m.padL+m.padR+kids.length*W0+(kids.length-1)*m.gap+(target-W0);
    let left=m.padL+idx*(W0+m.gap)+target/2-t.clientWidth/2;
    left=Math.max(0,Math.min(left,total-t.clientWidth));
    tweenLeft(t,left,1);
    if(ANIM){
      c.classList.add("gx8");
      G.fromTo(c,{y:0},{keyframes:[{y:-12,duration:.25,ease:"power2.out"},{y:0,duration:.9,ease:"elastic.out(1,.55)"}],clearProps:"transform",onComplete(){c.classList.remove("gx8")}});
      G.from($$(".oc-pk li,.oc-d>.btn",c),{y:14,opacity:0,duration:.8,ease:EX,stagger:.06,delay:.18,clearProps:CLR})
    }
  }
  setTimeout(()=>upState(t),120);setTimeout(()=>upState(t),800)
};
window.ocClose=function(e){
  e.stopPropagation();
  const c=e.currentTarget.closest(".oc-c"),t=c.parentNode;
  c.classList.remove("open");t.classList.remove("has-open");
  const m=metrics(t),W0=Math.min(300,.78*m.inW),idx=[...t.children].indexOf(c);

window.ocNav=function(d){

function setBox(box,img,min,max){
  const go=()=>{
    if(!img.naturalWidth)return;
    const r=img.naturalWidth/img.naturalHeight,k=Math.min(max,Math.max(min,r));
    box.style.setProperty("--box",k);box.style.setProperty("--src",'url("'+(img.currentSrc||img.src)+'")');
    box.classList.toggle("lb",Math.abs(k-r)>.02)
  };
  img.complete&&img.naturalWidth?go():img.addEventListener("load",go,{once:true})
}

    G.from(L.children,{y:18,opacity:0,duration:.8,stagger:.07,ease:EX,clearProps:CLR});
    const t=$1(".loader-txt",L);let i=0;
    if(t)(function nx(){
      G.delayedCall(1.9,()=>{
        if(!t.isConnected)return;
        i=(i+1)%POEM.length;
        G.to(t,{y:-8,opacity:0,duration:.25,ease:"power2.in",onComplete(){t.textContent=POEM[i];G.fromTo(t,{y:10,opacity:0},{y:0,opacity:1,duration:.5,ease:EX});nx()}})
      })
    })()
  })
}

/* ---------- 16. Transisi halaman ---------- */
let pgH="";
function pageIn(){
  if(!ANIM||pgH===seen||!fresh(1200))return;pgH=seen;
  G.fromTo(APP,{y:14,opacity:.2},{y:0,opacity:1,duration:.7,ease:EX,clearProps:CLR})
}

/* ---------- 17. Interaksi kursor (desktop): tombol magnetik + riak ---------- */
if(ANIM&&FINE){
  const MG=".nav-cta,.hx .acts .btn,.claim-cta-btn,.hcta",qt=new WeakMap();
  const qf=el=>{
    let o=qt.get(el);
    if(!o){o={x:G.quickTo(el,"x",{duration:.5,ease:"power3"}),y:G.quickTo(el,"y",{duration:.5,ease:"power3"})};qt.set(el,o)}
    return o
  };
  document.addEventListener("pointerover",e=>{
    const b=e.target.closest&&e.target.closest(MG);
    if(!b||b._mg)return;b._mg=1;
    const o=qf(b);
    const mv=ev=>{const r=b.getBoundingClientRect();o.x((ev.clientX-r.left-r.width/2)*.28);o.y((ev.clientY-r.top-r.height/2)*.28)};
    const lv=()=>{o.x(0);o.y(0);b.removeEventListener("pointermove",mv);b.removeEventListener("pointerleave",lv);b._mg=0};
    b.addEventListener("pointermove",mv,{passive:true});b.addEventListener("pointerleave",lv)
  });
}
if(ANIM){
  const RIP=".btn,.gr-btn,.claim-cta-btn,.kp-btn,.back";
  document.addEventListener("pointerdown",e=>{
    const b=e.target.closest&&e.target.closest(RIP);if(!b||b.disabled)return;
    const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,o=document.createElement("span");
    o.style.cssText="position:absolute;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px;width:"+d+"px;height:"+d+"px;border-radius:50%;background:rgba(255,255,255,.38);pointer-events:none;z-index:3";
    b.classList.add("rip");b.appendChild(o);
    G.fromTo(o,{scale:0,opacity:.9},{scale:1,opacity:0,duration:.8,ease:"power3.out",onComplete(){o.remove()}})
  },{passive:true})
}

/* ---------- 18. Kunang-kunang latar (sedikit, hanya transform+opacity) ---------- */
if(ANIM&&FINE&&!LOW){
  const layer=document.createElement("div");layer.id="fireflies";layer.setAttribute("aria-hidden","true");document.body.prepend(layer);
  for(let i=0;i<6;i++){
    const f=document.createElement("i");f.className="gsap-firefly";
    const s=G.utils.random(5,11);
    f.style.cssText="left:"+G.utils.random(0,100)+"%;top:"+G.utils.random(10,100)+"%;width:"+s+"px;height:"+s+"px";
    layer.appendChild(f);
    G.to(f,{x:()=>G.utils.random(-80,80),y:()=>G.utils.random(-110,40),duration:()=>G.utils.random(8,14),ease:"sine.inOut",repeat:-1,yoyo:true,delay:G.utils.random(0,4)});
    G.to(f,{opacity:()=>G.utils.random(.3,.9),duration:()=>G.utils.random(2,4),ease:"sine.inOut",repeat:-1,yoyo:true,delay:G.utils.random(0,3)})
  }
}

/* ---------- 19. Bahasa ---------- */
const I18N={sub:["Sudut Hutan","Forest Corner"],profil:["Profil","Profile"],sihir:["Buku Sihir","Spell Book"],katalog:["Katalog","Catalog"],klaim:["Klaim","Claim"],cta:["Pesan Sekarang","Order Now"]};
function navLang(){$$("[data-i18n]").forEach(e=>{const t=I18N[e.dataset.i18n];if(t)e.textContent=t[lang()]})}
if(typeof window.setLang==="function"){const _s=window.setLang;window.setLang=function(){const r=_s.apply(this,arguments);navLang();return r}}
navLang();

/* ---------- 20. Satu observer untuk semua perubahan halaman ---------- */
function onView(){
  const loading=!!$1(".loader");
  if(!loading&&seen!==location.hash){seen=location.hash;t0=performance.now()}
  tagPrevent();loaderFx();
  if(loading)return;
  hdCover();fitImgs();carousel();hero();catalog();claim();heads();groups();pages();pageIn()
}
let vq=0;
const schedule=()=>{if(!vq)vq=requestAnimationFrame(()=>{vq=0;prune();onView()})};
if(APP)new MutationObserver(schedule).observe(APP,{childList:true});
schedule();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<script>
function runGsapMotion(){
 if(!window.gsap||window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 gsap.killTweensOf(".kt-card,.kp-card,.stat,.bc,.dash-card");
 gsap.fromTo(".kt-card,.kp-card,.stat,.bc,.dash-card",{opacity:0,y:14,scale:.985},{opacity:1,y:0,scale:1,duration:.45,stagger:.04,ease:"power2.out",clearProps:"transform"});
}
function userDashboardHTML(){
 const s=SS.stats||{features:1300,groups:50,users:1000};
 return `<section class="mt reveal"><span class="eyebrow">${T("Dashboard Layanan","Service Dashboard")}</span><h2>${T("Pusat Kendali & Bantuan Cepat","Control & Quick Support Center")}</h2><p class="sub">${T("Akses langsung Customer Service Owner, klaim garansi berbasis invoice, dan Buku Sihir bot.","Direct access to Owner Customer Service, invoice warranty claims, and the bot Spellbook.")}</p><div class="about3" style="margin-top:16px"><div class="glass dash-card" style="cursor:pointer" onclick="go('cs')"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="dw-ic">${ic("cs",18)}</span><h3 style="margin:0">${T("Customer Service Live","Live Customer Service")}</h3></div><p>${T("Chat langsung dengan Owner di website untuk konsultasi pesanan atau bantuan teknis. Notifikasi langsung diteruskan ke WhatsApp Owner.","Chat directly with the Owner on the website for order help or technical support.")}</p><div style="margin-top:12px;font:700 12.5px var(--sans);color:var(--moss)">${T("Buka Ruang CS →","Open CS Room →")}</div></div><div class="glass dash-card" style="cursor:pointer" onclick="go('garansi')"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="dw-ic">${ic("garansi",18)}</span><h3 style="margin:0">${T("Klaim Garansi Invoice","Invoice Warranty Claim")}</h3></div><p>${T("Layanan bermasalah? Masukkan ID Transaksi (Invoice) dan jelaskan kendalanya. Bot langsung meneruskan laporanmu ke Owner.","Service issue? Enter your Transaction ID (Invoice) and explain the issue.")}</p><div style="margin-top:12px;font:700 12.5px var(--sans);color:var(--gold)">${T("Ajukan Klaim Garansi →","Submit Warranty Claim →")}</div></div><div class="glass dash-card" style="cursor:pointer" onclick="go('fitur')"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="dw-ic">${ic("fitur",18)}</span><h3 style="margin:0">${T("Buku Sihir Akurat","Accurate Spellbook")}</h3></div><p>${T(`Telusuri ${s.features}+ perintah aktif yang tersinkronisasi langsung dengan database plugin panel bot.`, `Browse ${s.features}+ active commands synced directly with the bot plugin database.`)}</p><div style="margin-top:12px;font:700 12.5px var(--sans);color:var(--moss)">${T("Buka Buku Sihir →","Open Spellbook →")}</div></div></div></section>`;
}
let CS_CUR=null;
async function vCS(){
 if(!ME){NEXT="cs";return go("masuk")}
 app.innerHTML=load("Membuka ruang Customer Service…");
 let data;try{data=await api("/api/cs/threads")}catch(e){return app.innerHTML=`<div class="glass pad center">${esc(e.message)}</div>`}
 const threads=data.threads||[];
 if(!CS_CUR&&threads.length)CS_CUR=threads[0].id;
 let activeThread=null;
 if(CS_CUR){try{activeThread=(await api("/api/cs/threads/"+CS_CUR)).thread}catch{}}
 app.innerHTML=`<span class="eyebrow">Customer Service</span><h2>${ME.role==="owner"?"Inbox Customer Service (Owner)":"Chat Langsung dengan Owner"}</h2><p class="sub">Pesanmu tersimpan di web dan otomatis mengirim notifikasi ke WhatsApp Owner.</p><div class="cx reveal" style="margin-top:18px"><aside class="cx-side"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Tiket Percakapan</h3>${ME.role!=="owner"?`<button class="btn sm" onclick="CS_CUR=null;vCS()">+ Baru</button>`:""}</div><div style="display:grid;gap:8px;max-height:420px;overflow:auto">${threads.length?threads.map(t=>`<div class="nt-r ${t.id===CS_CUR?"on":""}" style="border:1px solid var(--ln);padding:10px" onclick="CS_CUR='${t.id}';vCS()"><b>${esc(t.subject||t.id)}</b><span><i>${esc(t.userName||"")}</i> ${esc(t.lastMsg||"")}</span></div>`).join(""):`<p class="sub" style="font-size:13px">Belum ada percakapan.</p>`}</div></aside><section class="cx-win"><div class="cx-head"><span class="cx-dot"></span><b>${activeThread?esc(activeThread.subject)+" ("+activeThread.id+")":"Mulai Percakapan Baru dengan Owner"}</b><small>Online</small></div>${!activeThread&&ME.role!=="owner"?`<div style="padding:14px;border-bottom:1px solid var(--ln);background:var(--surf2)"><label style="margin-top:0">Topik / Judul Pertanyaan</label><input id="csSubj" placeholder="Contoh: Tanya pesanan panel / Kendala sewa bot" maxlength="80"></div>`:""}<div class="chat" id="csChatBox">${activeThread&&activeThread.messages?.length?activeThread.messages.map(m=>{const mine=(ME.role==="owner"&&m.sender==="owner")||(ME.role!=="owner"&&m.sender==="user");return `<div class="cm ${mine?"mine":""}"><div class="bx"><div class="nm"><b style="color:var(--t)">${esc(m.name)}</b>${m.sender==="owner"?'<span class="rl">Owner</span>':""}<span>${hm(m.at)}</span></div><div class="tx">${esc(m.text)}</div></div></div>`}).join(""):`<div class="center sub" style="margin:auto">Tulis pesan di bawah untuk memulai chat dengan Owner.</div>`}</div><div class="cx-send"><input id="csMsg" maxlength="1000" placeholder="Tulis pesan untuk ${ME.role==="owner"?"pengguna":"Owner"}…" onkeydown="if(event.key==='Enter')sendCS()"><button class="btn" id="csBtn" onclick="sendCS()">${ic("send",16)}Kirim</button></div></section></div>`;
 const box=$("#csChatBox");if(box)box.scrollTop=box.scrollHeight;
 setTimeout(()=>{initReveal();runGsapMotion()},40);
}
async function sendCS(){
 const inp=$("#csMsg"),btn=$("#csBtn");
 const text=(inp?.value||"").trim();if(!text)return toast("Tulis pesan terlebih dahulu");
 const subject=($("#csSubj")?.value||"Bantuan Customer Service").trim();
 btn.disabled=true;
 try{const j=await api("/api/cs/send",{b:{threadId:CS_CUR||"",subject,text}});CS_CUR=j.thread.id;toast("Pesan terkirim ke Owner");vCS()}
 catch(e){toast(""+e.message);btn.disabled=false}
}
async function vGaransi(){
 if(!ME){NEXT="garansi";return go("masuk")}
 app.innerHTML=load("Memuat data invoice & garansi…");
 let meData,wData;try{[meData,wData]=await Promise.all([api("/api/me"),api("/api/warranty")])}
 catch(e){return app.innerHTML=`<div class="glass pad center">${esc(e.message)}</div>`}
 const okOrders=(meData.orders||[]).filter(o=>o.status==="success");
 const warranties=wData.warranties||[];
 const wBadge=s=>s==="approved"?`<span class="badge s-success">Disetujui</span>`:s==="rejected"?`<span class="badge s-rejected">Ditolak</span>`:`<span class="badge s-verifying">Diproses Bot & Owner</span>`;
 app.innerHTML=`<span class="eyebrow">Garansi Layanan</span><h2>Klaim Garansi Invoice</h2><p class="sub">Masukkan ID Transaksi (Invoice) pemesananmu dan jelaskan alasan kendalanya. Bot akan langsung mengirimkan laporan klaim ke WhatsApp Owner.</p><div class="split mt" style="margin-top:20px"><section class="glass pad reveal"><h3>Form Pengajuan Klaim</h3><label>Pilih dari Invoice Berhasil</label><select id="wrPick" onchange="if(this.value)$('#wrInv').value=this.value"><option value="">-- Pilih invoice pesananmu --</option>${okOrders.map(o=>`<option value="${o.id}">${o.id} · ${esc(o.product)} (${rp(o.amount)})</option>`).join("")}</select><label>ID Transaksi / Invoice (Wajib)</label><input id="wrInv" class="mono" placeholder="Contoh: TRXXXXX" value="${okOrders[0]?.id||""}"><label>Nomor WhatsApp Aktif</label><input id="wrWa" inputmode="tel" value="${esc(ME.wa||"")}" placeholder="08123456789"><label>Jelaskan Alasan & Kendala (Wajib)</label><textarea id="wrReason" placeholder="Jelaskan secara detail apa kendalanya…"></textarea><button class="btn full" style="margin-top:16px" id="wrBtn" onclick="submitWarranty()">${ic("garansi",16)}Kirim Klaim Garansi ke Owner</button></section><section class="glass pad reveal"><h3>Riwayat Klaim Garansi</h3><p class="sub" style="margin-bottom:14px">Status klaim garansi yang pernah kamu ajukan.</p>${warranties.length?`<div style="display:grid;gap:10px">${warranties.map(w=>`<div class="rc" style="margin:0;padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><code class="mono">${esc(w.invoiceId)}</code>${wBadge(w.status)}</div><div style="font-weight:600;font-size:14px">${esc(w.product)}</div><p class="sub" style="font-size:12.5px;margin-top:4px">Alasan: ${esc(w.reason)}</p>${w.ownerNote?`<div class="note" style="margin-top:8px;padding:8px 10px;font-size:12.5px"><b>Catatan Owner:</b> ${esc(w.ownerNote)}</div>`:""}</div>`).join("")}</div>`:`<div class="pr-empty" style="padding:24px">Belum ada pengajuan klaim garansi.</div>`}</section></div>`;
 setTimeout(()=>{initReveal();runGsapMotion()},40);
}
async function submitWarranty(){
 const btn=$("#wrBtn");
 const invoiceId=($("#wrInv")?.value||"").trim().toUpperCase();
 const wa=($("#wrWa")?.value||"").trim();
 const reason=($("#wrReason")?.value||"").trim();
 if(!invoiceId)return toast("Masukkan ID Transaksi / Invoice terlebih dahulu");
 if(reason.length<10)return toast("Jelaskan alasan kendala minimal 10 karakter");
 btn.disabled=true;btn.textContent="Mengirim ke Owner…";
 try{await api("/api/warranty/claim",{b:{invoiceId,wa,reason}});toast("Klaim garansi terkirim ke WhatsApp Owner!");vGaransi()}
 catch(e){toast(""+e.message);btn.disabled=false;btn.innerHTML=ic("garansi",16)+"Kirim Klaim Garansi ke Owner"}
}
</script>
