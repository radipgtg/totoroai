<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--t:#f4f1e4;--mute:rgba(244,241,228,.68);--moss:#8fd16f;--gold:#f0cf7a;--g:rgba(255,255,255,.11);--gb:rgba(255,255,255,.24)}
body{font-family:Inter,sans-serif;color:var(--t);line-height:1.6;min-height:100vh;background:#0c2a20;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.1)}}
.ff{position:fixed;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 12px 4px rgba(255,233,168,.5);animation:fly 10s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(40px,-60px);opacity:1}}
.serif,h1,h2,h3{font-family:Fraunces,serif;letter-spacing:-.01em}
.glass{background:var(--g);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--gb);border-radius:24px;box-shadow:0 10px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3)}
header{position:sticky;top:0;z-index:30;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top))}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;border-radius:99px}
.logo{font-size:20px;font-weight:600;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:500;color:var(--t);cursor:pointer;white-space:nowrap;opacity:.8;transition:.2s}
nav a:hover,nav a.on{background:rgba(255,255,255,.16);opacity:1}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:24px 18px 70px;min-height:70vh}
.view{animation:rise .45s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pad{padding:26px}.center{text-align:center}
h2{font-size:28px;line-height:1.2;margin-bottom:6px}.sub{color:var(--mute);font-size:14px}.mt{margin-top:40px}
.hero{text-align:center;padding:56px 18px 34px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:16px auto;max-width:780px}.hero h1 em{color:var(--gold)}
.hero p{max-width:560px;margin:auto;color:var(--mute)}
.chip{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.13);border:1px solid var(--gb);font-size:12px;margin:3px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 14px Inter,sans-serif;padding:12px 24px;border-radius:99px;background:linear-gradient(135deg,#7cc35d,#3f8f55);color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(63,143,85,.4);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.1);border:1px solid var(--gb);box-shadow:none}.btn.red{background:linear-gradient(135deg,#c75a5a,#9a3a3a);box-shadow:none}.btn.sm{padding:7px 14px;font-size:12px}.full{width:100%}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.split{display:grid;gap:20px;grid-template-columns:1fr 1fr;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}.bar{border-radius:26px}}
.cat{padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.3s;min-height:210px}
.cat:hover{transform:translateY(-6px);background:rgba(255,255,255,.17)}
.cat .ic{font-size:36px;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.cat small{margin-top:auto;color:var(--moss);font-weight:600}
.tile{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;border-radius:18px;transition:.2s;font-size:14px}
.tile:hover{background:rgba(255,255,255,.2);transform:translateY(-3px)}
.tile b{color:var(--gold);white-space:nowrap}.tile s{display:block;font-size:11px;color:var(--mute)}
.off{background:var(--gold);color:#3a2f0a;border-radius:99px;font-size:11px;font-weight:700;padding:2px 9px;margin-left:6px}
input,textarea,select{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--gb);background:rgba(255,255,255,.1);color:var(--t);font:15px Inter,sans-serif;outline:none;margin-top:6px}
input::placeholder{color:rgba(244,241,228,.45)}input:focus{border-color:var(--moss);background:rgba(255,255,255,.16)}
label{font-size:12px;font-weight:600;color:var(--mute);display:block;margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--gb);font-size:14px}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;font-weight:600;word-break:break-all}
.note{background:rgba(240,207,122,.15);border:1px solid rgba(240,207,122,.4);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:14px}
.qr{background:#fff;padding:12px;border-radius:18px;display:inline-block}.qr img{width:260px;max-width:100%;display:block}
.spin{font-size:40px;display:inline-block;animation:sp 2.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap}
.s-awaiting{background:#f0cf7a;color:#4a3a05}.s-verifying{background:#9ccbee;color:#12395b}.s-success{background:#a6e08a;color:#1c4a10}.s-rejected{background:#f0a3a3;color:#5a1414}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0}
.stat{padding:16px;text-align:center}.stat b{font-size:26px;display:block;font-family:Fraunces,serif}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.ord{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;cursor:pointer;margin-bottom:12px;transition:.2s;align-items:center}
.ord:hover{background:rgba(255,255,255,.18)}.ord small{color:var(--mute)}
.chat{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px;margin-top:12px}
.m{max-width:82%;padding:11px 15px;border-radius:18px;font-size:14px}
.m.bot{background:rgba(255,255,255,.16);border:1px solid var(--gb);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:linear-gradient(135deg,#7cc35d,#3f8f55);align-self:flex-end;border-bottom-right-radius:4px}
.send{display:flex;gap:8px;margin-top:12px}.send input{margin:0}
details{padding:15px 20px;margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:14px}details p{margin-top:8px;color:var(--mute);font-size:13.5px}
.back{background:none;border:0;color:var(--t);opacity:.75;cursor:pointer;font:500 13px Inter;margin-bottom:14px}
.banner{padding:12px 20px;text-align:center;margin-bottom:10px;color:var(--gold);font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;text-align:left;border-bottom:1px solid var(--gb)}th{color:var(--mute);font-weight:600}
footer{position:relative;z-index:1;text-align:center;padding:30px 18px 50px;font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);padding:11px 22px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:99;pointer-events:none;background:rgba(12,42,32,.9);border:1px solid var(--gb)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 10%,rgba(143,209,111,.2),transparent 45%),radial-gradient(circle at 85% 90%,rgba(240,207,122,.16),transparent 45%);animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{to{transform:scale(1.18) rotate(3deg)}}
.leaf{position:fixed;top:-40px;z-index:0;pointer-events:none;opacity:.5;font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translate(90px,115vh) rotate(360deg)}}
.wrap{padding:34px 24px 90px}.pad{padding:32px}
.hero{position:relative;overflow:hidden;padding:72px 24px 52px}
.hero h1 em{background:linear-gradient(90deg,#f0cf7a,#8fd16f,#f0cf7a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.deco{position:absolute;font-size:32px;opacity:.75;animation:bob 4s ease-in-out infinite;pointer-events:none}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover::after{left:150%}
.glass{transition:transform .3s,box-shadow .3s,border-color .3s,background .3s}
.cat:hover,.tile:hover{border-color:rgba(240,207,122,.6);box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 28px rgba(143,209,111,.25)}
.tick{overflow:hidden;white-space:nowrap;margin:34px 0 4px;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tick div{display:inline-block;animation:mq 30s linear infinite;font-family:Fraunces,serif;font-size:18px;color:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}
.steps{display:grid;gap:26px 18px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));counter-reset:s;margin-top:30px}
.step{padding:34px 22px 22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-18px;left:22px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f0cf7a,#d9a93f);color:#3a2f0a;font:700 17px Fraunces,serif;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.step h3{font-size:17px;margin-bottom:4px}
.help{padding:20px 24px;margin-top:20px;font-size:13.5px}
.help h4{font-family:Fraunces,serif;font-size:16px;color:var(--gold);margin-bottom:6px}
.help ol,.help ul{margin-left:20px}.help li{margin:5px 0;color:var(--mute)}.help li b{color:var(--t)}
.help p{color:var(--mute)}
:is(.grid,.g3,.stats,.steps)>*{animation:rise .6s ease backwards}
:is(.grid,.g3,.stats,.steps)>*:nth-child(2){animation-delay:.08s}:is(.grid,.g3,.stats,.steps)>*:nth-child(3){animation-delay:.16s}:is(.grid,.g3,.stats,.steps)>*:nth-child(4){animation-delay:.24s}:is(.grid,.g3,.stats,.steps)>*:nth-child(n+5){animation-delay:.32s}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--t);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}
.split2{display:grid;gap:22px;grid-template-columns:340px 1fr;align-items:start}
@media(max-width:820px){.split2{grid-template-columns:1fr}.hero{padding:52px 16px 36px}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<div class="blob" style="width:420px;height:420px;background:#2f8f5b;top:-100px;left:-80px"></div>
<div class="blob" style="width:380px;height:380px;background:#c9a94d;opacity:.35;bottom:-120px;right:-60px;animation-delay:-8s"></div>
<div class="blob" style="width:300px;height:300px;background:#3b7fa6;opacity:.3;top:40%;left:55%;animation-delay:-4s"></div>
<header><div class="bar glass"><div class="logo serif" onclick="go('home')">☁ Totoro AI ❀</div><nav id="nav"></nav></div></header>
<main class="wrap"><div id="app" class="view"></div></main>
<footer>⋆｡˚ ☁︎ Totoro AI · dibuat dengan ♡ oleh @radipgtg ☁︎ ˚｡⋆<br>“Hutan kecil untuk kebutuhan digitalmu.”</footer>
<div id="toast"></div>
<script>
const API="https://api.totoroai.my.id",QRIS="https://files.catbox.moe/vjvqpu.jpeg",WA="6285602654058";
let CAT=null,ME=null,TOK=localStorage.getItem("tt_tok")||"",NEXT="",P=null,AUTHTAB="in",FIL="all";
const $=s=>document.querySelector(s),app=$("#app");
const rp=n=>"Rp"+Number(n).toLocaleString("id-ID");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={awaiting:"Belum bayar",verifying:"Menunggu ACC",success:"Berhasil",rejected:"Ditolak"};
const dt=s=>new Date(s).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
const go=h=>{location.hash=h};
async function api(p,o={}){
 const r=await fetch(API+p,{method:o.b?"POST":"GET",headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{})},body:o.b?JSON.stringify(o.b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.message||"Gagal ("+r.status+")");return j}
const load=t=>`<div class="center pad"><span class="spin">❀</span><p class="serif" style="margin-top:10px">${t}</p></div>`;
for(let i=0;i<14;i++){const f=document.createElement("i");f.className="ff";f.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*10}s;animation-duration:${8+Math.random()*8}s`;document.body.appendChild(f)}

for(let i=0;i<9;i++){const l=document.createElement("i");l.className="leaf";l.textContent=["🍃","✿","❀","☘","🌿"][i%5];l.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*14}px;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;document.body.appendChild(l)}
const EXPL={
 bot:{what:"Bot WhatsApp siap pakai yang kamu sewa untuk grupmu: AI, downloader TikTok/YouTube, pembuat stiker, game, dan 1300+ fitur lain. Tidak perlu hosting sendiri.",who:"Admin grup, komunitas, atau toko online yang ingin grupnya lebih hidup dan otomatis.",flow:["Pilih durasi sewa","Isi <b>nomor WhatsApp</b> dan <b>link grup</b> (wajib)","Transfer QRIS lalu kirim bukti transfer","Owner menekan ACC, bot otomatis masuk ke grupmu"]},
 panel:{what:"Server hosting Pterodactyl yang legal untuk menjalankan bot WhatsApp/Telegram 24 jam nonstop. Makin besar RAM, makin banyak yang bisa dijalankan.",who:"Pemilik script bot yang butuh tempat menjalankannya, dari bot pribadi sampai bot ramai.",flow:["Pilih ukuran RAM","Isi <b>nomor WhatsApp</b> aktif","Transfer QRIS lalu kirim bukti transfer","Owner ACC, lalu detail login panel dikirim ke WhatsApp-mu"]},
 am:{what:"Alight Motion Premium untuk edit video tanpa watermark dan dengan fitur lengkap. Ada akun siap pakai (Seller/Bulk), premium untuk email sendiri (Buyer), dan paket Reseller.",who:"Editor video, pembuat konten, atau penjual ulang akun premium.",flow:["Pilih jenis paket (Bulk: tentukan jumlah 10-50)","Isi <b>nomor WhatsApp</b> aktif (dan email AM di catatan untuk Buyer)","Transfer QRIS lalu kirim bukti transfer","Owner ACC, akun tampil di halaman pesanan dan dikirim ke WhatsApp"]},
 jasa:{what:"Bantuan teknis: owner memasang dan menjalankan botmu di panel, menjual source code bot Totoro AI, atau membimbing kamu membuat bot dari nol.",who:"Pemula yang bingung setup, atau yang ingin langsung punya script bot lengkap.",flow:["Pilih jasa yang dibutuhkan","Isi <b>nomor WhatsApp</b> aktif dan jelaskan kebutuhan di catatan","Transfer QRIS lalu kirim bukti transfer","Owner ACC lalu menghubungi WhatsApp-mu untuk langkah berikutnya"]}};
const helpBox=k=>{const E=EXPL[k];return `<div class="help glass"><h4>✦ Apa ini?</h4><p>${E.what}</p><h4 style="margin-top:14px">☘ Cocok untuk</h4><p>${E.who}</p><h4 style="margin-top:14px">➶ Alurnya</h4><ol>${E.flow.map(f=>`<li>${f}</li>`).join("")}</ol></div>`};
/* ===== boot & router ===== */
async function boot(){
 app.innerHTML=load("Menyiapkan hutan…");
 try{CAT=await api("/api/catalog")}catch{app.innerHTML=`<div class="glass pad center"><h2>🍃 Server belum terhubung</h2><p class="sub">Pastikan bot menyala, lalu muat ulang halaman.</p><button class="btn" style="margin-top:16px" onclick="boot()">↻ Coba lagi</button></div>`;return}
 if(TOK)try{ME=(await api("/api/me")).user}catch{TOK="";localStorage.removeItem("tt_tok")}
 route()}
function navDraw(a){
 const L=[["home","⌂ Beranda"],["katalog","✿ Katalog"],["ai","✦ Tanya AI"]];
 if(ME){L.push(["profil","❀ Profil"]);if(ME.role==="owner")L.push(["owner","♛ Owner"])}else L.push(["masuk","➜ Masuk"]);
 $("#nav").innerHTML=L.map(([r,t])=>`<a class="${a===r?"on":""}" onclick="go('${r}')">${t}</a>`).join("")}
function route(){
 clearInterval(P);const[a,b,c]=(location.hash.slice(1)||"home").split("-");navDraw(a);
 app.classList.remove("view");void app.offsetWidth;app.classList.add("view");scrollTo(0,0);
 if(!CAT)return;
 const need=()=>{NEXT=location.hash.slice(1);go("masuk")};
 if(a==="katalog")b&&CAT.cats[b]?vCat(b):vCatalog();
 else if(a==="beli"&&CAT.cats[b]?.it[c])ME?vBuy(b,+c):need();
 else if(a==="order")ME?vOrder(b):need();
 else if(a==="profil")ME?vProfile():need();
 else if(a==="owner")ME?.role==="owner"?vOwner():go("home");
 else if(a==="masuk")ME?go("profil"):vAuth();
 else if(a==="ai")vAi();
 else vHome()}
addEventListener("hashchange",route);

/* ===== katalog ===== */
const cards=()=>`<div class="grid">${Object.entries(CAT.cats).map(([k,c])=>`<div class="glass cat" onclick="go('katalog-${k}')"><span class="ic">${c.ic}</span><h3 style="font-size:21px">${c.n}${c.disc?`<span class="off">-${c.disc}%</span>`:""}</h3><p class="sub">${c.d}</p><small>mulai ${rp(Math.min(...c.it.map(i=>i.p)))} ➜</small></div>`).join("")}</div>`;
function vCatalog(){app.innerHTML=`<h2>✿ Katalog Hutan</h2><p class="sub" style="margin-bottom:20px">Pilih layanan yang kamu butuhkan ✦</p>${cards()}`}
function vHome(){
 const F=[["Bagaimana cara memesan?","Masuk akun, pilih paket, transfer lewat QRIS, kirim bukti transfer. Owner menerima notifikasi WhatsApp dan menekan ACC."],["Berapa lama prosesnya?","Biasanya hitungan menit setelah bukti terkirim. Halaman pesanan ikut berubah otomatis."],["Untuk sewa bot, apa yang harus disiapkan?","Link grup WhatsApp. Setelah di-ACC bot langsung masuk ke grupmu."],["Ada garansi?","Ada, selama masa aktif produk. Hubungi owner jika ada kendala."]];
 app.innerHTML=`${CAT.banner?`<div class="glass banner">✦ ${esc(CAT.banner)} ✦</div>`:""}
 <section class="hero glass"><span class="deco" style="left:6%;top:14%">🌿</span><span class="deco" style="right:8%;top:18%;animation-delay:-1.5s">☁️</span><span class="deco" style="left:12%;bottom:12%;animation-delay:-2.5s">✿</span><span class="deco" style="right:12%;bottom:14%;animation-delay:-3s">🍃</span><span class="chip">★ 4.9 / 5 · terpercaya</span><span class="chip">☘ bergaransi</span>
 <h1>Selamat datang di <em>hutan Totoro</em> ✿</h1><p>Bot WhatsApp, panel hosting, Alight Motion, sampai jasa setup. Bayar lewat QRIS, kirim bukti, dan biar daun-daun yang mengantar ➶</p>

 if(has(/login|masuk|daftar|riwayat|profil|akun saya/))return{s:1,t:"Daftar atau masuk lewat tombol Masuk di atas. Di Profil kamu bisa melihat semua transaksi: berhasil, tertunda, atau ditolak ✿"};
 if(has(/error|gagal|bug|rusak|tidak bisa|gabisa|ga bisa/))return{s:1,t:"Maaf ya 🍃 Coba muat ulang halaman. Kalau masih bermasalah, chat WA Order 0856-0265-4058 dengan ID pesananmu."};
 if(has(/harga|katalog|produk|jual|list|daftar harga/))return{s:1,t:`Harga mulai dari ✿\n• Sewa Bot: ${mn("bot")}\n• Panel: ${mn("panel")}\n• Alight Motion: ${mn("am")}\n• Jasa: ${mn("jasa")}\nBuka Katalog untuk detailnya.`};
 return{s:0,t:"Hmm, daun-daun belum paham maksudmu 🍃 Coba tanya soal harga bot, panel, Alight Motion, cara order, atau pembayaran. Atau chat WA Order 0856-0265-4058."};
}
const SYS=()=>`Kamu "Totoro AI", asisten ramah toko Totoro AI. Jawab Bahasa Indonesia singkat, hangat ala Ghibli, emoji secukupnya. Katalog terkini: `+Object.values(CAT.cats).map(c=>c.n+": "+c.it.map(i=>i.l+" "+rp(i.p)).join(", ")).join(" | ")+`. Cara order: masuk akun, pilih paket, isi nomor WhatsApp (sewa bot wajib link grup), bayar QRIS, kirim bukti transfer, tunggu ACC owner. Jangan mengarang harga di luar katalog. Masalah teknis arahkan ke WA Order 0856-0265-4058.`;
async function gemini(q){
 if(!GEMINI_KEY)return null;
 for(const mdl of ["gemini-2.5-flash","gemini-2.0-flash"]){
  try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mdl}:generateContent?key=${GEMINI_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents:[...hist.slice(-8),{role:"user",parts:[{text:q}]}],generationConfig:{temperature:.7,maxOutputTokens:500}})});
   const j=await r.json(),a=j.candidates?.[0]?.content?.parts?.[0]?.text;if(a){hist.push({role:"user",parts:[{text:q}]},{role:"model",parts:[{text:a}]});return a}}catch{}}
 return null}
function vAi(){
 if(!chat.length)chat=[{r:"bot",t:"Halo, aku Totoro ☁ Tanya apa saja soal harga, produk, cara order, atau pembayaran ya ✿"}];
 app.innerHTML=`<div class="split2"><div class="glass pad"><div style="font-size:42px;animation:bob 3s ease-in-out infinite;display:inline-block">🌳</div><h2>✦ Tanya Totoro</h2><p class="sub">Asisten hutan yang menjawab seputar toko ini.</p>
 <div class="help" style="padding:0;margin-top:14px"><h4>Bisa ditanya soal</h4><ul><li>Harga sewa bot, panel, Alight Motion, jasa</li><li>Cara order dan cara bayar</li><li>Diskon yang sedang aktif</li><li>Lama proses dan garansi</li><li>Kontak owner dan admin</li></ul></div>
 <div style="margin-top:12px">${["Berapa harga sewa bot?","Panel 5 GB berapa?","Bulk 20 akun berapa?","Cara order?","Ada diskon?"].map(q=>`<span class="chip" style="cursor:pointer" onclick="ask('${q}')">${q}</span>`).join("")}</div></div>
 <div class="glass pad"><div class="chat" id="chat" style="height:56vh;margin-top:0">${chat.map(m=>`<div class="m ${m.r}">${m.typing?'<span class="dots"><i></i><i></i><i></i></span>':esc(m.t).replace(/\n/g,"<br>")}</div>`).join("")}</div>
 <div class="send"><input id="aiIn" placeholder="Ketik pertanyaan…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">➤</button></div></div></div>`;
 const c=$("#chat");c.scrollTop=c.scrollHeight}
async function ask(q){
 if(busy)return;const t=(q||$("#aiIn")?.value||"").trim();if(!t)return;busy=true;
 chat.push({r:"me",t},{r:"bot",t:"",typing:1});vAi();
 const L=local(t);let a=null;
 if(L.s)a=L.t;else{a=await gemini(t);if(!a)a=await api("/api/ai",{b:{message:t}}).then(j=>j.reply).catch(()=>null);if(!a)a=L.t}
 await new Promise(r=>setTimeout(r,450));
 chat[chat.length-1]={r:"bot",t:a};busy=false;if(location.hash==="#ai")vAi()}
boot();
</script>
