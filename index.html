<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1f1b">
<title>Totoro AI ✿ Toko Digital Hutan</title>
<link rel="icon" href="https://api.totoroai.my.id/api/img/logo">
<link rel="apple-touch-icon" href="https://api.totoroai.my.id/api/img/logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1f1b;
  --card:rgba(255,255,255,.055);
  --card2:rgba(255,255,255,.095);
  --ln:rgba(255,255,255,.11);
  --t:#eaf3ec;
  --mute:#9db5a8;
  --moss:#8fe3b0;
  --moss2:#3f9a6b;
  --gold:#f4d58d;
  --sky:#9ad4ee;
  --rose:#ff7d92;
  --r:20px;
  --ease:cubic-bezier(.22,.8,.36,1);
  --spring:cubic-bezier(.34,1.35,.64,1);
}
html{scroll-behavior:auto;scroll-padding-top:92px}
body{
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  color:var(--t);
  background:var(--bg);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  overscroll-behavior-x:none;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(60% 50% at 12% 0%,rgba(143,227,176,.14),transparent 70%),
    radial-gradient(50% 45% at 100% 100%,rgba(244,213,141,.11),transparent 70%),
    radial-gradient(40% 40% at 90% 20%,rgba(154,212,238,.08),transparent 70%);
}
h1,h2,h3,.serif{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;letter-spacing:-.015em}
button,input,textarea,select,a,.cat,.tile,.feat,.pkg,.ord,.cmdc,.pill,.chip{
  font-family:inherit;
  touch-action:manipulation;
}
a{color:inherit}

/* Hiasan hutan lembut */
.ff{position:fixed;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,233,168,.42);animation:fly 12s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes fly{0%,100%{transform:translate3d(0,0,0);opacity:.15}50%{transform:translate3d(28px,-46px,0);opacity:.85}}
.leaf{position:fixed;top:-40px;z-index:0;pointer-events:none;opacity:.32;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(65px,115vh,0) rotate(300deg)}}

.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.22);transition:border-color .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease)}
.pad{padding:26px}.center{text-align:center}.mt{margin-top:56px}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.2;margin-bottom:6px}
.sub{color:var(--mute);font-size:14px;line-height:1.72}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font:600 11px "Plus Jakarta Sans";letter-spacing:.15em;text-transform:uppercase;color:var(--moss);margin-bottom:8px}

/* Scroll progress bar */
#scrollbar{
  position:fixed;top:0;left:0;width:100%;height:3px;z-index:100;
  transform:scaleX(var(--scroll-progress,0));transform-origin:left center;
  background:linear-gradient(90deg,var(--moss),var(--gold),var(--sky));
  box-shadow:0 0 12px rgba(143,227,176,.65);
  pointer-events:none;border-radius:0 3px 3px 0;will-change:transform;
  transition:transform .08s linear;
}
#scrollbar::after{
  content:"";position:absolute;right:0;top:0;width:34px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));
  filter:blur(1px);opacity:.75;
}

/* Header & navigasi */
header{position:sticky;top:0;z-index:40;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar{
  max-width:1180px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 10px 7px 16px;border-radius:99px;
  background:rgba(13,31,27,.76);
  transition:background .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease),padding .3s var(--ease);
}
header.scrolled .bar{
  background:rgba(10,24,20,.95);
  border-color:rgba(143,227,176,.24);
  box-shadow:0 12px 34px rgba(0,0,0,.38);
  padding:6px 10px 6px 16px;
}
.header-right{display:flex;align-items:center;gap:8px;min-width:0}
.logo{
  display:flex;align-items:center;gap:9px;font-size:19px;cursor:pointer;white-space:nowrap;
  transition:transform .26s var(--spring);
}
.logo:hover{transform:translateY(-1px)}
.logo:active{transform:scale(.94)}
.logo .brand-badge{
  width:31px;height:31px;border-radius:11px;overflow:hidden;
  border:1px solid rgba(143,227,176,.35);
  box-shadow:0 4px 12px rgba(63,154,107,.25);
  display:grid;place-items:center;flex:none;
}
.logo .brand-badge img{width:100%;height:100%;object-fit:cover;display:block}
.stat-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;
  border:1px solid var(--ln);background:rgba(255,255,255,.03);
  color:var(--mute);white-space:nowrap;
  transition:border-color .25s,background .25s,transform .22s var(--ease);
}
.stat-chip b{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 8px var(--moss);flex:none;animation:pulseDot 2.4s ease-in-out infinite}
.stat-chip.off b{background:var(--rose);box-shadow:0 0 8px var(--rose);animation:none}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}

nav{display:flex;gap:3px;align-items:center}
nav a{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--mute);white-space:nowrap;
  transition:color .22s var(--ease),background .22s var(--ease),transform .22s var(--spring);
}
nav a i{font-style:normal;font-size:14px;transition:transform .25s var(--spring)}
nav a:hover{color:var(--t);background:var(--card);transform:translateY(-1px)}
nav a:hover i{transform:scale(1.12)}
nav a:active{transform:scale(.94)}
nav a.on{color:#0d1f1b;background:var(--moss);font-weight:600;box-shadow:0 4px 14px rgba(143,227,176,.28)}
nav img.av{width:20px;height:20px;border-radius:50%;object-fit:cover}

.mb{max-width:1180px;margin:8px auto 0;padding:0 16px;position:sticky;top:68px;z-index:35}
.mb div{padding:10px 18px;border-radius:14px;font-size:13.5px;font-weight:500;background:rgba(244,213,141,.16);border:1px solid rgba(244,213,141,.45);color:var(--gold);animation:rise .4s var(--ease)}
.mb div.red{background:rgba(242,163,163,.15);border-color:rgba(242,163,163,.5);color:var(--rose)}

.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:26px 16px 90px;min-height:70vh}
.view{animation:rise .48s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
#app.out{opacity:0;transform:translate3d(0,-7px,0);transition:opacity .18s ease,transform .2s var(--ease)}

/* Tombol & animasi sentuh */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;cursor:pointer;font:600 14px "Plus Jakarta Sans",sans-serif;
  padding:12px 24px;border-radius:99px;
  background:linear-gradient(135deg,#9be07a,#4f9f62);color:#082015;
  text-decoration:none;box-shadow:0 6px 20px rgba(63,154,107,.35);
  transition:transform .25s var(--spring),filter .22s ease,box-shadow .25s var(--ease),background .22s ease;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 10px 26px rgba(63,154,107,.42)}
.btn:active{transform:scale(.94);filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--t);border:1px solid var(--ln);box-shadow:none}
.btn.ghost:hover{background:var(--card2);border-color:rgba(143,227,176,.28);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn.ghost:active{transform:scale(.95)}
.btn.red{background:linear-gradient(135deg,#e07b7b,#b24a4a);color:#fff;box-shadow:none}
.btn.sm{padding:7px 14px;font-size:12px}.full{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.acts.c{justify-content:center}

/* Form */
input,textarea,select{
  width:100%;padding:12px 15px;border-radius:14px;
  border:1px solid var(--ln);background:rgba(0,0,0,.24);color:var(--t);
  font-size:15px;outline:none;margin-top:6px;
  transition:border-color .22s var(--ease),box-shadow .22s var(--ease),background .22s var(--ease);
}
select option{background:#10291f}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:rgba(238,243,230,.38)}
input:focus,textarea:focus,select:focus{border-color:var(--moss);background:rgba(0,0,0,.32);box-shadow:0 0 0 3px rgba(143,227,176,.16)}
label{font-size:12px;font-weight:600;color:var(--mute);display:block;margin-top:14px}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--t);font-weight:500;cursor:pointer}.chk input{width:auto;margin:0;accent-color:#9be07a}
.pw{position:relative}.pw input{padding-right:50px}
.eye{position:absolute;right:6px;top:calc(50% + 3px);transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;border-radius:50%;transition:background .2s,color .2s,transform .2s var(--spring)}
.eye:hover{background:var(--card);color:var(--t)}.eye:active{transform:translateY(-50%) scale(.86)}

/* Selector paket */
.pkgs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:10px}
.pkg{position:relative;padding:16px 14px;border-radius:16px;background:var(--card);border:2px solid var(--ln);cursor:pointer;transition:transform .26s var(--spring),background .24s ease,border-color .24s ease,box-shadow .26s ease;overflow:hidden}
.pkg:hover{background:var(--card2);transform:translateY(-2px);border-color:rgba(143,227,176,.32)}
.pkg:active{transform:scale(.97)}
.pkg.on{border-color:var(--moss);background:rgba(143,227,176,.1);box-shadow:0 0 0 3px rgba(143,227,176,.15),0 8px 24px rgba(63,154,107,.25)}
.pkg .radio{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;transition:all .24s var(--spring)}
.pkg.on .radio{border-color:var(--moss);background:var(--moss)}
.pkg.on .radio::after{content:"✓";font-size:11px;font-weight:800;color:#082015}
.pkg h4{font-size:14px;font-weight:600;margin-bottom:4px;padding-right:26px}
.pkg .pr{font:700 20px "Bricolage Grotesque",sans-serif;color:var(--gold);line-height:1.1;margin-top:6px}
.pkg .pr s{font-size:12px;color:var(--mute);font-weight:400;display:block;text-decoration:line-through;line-height:1.2}
.pkg .desc{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.pkg .off-badge{position:absolute;top:0;left:0;background:var(--gold);color:#3a2f0a;font:800 9px "Plus Jakarta Sans";letter-spacing:.05em;padding:3px 10px;border-bottom-right-radius:10px}
.pkg.on .off-badge{background:#fff}

/* Hero */
.hero{position:relative;overflow:hidden;padding:54px 36px 0;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;min-height:520px;isolation:isolate}
.hero::after{content:"";position:absolute;width:250px;height:250px;right:6%;top:4%;background:radial-gradient(circle,rgba(143,227,176,.13),transparent 70%);pointer-events:none;z-index:0}
.hero h1{font-size:clamp(36px,5.6vw,62px);line-height:1.05;margin:12px 0 16px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#f2cf7e,#9be07a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--mute);max-width:490px;font-size:16px;line-height:1.7}
.hero-l{position:relative;z-index:2;padding-bottom:112px}
.hero svg.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;z-index:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:12px;margin:0 6px 6px 0;color:var(--mute);transition:transform .22s var(--spring),background .2s,border-color .2s,color .2s}
.chip:hover{transform:translateY(-1px);background:var(--card2);color:var(--t);border-color:rgba(143,227,176,.25)}
.chip:active{transform:scale(.95)}

.phone{position:relative;z-index:2;max-width:304px;margin:0 auto 70px;border-radius:30px;background:#0d1a15;border:1px solid rgba(143,227,176,.18);box-shadow:0 24px 60px rgba(0,0,0,.48);overflow:hidden;transform:rotate(2.2deg);transition:transform .45s var(--ease)}
.phone:hover{transform:rotate(0deg) translateY(-4px)}
.ph-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#12302a;border-bottom:1px solid var(--ln)}
.ph-top img{width:35px;height:35px;border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(143,227,176,.55)}
.bub .nm{display:block;font-style:normal;font-size:10px;font-weight:700;margin-bottom:2px}.bub.me .nm{color:var(--gold)}.bub.bot .nm{color:var(--moss)}
.ph-top b{font-size:13px;display:block;line-height:1.2}.ph-top small{font-size:10.5px;color:var(--moss)}
.ph-body{padding:14px 12px;display:flex;flex-direction:column;gap:7px;min-height:270px;background:radial-gradient(circle at 50% 0,rgba(143,227,176,.08),transparent 60%)}
.bub{max-width:86%;padding:7px 11px;border-radius:12px;font-size:12px;line-height:1.45;opacity:0;animation:pop .48s var(--ease) forwards}
.bub.me{align-self:flex-end;background:#1f5f46;border-top-right-radius:3px}.bub.bot{align-self:flex-start;background:#1a2a24;border:1px solid var(--ln);border-top-left-radius:3px}
.bub code{font-family:ui-monospace,monospace;color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translate3d(0,8px,0) scale(.96)}to{opacity:1;transform:none}}

/* Stats & grid */
.sgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:18px}
.stat{padding:22px 18px;text-align:center}.stat b{font:600 34px "Bricolage Grotesque",sans-serif;display:block;line-height:1.1;color:var(--gold)}.stat span{font-size:12.5px;color:var(--mute)}
.stat.sm b{font-size:24px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.split{display:grid;gap:18px;grid-template-columns:1fr 1fr;align-items:start}
.split2{display:grid;gap:18px;grid-template-columns:320px 1fr;align-items:start}
@media(max-width:860px){.split,.split2{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:40px 22px 0}.phone{display:none}.hero-l{padding-bottom:120px}}

.cat{padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:transform .28s var(--spring),background .25s ease,border-color .25s ease,box-shadow .28s ease}
.cat:hover,.tile:hover,.feat:hover,.ord:hover,.step:hover,details:hover{transform:translateY(-3px);background:var(--card2);border-color:rgba(244,213,141,.4);box-shadow:0 14px 34px rgba(0,0,0,.26)}
.cat:active,.tile:active,.feat:active,.ord:active{transform:scale(.975)}
.cat .ic{font-size:34px;transition:transform .3s var(--spring)}.cat:hover .ic{transform:scale(1.08) rotate(-3deg)}
.cat small{margin-top:auto;color:var(--moss);font-weight:600}
.tile{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;border-radius:16px;font-size:14px;transition:transform .25s var(--spring),background .22s ease,border-color .22s ease}
.tile b{color:var(--gold);white-space:nowrap}.tile s{display:block;font-size:11px;color:var(--mute)}
.off{background:var(--gold);color:#3a2f0a;border-radius:99px;font-size:11px;font-weight:700;padding:2px 9px;margin-left:6px;vertical-align:middle}
.feat{padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .28s var(--spring),background .25s ease,border-color .25s ease}
.feat .ic{font-size:30px;width:54px;height:54px;border-radius:16px;background:rgba(143,227,176,.12);display:grid;place-items:center;margin-bottom:6px;transition:transform .3s var(--spring)}.feat:hover .ic{transform:scale(1.06)}
.cmd{display:inline-block;font:600 12px ui-monospace,monospace;color:var(--gold);background:rgba(244,213,141,.12);padding:3px 10px;border-radius:99px;width:fit-content;cursor:pointer;transition:background .2s,transform .2s var(--spring)}
.cmd:hover{background:rgba(244,213,141,.22)}.cmd:active{transform:scale(.94)}
.demo{margin-top:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);font-size:12px;display:flex;flex-direction:column;gap:5px}
.demo span{padding:5px 9px;border-radius:10px;width:fit-content;max-width:92%}.demo .u{align-self:flex-end;background:#1f5f46}.demo .b{background:#1a2a24;border:1px solid var(--ln)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;font-weight:600;word-break:break-all}
.note{background:rgba(244,213,141,.1);border:1px solid rgba(244,213,141,.35);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:14px;line-height:1.7}
.qr{background:#fff;padding:12px;border-radius:18px;display:inline-block}.qr img{width:240px;max-width:100%;display:block}

/* Loader */
.loader{position:relative;isolation:isolate;min-height:clamp(380px,62vh,580px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px;gap:14px;overflow:hidden;border:1px solid rgba(184,221,153,.13);border-radius:28px;background:radial-gradient(ellipse at 50% 42%,rgba(119,174,104,.17),transparent 48%),linear-gradient(160deg,rgba(20,55,39,.72),rgba(7,23,17,.9));box-shadow:inset 0 1px rgba(255,255,255,.05),0 24px 70px rgba(0,0,0,.18)}
.loader::before,.loader::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.loader::before{width:260px;height:260px;background:radial-gradient(circle,rgba(244,213,141,.12),transparent 68%);top:5%;left:50%;transform:translateX(-50%);animation:loaderGlow 5s ease-in-out infinite}
.loader::after{inset:auto 8% 12%;height:1px;background:linear-gradient(90deg,transparent,rgba(180,219,151,.25),transparent)}
.loader-scene{position:relative;width:152px;height:152px;display:grid;place-items:center;margin-bottom:4px}
.loader-orbit{position:absolute;inset:5px;border:1px solid rgba(198,226,169,.2);border-radius:50%;animation:orbit 12s linear infinite}
.loader-orbit::before,.loader-orbit::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px rgba(244,213,141,.7)}
.loader-orbit::before{top:17px;left:24px}.loader-orbit::after{right:13px;bottom:31px;width:5px;height:5px;background:var(--moss)}
.loader-core{width:92px;height:92px;border-radius:34px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,rgba(143,227,176,.2),rgba(31,87,57,.35));border:1px solid rgba(199,231,167,.3);box-shadow:0 0 45px rgba(143,227,176,.16),inset 0 1px rgba(255,255,255,.12);animation:coreFloat 3.8s ease-in-out infinite}
.loader-core img{width:100%;height:100%;object-fit:cover;display:block}
.loader-firefly{position:absolute;font-size:14px;animation:firefly 3s ease-in-out infinite}
.loader-firefly.one{left:0;top:42px}.loader-firefly.two{right:2px;top:24px;animation-delay:-1.2s}.loader-firefly.three{bottom:3px;left:50%;animation-delay:-2s}
.loader-txt{font:600 clamp(17px,3vw,21px) "Bricolage Grotesque",sans-serif;color:var(--t);letter-spacing:.01em;text-align:center}
.loader-sub{font-size:12.5px;color:var(--mute);text-align:center;max-width:300px;line-height:1.7;min-height:42px}
.loader-track{width:min(220px,70%);height:3px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:3px}
.loader-track i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--moss2),var(--moss),var(--gold));box-shadow:0 0 12px rgba(143,227,176,.5);animation:loaderProgress 1.8s ease-in-out infinite}
.loader-caption{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(197,220,186,.55);margin-top:3px}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes coreFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes firefly{0%,100%{opacity:.25;transform:translateY(4px) scale(.8)}50%{opacity:1;transform:translateY(-8px) scale(1.15)}}
@keyframes loaderGlow{0%,100%{opacity:.55;transform:translateX(-50%) scale(.9)}50%{opacity:1;transform:translateX(-50%) scale(1.12)}}
@keyframes loaderProgress{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}

.badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap}
.s-awaiting{background:#f2cf7e;color:#4a3a05}.s-verifying{background:#9ccbee;color:#12395b}.s-success{background:#a6e08a;color:#1c4a10}.s-rejected{background:#f2a3a3;color:#5a1414}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.ord{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;cursor:pointer;margin-bottom:12px;align-items:center}
.ord small{color:var(--mute)}
.steps{display:grid;gap:26px 16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));counter-reset:s;margin-top:34px}
.step{padding:32px 22px 22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-18px;left:22px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f2cf7e,#d9a93f);color:#3a2f0a;font:700 17px "Bricolage Grotesque",sans-serif;display:grid;place-items:center}
.step h3{font-size:17px;margin-bottom:4px}
.help{padding:20px 24px;margin-top:20px;font-size:13.5px}
.help h4{font:600 16px "Bricolage Grotesque",sans-serif;color:var(--gold);margin-bottom:6px}
.help ol,.help ul{margin-left:20px}.help li{margin:5px 0;color:var(--mute)}.help li b{color:var(--t)}.help p{color:var(--mute)}
details{padding:15px 20px;margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:14px;transition:color .2s}details:hover summary{color:var(--gold)}details p{margin-top:8px;color:var(--mute);font-size:13.5px}
details[open] p{animation:rise .28s var(--ease)}
.back{background:none;border:0;color:var(--t);opacity:.72;cursor:pointer;font:500 13px "Plus Jakarta Sans";margin-bottom:14px;transition:opacity .2s,transform .22s var(--spring)}.back:hover{opacity:1;transform:translateX(-3px)}.back:active{transform:scale(.95)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;text-align:left;border-bottom:1px solid var(--ln)}th{color:var(--mute);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mute);margin-top:10px}

/* Avatar & role */
.avt{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--moss2),#2f6f4a);color:#fff;font-weight:700;overflow:hidden;flex:none;object-fit:cover}
.avt img{width:100%;height:100%;object-fit:cover}
.avt.t{position:relative}.avt.t img{position:absolute;inset:0}
.avbtn{position:relative;cursor:pointer;border-radius:50%;display:inline-block}
.avbtn::after{content:"📷 Ganti";position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:12px;font-weight:600;opacity:0;transition:opacity .24s ease}
.avbtn:hover::after{opacity:1}
.rl{font-size:10px;background:var(--gold);color:#3a2f0a;border-radius:99px;padding:1px 8px;font-weight:700;letter-spacing:.03em;vertical-align:middle;white-space:nowrap;font-family:"Plus Jakarta Sans",sans-serif}
.rl.big{font-size:12px;padding:2px 11px}
.rl.pr{background:var(--sky);color:#0d2b3d}

/* Chat */
.chat{height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 4px 4px 0;margin-top:12px;scroll-behavior:smooth}
.cm{display:flex;gap:10px;align-items:flex-end;animation:rise .3s var(--ease)}.cm.mine{flex-direction:row-reverse}
.cm .bx{max-width:76%;min-width:0}
.cm .nm{font-size:11.5px;color:var(--mute);margin:0 6px 3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cm.mine .nm{justify-content:flex-end}
.cm .tx{padding:9px 14px;border-radius:16px;font-size:14px;background:var(--card2);border:1px solid var(--ln);border-bottom-left-radius:4px;word-break:break-word}
.cm.mine .tx{background:linear-gradient(135deg,#2e7d52,#215f3f);border-color:transparent;border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.cm .x{background:none;border:0;color:var(--rose);cursor:pointer;font-size:11px;opacity:.7}
.m{max-width:82%;padding:11px 15px;border-radius:18px;font-size:14px;animation:rise .28s var(--ease)}
.m.bot{background:var(--card2);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:linear-gradient(135deg,#2e7d52,#215f3f);align-self:flex-end;border-bottom-right-radius:4px}
.send{display:flex;gap:8px;margin-top:12px}.send input{margin:0}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--t);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}

/* Fitur & showcase */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bars.scroll{max-height:380px;overflow-y:auto;padding-right:6px}
.bar-r{display:grid;grid-template-columns:104px 1fr 42px;gap:10px;align-items:center;font-size:12.5px}
.bar-r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-r div{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar-r div i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--moss2),var(--moss));width:0;transition:width .9s var(--ease)}
.bar-r span:last-child{text-align:right;color:var(--mute)}
.cmdc{padding:12px 14px;border-radius:14px;cursor:pointer;font-size:13px;transition:background .2s,transform .22s var(--spring)}.cmdc:hover{background:var(--card2);transform:translateY(-2px)}.cmdc:active{transform:scale(.96)}
.cmdc b{font-family:ui-monospace,monospace;color:var(--gold);font-size:13px;word-break:break-all}.cmdc small{display:block;color:var(--mute);font-size:11.5px;line-height:1.4;margin-top:2px}
.cmdc .rl{margin-left:6px}
.cmdc small.al{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.75}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.pill{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;background:var(--card);border:1px solid var(--ln);color:var(--mute);transition:all .22s var(--spring)}.pill.on{background:var(--moss);color:#0d1f1b;border-color:var(--moss)}
.pill:hover{transform:translateY(-1px)}.pill:active{transform:scale(.95)}
.pill em{font-style:normal;opacity:.7;margin-left:4px;font-weight:500}

.shot{overflow:hidden;display:flex;flex-direction:column;transition:transform .28s var(--spring),border-color .25s ease}
.shot:hover{transform:translateY(-4px);border-color:rgba(244,213,141,.45)}.shot .cmd{cursor:copy}
.shot .im{position:relative;background:radial-gradient(circle at 50% 0,rgba(143,227,176,.1),rgba(0,0,0,.35));padding:12px;display:grid;place-items:center;cursor:zoom-in}
.shot img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block;border-radius:10px;transition:transform .38s var(--ease)}.shot:hover img{transform:scale(1.03)}
.shot .zoom{position:absolute;right:14px;bottom:14px;font-style:normal;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.65);opacity:0;transition:opacity .2s}.shot:hover .zoom{opacity:1}
@media(hover:none){.shot .zoom{opacity:1}}
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,15,11,.93);display:flex;opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}#lb.on{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:scale(.94);transition:transform .32s var(--ease)}#lb.on img{transform:none}#lb small{color:var(--mute)}
.shot .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.shot.more{align-items:center;justify-content:center;text-align:center;padding:30px;min-height:240px;gap:8px;cursor:default}
.shots{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

/* Promo */
.promo{position:relative;overflow:hidden;padding:28px 30px;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:linear-gradient(120deg,rgba(244,213,141,.2),rgba(143,227,176,.11) 55%,rgba(154,212,238,.09));border-color:rgba(244,213,141,.5)}
.promo::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:radial-gradient(circle,rgba(244,213,141,.25),transparent 70%)}
.promo .ribbon{position:absolute;top:14px;left:-34px;transform:rotate(-35deg);background:var(--gold);color:#3a2f0a;font:800 10px "Plus Jakarta Sans";letter-spacing:.18em;padding:4px 40px}
.promo .pd{position:absolute;font-style:normal;opacity:.5;pointer-events:none}.promo .p1{right:24%;top:10px;font-size:20px}.promo .p2{left:34%;bottom:8px;font-size:18px}.promo .p3{right:6px;bottom:12px;font-size:22px}
.pbadge{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#f2cf7e,#d9a93f);color:#3a2f0a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(217,169,63,.4),inset 0 0 0 5px rgba(255,255,255,.28);line-height:1.05;flex:none}
.pbadge b{font:700 32px "Bricolage Grotesque",sans-serif}.pbadge small{font-size:9px;font-weight:800;letter-spacing:.1em}
.pbody{position:relative;min-width:0}.pbody h2{margin:2px 0 6px;font-size:clamp(22px,3vw,30px)}
.pchips{margin-top:12px}.pchips .chip{color:var(--t)}.pchips .chip b{color:var(--gold)}
.pside{position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right}.pside small{color:var(--mute);font-size:12px;font-weight:600}
.cd{display:flex;gap:7px}.cdb{min-width:54px;padding:8px 6px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--ln);text-align:center}.cdb b{display:block;font:700 22px "Bricolage Grotesque",sans-serif;color:var(--gold);line-height:1.1}.cdb span{font-size:10px;color:var(--mute)}
@media(max-width:860px){.promo{grid-template-columns:1fr;padding:30px 22px 24px;gap:16px}.pbadge{width:92px;height:92px}.pbadge b{font-size:26px}.pside{align-items:flex-start;text-align:left}.pside .btn{width:100%}}

footer{position:relative;z-index:1;text-align:center;padding:30px 18px 100px;font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,18px);padding:11px 22px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s ease,transform .35s var(--spring);z-index:99;pointer-events:none;background:rgba(13,31,27,.96);border:1px solid rgba(143,227,176,.28);box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:761px){#toast{bottom:26px}footer{padding-bottom:50px}}

/* Scroll reveal */
.reveal{opacity:0;transform:translate3d(0,16px,0);transition:opacity .48s var(--ease),transform .48s var(--ease);backface-visibility:hidden}
.reveal.in{opacity:1;transform:translate3d(0,0,0)}
.reveal.d1{transition-delay:.05s}.reveal.d2{transition-delay:.1s}.reveal.d3{transition-delay:.15s}
.reveal.d4{transition-delay:.2s}.reveal.d5{transition-delay:.25s}

/* Hamburger & drawer */
.menu-toggle{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--ln);border-radius:50%;background:rgba(255,255,255,.055);cursor:pointer;position:relative;transition:background .22s,border-color .22s,transform .28s var(--spring)}
.menu-toggle:hover{background:rgba(143,227,176,.14);border-color:rgba(143,227,176,.4)}
.menu-toggle:active{transform:scale(.9)}
.menu-toggle span{position:absolute;width:16px;height:1.7px;border-radius:4px;background:var(--t);transition:transform .3s var(--ease),opacity .2s ease}
.menu-toggle span:nth-child(1){transform:translateY(-5px)}
.menu-toggle span:nth-child(2){transform:translateY(0)}
.menu-toggle span:nth-child(3){transform:translateY(5px)}
.menu-toggle.active span:nth-child(1){transform:rotate(45deg)}
.menu-toggle.active span:nth-child(2){opacity:0;transform:scaleX(.3)}
.menu-toggle.active span:nth-child(3){transform:rotate(-45deg)}

.drawer-backdrop{position:fixed;inset:0;z-index:80;background:rgba(2,10,7,.6);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
.drawer-backdrop.open{opacity:1;visibility:visible}
.forest-drawer{position:absolute;top:12px;right:12px;width:min(370px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:22px;border:1px solid rgba(183,220,157,.22);border-radius:26px;background:linear-gradient(155deg,rgba(19,49,35,.98),rgba(7,22,16,.99));box-shadow:0 28px 90px rgba(0,0,0,.52);transform:translate3d(16px,-8px,0) scale(.97);opacity:0;transition:transform .34s var(--ease),opacity .28s ease}
.drawer-backdrop.open .forest-drawer{transform:translate3d(0,0,0) scale(1);opacity:1}
.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.drawer-brand{display:flex;align-items:center;gap:10px;font:600 19px "Bricolage Grotesque",sans-serif}
.drawer-brand img{width:36px;height:36px;border-radius:12px;object-fit:cover;border:1px solid rgba(143,227,176,.35)}
.drawer-close{width:34px;height:34px;border:1px solid var(--ln);border-radius:50%;background:rgba(255,255,255,.05);color:var(--t);font-size:18px;cursor:pointer;transition:transform .22s var(--spring),background .2s}.drawer-close:hover{background:var(--card2)}.drawer-close:active{transform:scale(.88)}
.drawer-quote{padding:14px 16px;margin-bottom:16px;border-radius:17px;background:linear-gradient(120deg,rgba(143,227,176,.12),rgba(244,213,141,.07));border:1px solid rgba(143,227,176,.16);color:#dce9d2;font:italic 13.5px "Bricolage Grotesque",sans-serif;line-height:1.65}
.drawer-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:14px 2px 8px}
.drawer-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer-link{display:flex;align-items:center;gap:10px;min-height:50px;padding:10px 12px;border-radius:14px;border:1px solid var(--ln);background:rgba(255,255,255,.035);color:var(--t);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;transition:transform .22s var(--spring),background .2s,border-color .2s}
.drawer-link:hover{transform:translateY(-2px);background:rgba(143,227,176,.1);border-color:rgba(143,227,176,.28)}
.drawer-link:active{transform:scale(.96)}
.drawer-link b{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:rgba(143,227,176,.12);font-size:14px;flex:none}
.drawer-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--ln);font-size:11px;color:var(--mute);line-height:1.7}

::selection{background:rgba(143,227,176,.28);color:var(--t)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media(max-width:760px){
  .menu-toggle{width:36px;height:36px}
  .forest-drawer{top:8px;right:8px;max-height:calc(100dvh - 16px);padding:18px}
  .bar.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(13,31,27,.95)}
  header{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
  .bar{padding:6px 8px 6px 12px;gap:8px}
  .logo{font-size:17px}.logo .brand-badge{width:28px;height:28px;border-radius:9px}
  .stat-chip{font-size:10.5px;padding:4px 9px}
  nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;justify-content:space-around;padding:6px;border-radius:22px;background:rgba(13,31,27,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 10px 30px rgba(0,0,0,.48)}
  nav a{flex-direction:column;gap:2px;padding:6px 2px;font-size:9.5px;border-radius:14px;flex:1;justify-content:center}
  nav a i{font-size:18px}nav img.av{width:22px;height:22px}
  .mb{top:60px;padding:0 10px}.mb div{font-size:12.5px;padding:9px 14px}
  .wrap{padding:16px 12px 115px}
  .pad{padding:18px}.mt{margin-top:40px}
  .hero{padding:30px 18px 0;min-height:0;gap:10px}.hero-l{padding-bottom:100px}
  .hero::after{right:-90px;top:-70px}
  .hero svg.hills{height:90px}
  .grid,.shots{grid-template-columns:1fr}
  .cat{min-height:0}
  .bar-r{grid-template-columns:84px 1fr 34px}
  .chat{height:50vh}.cm .bx,.m{max-width:90%}
  .split2,.split{gap:14px}
  .promo{padding:34px 18px 20px}
  .reveal{transform:translate3d(0,12px,0);transition-duration:.4s}
  input,textarea,select{font-size:16px}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto!important}
  .ff,.leaf,.loader-orbit,.loader-core,.loader-firefly,.loader::before,.loader-track i,.stat-chip b{animation:none!important}
  .bub,.reveal{opacity:1!important;transform:none!important}
  #app.out{opacity:1!important;transform:none!important}
}

/* ===== upgrade UI ===== */
html{scroll-behavior:smooth}
.hr2{display:flex;align-items:center;gap:8px}
.clk{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;border:1px solid var(--ln);background:rgba(255,255,255,.03);font-size:12px;font-weight:600;color:var(--t);white-space:nowrap;font-variant-numeric:tabular-nums}
.lg{display:flex;padding:3px;border-radius:99px;border:1px solid var(--ln);background:rgba(255,255,255,.04);position:relative}
.lg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:linear-gradient(135deg,var(--moss),var(--moss2));transition:transform .45s var(--spring)}
.lg[data-l=en] i{transform:translateX(100%)}
.lg button{position:relative;z-index:1;border:0;background:none;color:var(--mute);font:700 11.5px "Plus Jakarta Sans";padding:5px 10px;border-radius:99px;cursor:pointer;transition:color .3s}
.lg button.on{color:#07241a}
@media(max-width:980px){.clk{display:none}}
.btn,.cat,.feat,.pkg,.shot,.pill,.chip,.drawer-link,.stat,.dv .row{-webkit-user-select:none;user-select:none}
.cat:active,.feat:active,.pkg:active,.shot:active,.pill:active,.drawer-link:active{transform:scale(.965)!important;transition-duration:.1s}
.btn,.pill{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.35);transform:scale(0);animation:rpl .6s var(--ease) forwards}
@keyframes rpl{to{transform:scale(1);opacity:0}}
.dash{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:18px}
.dv,.pf{padding:22px}
.dv .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dv .tm{font:600 clamp(42px,7vw,60px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--t)}
.dv .tm small{font:600 18px "Plus Jakarta Sans";color:var(--moss);margin-left:4px;letter-spacing:0}
.dv .dd{text-align:right;color:var(--mute);font-size:13px}.dv .dd b{display:block;color:var(--t);font-size:14px}
.dv .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.dv .row{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--ln);min-width:0}
.dv .row span{display:block;font-size:11px;color:var(--mute)}.dv .row b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--ln)}
.bt div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bt span{color:var(--mute)}
.bt .bar2{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bt .bar2 i{display:block;height:100%;width:0;border-radius:9px;background:var(--moss);transition:width 1s var(--ease),background .4s}
.pf .who{display:flex;align-items:center;gap:14px}

const sb=$("#scrollbar");
let scrollFrame=0,obs=null,resizeWatch=null;
function updateSB(){
 const root=document.scrollingElement||document.documentElement;

 document.querySelector("header")?.classList.toggle("scrolled",root.scrollTop>14);
}
function scheduleSB(){

}

}

function revealAll(){

function initReveal(){
 const items=document.querySelectorAll(".reveal:not(.in)");
 if(!items.length)return;
 if(!("IntersectionObserver" in window)){revealAll();return}
 if(!obs){
  obs=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
    if(entry.isIntersecting){
     entry.target.classList.add("in");
     obs.unobserve(entry.target);
    }
   });
  },{threshold:0.01,rootMargin:"0px 0px -6% 0px"});
 }
 items.forEach(el=>obs.observe(el));
}

function applyState(s){
 if(!s)return;if(s.now)SKEW=s.now-Date.now();SS={bot:s.bot,maint:s.maint,stats:s.stats||SS.stats};
 const c=$("#chip");c.className="stat-chip"+(SS.bot?"":" off");c.innerHTML=`<b></b><span>${SS.bot?"Bot online":"Bot offline"}</span>`;
 const mb=$("#mb");
 mb.innerHTML=SS.maint?`<div>🛠️ <b>${esc(SS.maint.title||"Maintenance")}</b> · ${esc(SS.maint.msg)}${SS.maint.eta?` · estimasi ${esc(SS.maint.eta)}`:""}</div>`:(!SS.bot?`<div class="red">🔴 Bot sedang offline. Pesanan baru bisa tertunda sampai bot tersambung lagi.</div>`:"")}

function toggleForestMenu(){
 const back=$("#drawerBackdrop"),btn=$("#menuToggle");
 if(!back||!btn)return;
 const open=!back.classList.contains("open");
 back.classList.toggle("open",open);btn.classList.toggle("active",open);
 btn.setAttribute("aria-expanded",String(open));
 document.body.style.overflow=open?"hidden":"";
}
function closeForestMenu(){
 const back=$("#drawerBackdrop"),btn=$("#menuToggle");
 back?.classList.remove("open");btn?.classList.remove("active");
 btn?.setAttribute("aria-expanded","false");document.body.style.overflow="";
}
function menuGo(route){

}

let SKEW=0;
const pad2=n=>String(n).padStart(2,"0");
function cdParts(ms){const s=Math.max(0,Math.floor(ms/1000));return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),x:s%60}}
function cdBoxes(ms){const{d,h,m,x}=cdParts(ms),B=(n,l)=>`<div class="cdb"><b>${pad2(n)}</b><span>${l}</span></div>`;return(d?B(d,"Hari"):"")+B(h,"Jam")+B(m,"Mnt")+B(x,"Dtk")}
function cdTxt(ms){const{d,h,m,x}=cdParts(ms);return d?`${d} hari ${h} jam`:`${h}j ${m}m ${x}d`}
function tick(){devTick();document.querySelectorAll("[data-until]").forEach(el=>{const ms=+el.dataset.until-(Date.now()+SKEW);if(ms<=0){el.textContent=el.dataset.t?"selesai":"Promo berakhir";if(!tick.rf||Date.now()-tick.rf>10000){tick.rf=Date.now();api("/api/catalog").then(j=>{CAT=j;applyState(j);if(/^#(home|katalog)?$/.test(location.hash))route()}).catch(()=>{})}}else el.innerHTML=el.dataset.t?cdTxt(ms):cdBoxes(ms)})}

async function pullChat(first){
 const c=$("#chat");if(!c||location.hash!=="#komunitas")return;
 let j;try{j=await api("/api/chat")}catch{return}
 const key=j.messages.length+":"+(j.messages.at(-1)?.id||"");if(key===CHK&&!first)return;CHK=key;
 const near=c.scrollHeight-c.scrollTop-c.clientHeight<140||first;
 c.innerHTML=j.messages.length?j.messages.map(m=>{const mine=ME&&m.uid===ME.id,u=mine?{...m,name:ME.name,av:ME.av,id:ME.id}:m,own=m.role==="owner"||(mine&&ME.role==="owner");return `<div class="cm ${mine?"mine":""}">${avatarTry({...u,id:m.uid||u.id},34)}<div class="bx"><div class="nm"><b style="color:var(--t)">${esc(u.name)}</b>${own?'<span class="rl">Owner</span>':""}<span>${hm(m.t)}</span>${ME?.role==="owner"?`<button class="x" onclick="delChat('${m.id}')">hapus</button>`:""}</div><div class="tx">${esc(m.text)}</div></div></div>`}).join(""):`<div class="center sub" style="margin:auto">Belum ada obrolan. Jadi yang pertama menyapa 🌿</div>`;
 if(near)c.scrollTop=c.scrollHeight}
async function sendChat(){
 const i=$("#ci"),t=i.value.trim();if(!t)return;i.value="";
 try{await api("/api/chat",{b:{text:t}});await pullChat(true)}catch(e){toast("⚠ "+e.message);i.value=t}}
async function delChat(id){try{await api("/api/owner/chat/"+id+"/delete",{b:{}});pullChat(true)}catch(e){toast("⚠ "+e.message)}}

/* Pesanan */
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};i.onerror=no;i.src=URL.createObjectURL(f)})}
function square(f,S=256){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=S;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,S,S);ok(c.toDataURL("image/jpeg",.86))};i.onerror=no;i.src=URL.createObjectURL(f)})}
function sum(o){return `<div class="kv"><span>ID</span><span style="font-family:monospace;font-size:12px">${o.id}</span></div><div class="kv"><span>Produk</span><span>${esc(o.product)}${o.qty>1?" × "+o.qty:""}</span></div><div class="kv"><span>WhatsApp</span><span>+${o.wa}</span></div><div class="kv"><span>Status</span><span><span class="badge s-${o.status}">${ST[o.status]}</span></span></div>${o.group?`<div class="kv"><span>Grup</span><span style="font-size:12px">${esc(o.group)}</span></div>`:""}${o.amEmail?`<div class="kv"><span>Email AM</span><span style="font-size:12px">${esc(o.amEmail)}</span></div>`:""}${o.sewaDone?`<div class="kv"><span>Sewa sampai</span><span>${o.lifetime?"Permanen":dt(o.expiredAt)}</span></div>`:""}<div class="kv"><span>Total</span><span style="color:var(--gold);font-size:19px">${rp(o.amount)}</span></div>`}

 if(o.cat!=="am"||!o.amStage)return"";

{c:"order",k:"cara order pesan beli memesan langkah mulai",q:"Bagaimana cara memesan dari awal sampai selesai?",a:`<p>Seluruh proses dilakukan di website ini, tanpa perlu chat panjang lebih dulu. Urutannya:</p><ol><li><b>Daftar atau masuk.</b> Isi nama, email, nomor WhatsApp aktif, dan password (minimal 6 karakter). Cukup sekali, semua pesananmu tersimpan di Profil.</li><li><b>Pilih layanan di Katalog.</b> Baca penjelasan tiap kartu, lalu pilih paket yang cocok.</li><li><b>Lengkapi data.</b> Nomor WhatsApp wajib benar karena dipakai untuk mengirim pesanan, akun, atau info login. Untuk sewa bot, link grup WhatsApp juga wajib. Kolom catatan boleh dikosongkan.</li><li><b>Tekan "Buat Pesanan & Bayar".</b> Kamu diarahkan ke halaman pesanan berisi QRIS dan total yang harus dibayar.</li><li><b>Scan QRIS dan bayar</b> sesuai nominal yang tertera.</li><li><b>Unggah bukti transfer</b> di halaman pesanan yang sama.</li><li><b>Tunggu owner memeriksa dan menekan ACC.</b> Halaman pesanan berubah menjadi Berhasil, dan kabarnya juga dikirim ke WhatsApp-mu.</li></ol><div class="tip">Simpan ID pesananmu (format TR…). ID ini dipakai kalau kamu perlu bertanya ke admin.</div>`},
{c:"order",k:"lama proses cepat acc menunggu nunggu berapa lama",q:"Berapa lama prosesnya?",a:`<p>Setelah bukti transfer terkirim, owner langsung menerima notifikasi di WhatsApp lengkap dengan fotonya, jadi biasanya prosesnya hitungan menit. Waktu bisa lebih lama kalau owner sedang tidak memegang ponsel, misalnya larut malam.</p><p>Setelah di-ACC, sebagian besar layanan berjalan otomatis: bot masuk ke grup, akun Alight Motion Seller dan Bulk langsung dikirim, dan akses Reseller diaktifkan. Untuk Panel dan Jasa, owner menghubungimu manual lewat WhatsApp sesudah ACC, jadi tunggu saja kabarnya tanpa perlu chat duluan.</p><p>Kamu tidak perlu menyegarkan halaman terus-menerus, status pesanan ikut berubah otomatis.</p>`},
{c:"order",k:"status pesanan belum bayar menunggu acc berhasil ditolak arti",q:"Apa arti setiap status pesanan?",a:`<ul><li><b>Belum bayar:</b> pesanan sudah dibuat tetapi bukti transfer belum diunggah.</li><li><b>Menunggu ACC:</b> bukti sudah sampai ke owner dan sedang diperiksa.</li><li><b>Berhasil:</b> pembayaran dikonfirmasi dan layanan sudah dijalankan.</li><li><b>Ditolak:</b> pesanan belum bisa diproses, misalnya nominal tidak sesuai atau bukti tidak jelas.</li></ul><p>Semua riwayat ada di menu Profil, lengkap dengan total dan tanggalnya.</p>`},
{c:"order",k:"batal salah pilih paket ganti ubah",q:"Saya salah pilih paket, apa yang harus dilakukan?",a:`<p>Kalau belum membayar, tinggalkan saja pesanan itu lalu buat pesanan baru dengan paket yang benar. Pesanan berstatus Belum bayar tidak diproses dan tidak ditagih.</p><p>Kalau sudah terlanjur membayar, jangan buat pesanan ganda. Hubungi WA Order dan sertakan ID pesanan serta paket yang kamu inginkan, lalu admin membantu mencari penyelesaiannya.</p>`},
{c:"pay",k:"bayar pembayaran qris transfer dana gopay ovo shopeepay metode nominal",q:"Pembayaran bisa lewat apa saja?",a:`<p>Pembayaran hanya lewat <b>QRIS</b>, jadi bisa memakai Dana, GoPay, OVO, ShopeePay, LinkAja, dan mobile banking apa pun yang mendukung QRIS.</p><ol><li>Buka halaman pesananmu, QRIS tampil di sana. Tombol unduh tersedia kalau kamu ingin membukanya dari galeri.</li><li>Scan, lalu masukkan nominal <b>persis sama dengan total pesanan</b>, termasuk diskon yang sedang berlaku.</li><li>Selesaikan pembayaran dan simpan tangkapan layar buktinya.</li></ol><div class="tip">Nominal kurang atau lebih bisa membuat pesanan ditolak. Periksa total sekali lagi sebelum menekan bayar.</div>`},
{c:"pay",k:"bukti transfer unggah upload kirim foto gambar ganda",q:"Bagaimana cara mengirim bukti transfer, dan bukti seperti apa yang diterima?",a:`<p>Di halaman pesanan, pilih foto bukti pada bagian "Kirim Bukti", lalu tekan tombol kirim. Format yang diterima adalah JPG, PNG, atau WebP. Foto besar otomatis diperkecil di browser, jadi aman dipakai dari kamera ponsel.</p><ul><li>Pastikan nominal, tanggal, jam, dan status berhasil terlihat jelas.</li><li>Satu bukti hanya berlaku untuk satu pesanan. Sistem otomatis menolak bukti yang pernah dipakai di pesanan lain, walaupun sudah diganti nama atau dikompres ulang.</li><li>Bukti hanya bisa dikirim saat bot tersambung. Kalau muncul "Bot belum tersambung", tunggu sebentar lalu coba lagi.</li></ul>`},
{c:"pay",k:"ditolak tolak ditolak bukti gagal rejected",q:"Pesanan atau bukti saya ditolak, bagaimana?",a:`<p>Kamu menerima pesan WhatsApp berisi ID pesanan dan tombol langsung ke admin. Penyebab paling umum: nominal tidak sama dengan total, bukti kabur atau terpotong, atau bukti yang sama sudah dipakai di pesanan lain.</p><ol><li>Periksa total di halaman pesanan dan bandingkan dengan bukti.</li><li>Kalau memang ada yang kurang, kirim bukti yang benar atau lengkap sesuai petunjuk di halaman pesanan.</li><li>Kalau yakin sudah benar, hubungi WA Order dengan ID pesanan dan bukti aslinya agar diperiksa manual.</li></ol>`},
{c:"bot",k:"sewa bot grup link apa dapat fitur whatsapp",q:"Apa itu sewa bot dan apa yang saya dapat?",a:`<p>Kamu menyewa bot WhatsApp Totoro AI untuk satu grup. Bot punya <b>1300+ fitur</b>: AI, downloader (TikTok, YouTube, Instagram, dll.), pembuat stiker, game, alat edit gambar dan video, serta fitur Alight Motion. Tidak perlu hosting atau instalasi sendiri.</p><p>Pilihan paketnya:</p>${pl("bot")}<p>Ketik <b>.menu</b> di grup untuk melihat seluruh fitur.</p>`},
