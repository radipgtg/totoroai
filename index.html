<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Totoro AI - Sewa Bot WhatsApp, Panel, Jasa Digital, Alight Motion Premium</title>
<meta name="description" content="Totoro AI menjual sewa bot WhatsApp, panel hosting, jasa digital, dan Alight Motion premium. Pilih di katalog, bayar lewat QRIS, owner memproses pesananmu.">
<link rel="icon" href="https://api.totoroai.my.id/api/img/logo">
<link rel="apple-touch-icon" href="https://api.totoroai.my.id/api/img/logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOTORO AI — Clean Editorial Design System (Light & Dark, Mobile-First)
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF7F0;
  --surf:#FFFFFF;
  --surf2:#F3EFE4;
  --wash:#EFE9DC;
  --inset:#F7F4EC;
  --ln:#E2DACB;
  --dash:#D0C6B2;
  --t:#192E22;
  --mute:#5A6D60;
  --moss:#23583B;
  --moss2:#19422B;
  --moss-soft:#E4EFE6;
  --moss-ln:#C2D8C7;
  --gold:#A86A2E;
  --gold-soft:#F7EBDD;
  --rose:#B93B2F;
  --rose-soft:#FCECEB;
  --on:#FAF7F0;
  --me:#E2EFE5;
  --bot:#FFFFFF;
  --hbg:rgba(250,247,240,.92);
  --sh:0 1px 2px rgba(25,46,34,.04),0 8px 24px -12px rgba(25,46,34,.10);
  --sh-md:0 2px 6px rgba(25,46,34,.05),0 14px 32px -14px rgba(25,46,34,.14);
  --r:16px;
  --r-sm:12px;
  --r-lg:22px;
  --ease:cubic-bezier(.22,1,.36,1);
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1713;
  --surf:#16211B;
  --surf2:#1C2A22;
  --wash:#203027;
  --inset:#111B15;
  --ln:#2B3C32;
  --dash:#384D40;
  --t:#EDE8DC;
  --mute:#98A89C;
  --moss:#7CC499;
  --moss2:#93D5AD;
  --moss-soft:#1D3326;
  --moss-ln:#2F4F3C;
  --gold:#DDA36C;
  --gold-soft:#31251A;
  --rose:#E5867B;
  --rose-soft:#341D1B;
  --on:#0E1A13;
  --me:#213C2D;
  --bot:#1C2A22;
  --hbg:rgba(15,23,19,.92);
  --sh:0 1px 2px rgba(0,0,0,.25),0 10px 26px -14px rgba(0,0,0,.55);
  --sh-md:0 4px 12px rgba(0,0,0,.35),0 18px 36px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:var(--t);
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4,.serif{
  font-family:var(--serif);
  font-weight:600;
  letter-spacing:-.02em;
  color:var(--t);
}
h2{font-size:clamp(24px,3.4vw,34px);line-height:1.15;margin-bottom:6px}
h3{font-size:clamp(17px,2vw,20px);line-height:1.25}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit;touch-action:manipulation}
img{max-width:100%;display:block}
p{overflow-wrap:anywhere}
::selection{background:var(--moss-soft);color:var(--t)}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}

.ico{display:inline-block;vertical-align:-.18em;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:14px;line-height:1.7}
.center{text-align:center}
.mt{margin-top:clamp(40px,6vw,64px)}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--moss);margin-bottom:10px;
}
.eyebrow::before{content:"";width:16px;height:1.5px;background:var(--moss);border-radius:2px}

/* Scroll Progress */
#scrollbar{
  position:fixed;top:0;left:0;width:100%;height:2.5px;z-index:100;
  transform:scaleX(var(--scroll-progress,0));transform-origin:left center;
  background:var(--moss);pointer-events:none;transition:transform .06s linear;
}

/* Header */
header{
  position:sticky;top:0;z-index:40;
  background:var(--hbg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--ln);
  padding-top:env(safe-area-inset-top);
  transition:box-shadow .25s var(--ease);
}
header.scrolled{box-shadow:0 6px 20px -12px rgba(25,46,34,.18)}
.bar{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;
}
.logo{
  display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;
}
.logo .brand-badge{
  width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none;
  border:1px solid var(--ln);background:var(--surf2);
}
.logo .brand-badge img{width:100%;height:100%;object-fit:cover}
.logo .lt{font:700 18px/1.1 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.logo .lt small{display:block;font:500 10.5px var(--sans);color:var(--mute);letter-spacing:.02em;margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px;flex:none}
.tt-nav{display:none;align-items:center;gap:2px;margin-right:6px}
.tt-nav a{
  padding:7px 12px;border-radius:9px;font:600 13.5px var(--sans);
  color:var(--mute);cursor:pointer;transition:color .2s,background .2s;
}
.tt-nav a:hover{color:var(--t);background:var(--surf2)}
@media(min-width:960px){.tt-nav{display:flex}}

.clk{
  display:none;align-items:center;gap:6px;padding:6px 10px;
  border-radius:9px;border:1px solid var(--ln);background:var(--surf);
  font:500 12px var(--mono);color:var(--t);white-space:nowrap;
}
.clk .cd{width:6px;height:6px;border-radius:50%;background:var(--moss)}
.clk small{color:var(--mute);margin-left:-4px}
.clk em{font-style:normal;font-size:10px;color:var(--mute);padding-left:2px}
@media(min-width:1060px){.clk{display:inline-flex}}

.stat-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:99px;
  border:1px solid var(--ln);background:var(--surf);
  font:600 11.5px var(--sans);color:var(--mute);white-space:nowrap;
}
.stat-chip b{width:7px;height:7px;border-radius:50%;background:#2E8B57;flex:none}
.stat-chip.off b{background:var(--rose)}

.tbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);
  background:var(--surf);color:var(--t);cursor:pointer;position:relative;
  display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s;
}
.tbtn:hover{background:var(--surf2);border-color:var(--dash)}
.tbtn svg{position:absolute;width:17px;height:17px;transition:transform .35s var(--ease),opacity .25s}
.tbtn .sun{transform:rotate(0) scale(1);opacity:1;color:var(--gold)}
.tbtn .moon{transform:rotate(-60deg) scale(.4);opacity:0;color:var(--moss)}
:root[data-theme="dark"] .tbtn .sun{transform:rotate(60deg) scale(.4);opacity:0}
:root[data-theme="dark"] .tbtn .moon{transform:rotate(0) scale(1);opacity:1}

.lg{
  display:inline-flex;padding:3px;border-radius:10px;
  border:1px solid var(--ln);background:var(--surf);
}
.lg i{display:none}
.lg button{
  border:0;background:none;color:var(--mute);
  font:700 11px var(--sans);padding:5px 8px;border-radius:7px;cursor:pointer;
  transition:background .2s,color .2s;
}
.lg button.on{background:var(--moss);color:var(--on)}

.menu-toggle{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);
  background:var(--surf);cursor:pointer;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5px;
  transition:background .2s,border-color .2s;
}
.menu-toggle:hover{background:var(--surf2);border-color:var(--dash)}
.menu-toggle span{
  display:block;width:16px;height:1.6px;border-radius:2px;background:var(--t);
  transition:transform .28s var(--ease),opacity .2s;
}
.menu-toggle.active{background:var(--moss);border-color:var(--moss)}
.menu-toggle.active span{background:var(--on)}
.menu-toggle.active span:nth-child(1){transform:translateY(6.1px) rotate(45deg)}
.menu-toggle.active span:nth-child(2){opacity:0}
.menu-toggle.active span:nth-child(3){transform:translateY(-6.1px) rotate(-45deg)}

/* Maintenance Banner */
.mb{max-width:1180px;margin:10px auto 0;padding:0 16px}
.mb div{
  padding:11px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;
  background:var(--gold-soft);border:1px solid rgba(168,106,46,.3);color:var(--t);
}
.mb div.red{background:var(--rose-soft);border-color:rgba(185,59,47,.35);color:var(--rose)}

/* Main Wrapper */
.wrap{
  max-width:1180px;margin:0 auto;
  padding:clamp(20px,3.2vw,36px) 16px 88px;
  min-height:72vh;
}
.view{animation:rise .36s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.out{opacity:0;transform:translateY(-6px);transition:opacity .15s ease,transform .15s ease}

/* Surfaces */
.glass,.pr-card,.kt-card,.kp-card,.cx-side,.cx-win,.nt,.ord-card,.pbox,.rc,.pr-hero,.about3>div,.lv,.pm,.dc,.bc{
  background:var(--surf);
  border:1px solid var(--ln);
  border-radius:var(--r);
  box-shadow:var(--sh);
}
.pad{padding:clamp(18px,2.8vw,28px)}
.glass .glass{box-shadow:none}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--moss);cursor:pointer;
  font:600 14px var(--sans);padding:11px 20px;border-radius:var(--r-sm);
  background:var(--moss);color:var(--on);
  transition:background .2s,border-color .2s,transform .18s var(--ease);
}
.btn:hover{background:var(--moss2);border-color:var(--moss2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surf);color:var(--t);border:1px solid var(--ln)}
.btn.ghost:hover{background:var(--surf2);border-color:var(--dash)}
.btn.red{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.red:hover{filter:brightness(.94)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.full{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.acts.c{justify-content:center}
.back{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;
  padding:8px 14px;border-radius:10px;border:1px solid var(--ln);
  background:var(--surf);color:var(--t);font:600 13px var(--sans);
  cursor:pointer;transition:background .2s,border-color .2s;
}
.back:hover{background:var(--surf2);border-color:var(--dash)}

/* Forms */
label{display:block;font:600 13px var(--sans);color:var(--t);margin:16px 0 6px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{
  width:100%;padding:11px 14px;border-radius:var(--r-sm);
  border:1px solid var(--ln);background:var(--inset);color:var(--t);
  font-size:15px;outline:none;min-height:44px;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
textarea{resize:vertical;min-height:90px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.72}
input:focus,textarea:focus,select:focus{
  border-color:var(--moss);background:var(--surf);
  box-shadow:0 0 0 3px rgba(35,88,59,.12);
}
:root[data-theme="dark"] input:focus,:root[data-theme="dark"] textarea:focus,:root[data-theme="dark"] select:focus{
  box-shadow:0 0 0 3px rgba(124,196,153,.16);
}
.pw{position:relative}
.pw input{padding-right:46px!important}
.eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;background:none;color:var(--mute);
  display:grid;place-items:center;cursor:pointer;border-radius:8px;
}
.eye:hover{background:var(--surf2);color:var(--t)}

/* Status Badges & Notes */
.badge{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;
  font:700 11.5px var(--sans);white-space:nowrap;
}
.s-awaiting{background:var(--surf2);color:var(--mute);border:1px solid var(--ln)}
.s-verifying{background:var(--gold-soft);color:var(--gold)}
.s-success{background:var(--moss-soft);color:var(--moss)}
.s-rejected{background:var(--rose-soft);color:var(--rose)}

.note{
  background:var(--gold-soft);border:1px solid rgba(168,106,46,.22);
  border-left:3px solid var(--gold);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:13px 16px;font-size:13.5px;line-height:1.65;color:var(--t);margin-top:16px;
}
.kv{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px;
}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute);font-size:13px}
.kv span:last-child{text-align:right;font-weight:600;word-break:break-word}

/* Drawer Menu */
.dwb{
  position:fixed;inset:0;z-index:90;background:rgba(15,23,19,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .28s var(--ease),visibility .28s;
}
.dwb.open{opacity:1;visibility:visible;pointer-events:auto}
.dw{
  position:absolute;top:0;right:0;bottom:0;width:min(360px,88vw);
  background:var(--bg);border-left:1px solid var(--ln);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .34s var(--ease);
  padding-top:env(safe-area-inset-top);
}
.dwb.open .dw{transform:none}
.dw-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--ln);background:var(--surf);
}
.dw-brand{display:flex;align-items:center;gap:10px}
.dw-brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;border:1px solid var(--ln)}
.dw-brand b{font:700 17px/1.1 var(--serif);display:block}
.dw-brand small{font-size:11.5px;color:var(--mute)}
.dw-x{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);
  background:var(--surf2);color:var(--t);display:grid;place-items:center;cursor:pointer;
}
.dw-x:hover{background:var(--wash)}
.dw-scroll{flex:1;overflow-y:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.dw-user{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;
  background:var(--surf);border:1px solid var(--ln);cursor:pointer;margin-bottom:10px;
  transition:border-color .2s;
}
.dw-user:hover{border-color:var(--moss)}
.dw-user .du-av{
  width:40px;height:40px;border-radius:50%;background:var(--moss-soft);
  border:1px solid var(--moss-ln);display:grid;place-items:center;
  font:700 16px var(--serif);color:var(--moss);overflow:hidden;position:relative;flex:none;
}
.dw-user .du-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dw-user b{display:block;font-size:14px}
.dw-user small{font-size:12px;color:var(--mute)}
.dw-user .ico{margin-left:auto;color:var(--mute)}
.dw-l{
  margin:16px 6px 6px;font:700 11px var(--sans);letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);
}
.dw-link{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;
  border:0;background:none;border-radius:11px;text-align:left;cursor:pointer;
  color:var(--t);transition:background .18s;
}
.dw-link[hidden]{display:none}
.dw-ic{
  width:32px;height:32px;border-radius:9px;background:var(--surf2);color:var(--moss);
  display:grid;place-items:center;flex:none;transition:background .18s,color .18s;
}
.dw-link:hover,.dw-link.cur{background:var(--surf)}
.dw-link:hover .dw-ic,.dw-link.cur .dw-ic{background:var(--moss);color:var(--on)}
.dw-link .tx{min-width:0}
.dw-link em{font-style:normal;font-weight:600;font-size:13.5px;display:block;line-height:1.25}
.dw-link small{font-size:11.5px;color:var(--mute);display:block;line-height:1.3}
.dw-quote{
  margin:18px 4px 0;padding:12px 14px;border-radius:12px;
  background:var(--surf2);border:1px solid var(--ln);
  font-size:12.5px;line-height:1.6;color:var(--mute);
}
.dw-foot{margin:14px 6px 0;font-size:11.5px;color:var(--mute);line-height:1.6}

/* Loader */
.loader.ldx{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;min-height:240px;padding:32px 16px;text-align:center;
}
.ldx-ring{position:relative;width:88px;height:88px;display:grid;place-items:center}
.ldx-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ldx-ring circle{fill:none;stroke-width:3}
.ldx-ring .t{stroke:var(--ln)}
.ldx-ring .v{stroke:var(--moss);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .25s linear}
.ldx-ring img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--surf)}
.ldx-num{font:700 22px var(--serif);color:var(--t);line-height:1}
.ldx-num small{font-size:13px;color:var(--mute);margin-left:2px}
.loader-txt{font:600 15px var(--serif);color:var(--t)}
.loader-sub{font-size:12.5px;color:var(--mute);max-width:280px}
.loader-track{width:min(200px,68vw);height:4px;border-radius:4px;background:var(--ln);overflow:hidden}
.loader-track .ld-bar{display:block;height:100%;width:1%;background:var(--moss);transition:width .25s linear}

/* Promo Ticket Banner */
.dc{margin:0 0 28px;overflow:hidden}
.dc-ticker{
  overflow:hidden;white-space:nowrap;background:var(--moss);color:var(--on);
  padding:7px 0;font:700 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
}
.dc-run{display:inline-flex;gap:24px;animation:dcRun 38s linear infinite}
@keyframes dcRun{to{transform:translateX(-50%)}}
.dc-body{
  display:grid;grid-template-columns:160px minmax(0,1fr) auto;
  gap:22px;align-items:center;padding:22px 24px;
}
.dc-pct{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 12px;border-radius:14px;background:var(--moss-soft);color:var(--moss);text-align:center;
}
.dc-pct small{font:700 10.5px var(--sans);letter-spacing:.16em}
.dc-pct b{font:700 50px/1 var(--serif);color:var(--moss)}
.dc-pct sup{font-size:.45em;vertical-align:top}
.dc-info{min-width:0}
.dc-tag{
  display:inline-block;padding:3px 10px;border-radius:99px;
  background:var(--gold-soft);color:var(--gold);font:700 11px var(--sans);margin-bottom:6px;
}
.dc-info h2{font-size:clamp(20px,2.8vw,28px);margin-bottom:4px}
.dc-list{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dc-list li{
  display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--ln);font-size:12.5px;
}
.dc-list em{font-style:normal;font-weight:600}
.dc-list b{color:var(--moss);font-family:var(--mono)}
.dc-cta{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:190px}
.dc-cta small{font-size:11.5px;font-weight:600;color:var(--mute)}
.cd{display:flex;gap:6px}
.cdb{
  min-width:48px;padding:6px 6px;border-radius:10px;
  background:var(--surf2);border:1px solid var(--ln);text-align:center;
}
.cdb b{display:block;font:600 18px/1.1 var(--mono);color:var(--t)}
.cdb span{font-size:10px;color:var(--mute)}
@media(max-width:860px){
  .dc-body{grid-template-columns:1fr;gap:16px;padding:18px}
  .dc-pct{flex-direction:row;gap:10px;padding:12px 16px}
  .dc-pct b{font-size:36px}
  .dc-cta{align-items:stretch;min-width:0}
  .dc-cta .cd{justify-content:flex-start}
}

/* Home Hero */
.hero2{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);
  gap:clamp(24px,4vw,48px);align-items:center;padding:12px 0 8px;
}
.hero2 h1{font-size:clamp(30px,4.6vw,50px);line-height:1.1;margin:8px 0 16px}
.hero2 h1 em{
  font-style:normal;color:var(--moss);
  text-decoration:underline;text-decoration-color:rgba(168,106,46,.45);
  text-decoration-thickness:3px;text-underline-offset:5px;
}
.hero2 .lead{font-size:15.5px;line-height:1.75;color:var(--mute);max-width:54ch}
.hchips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hchips li{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
  background:var(--surf);border:1px solid var(--ln);font-size:12.5px;font-weight:600;
}
.hchips li .ico{color:var(--moss)}
.hnote{margin-top:12px;font-size:12.5px;color:var(--mute)}
.whisper{
  margin-top:14px;padding:10px 14px;border-left:3px solid var(--gold);
  background:var(--surf2);border-radius:0 10px 10px 0;
  font-size:13px;color:var(--mute);transition:opacity .4s;
}
.whisper.f{opacity:0}

/* Live Clock Card */
.lvs{display:grid;gap:12px}
.lv{padding:20px}
.gh{font-size:13px;font-weight:600;color:var(--moss);margin-bottom:12px}
.ck{display:flex;align-items:center;gap:16px}
.face{width:84px;height:84px;flex:none}
.face circle.r{fill:var(--surf2);stroke:var(--ln);stroke-width:1.5}
.face .tk{stroke:var(--mute);stroke-width:1.2;opacity:.5}
.face .tk.m{stroke:var(--moss);stroke-width:2;opacity:1}
.hand{transform-origin:60px 60px;transform-box:view-box}
.face #hS{stroke:var(--rose)}
.tm2{font:600 36px/1 var(--mono);letter-spacing:-.03em}
.tm2 small{font-size:15px;color:var(--moss);margin-left:3px}
.dd2{margin-top:6px;font-size:12.5px;color:var(--mute)}
.dd2 b{display:block;color:var(--t);font-size:13.5px}
.rows2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rows2 div{padding:8px 10px;border-radius:10px;background:var(--surf2);border:1px solid var(--ln);min-width:0}
.rows2 span{display:block;font-size:10.5px;color:var(--mute)}
.rows2 b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt2{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surf2);border:1px solid var(--ln)}
.bt2 div{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.bt2 span{color:var(--mute)}
.bt2 .br{height:6px;border-radius:6px;background:var(--ln);overflow:hidden}
.bt2 .br i{display:block;height:100%;width:0;border-radius:6px;background:var(--moss);transition:width .8s var(--ease)}
.pm{display:flex;align-items:center;gap:12px;padding:14px 16px}
.pm h3{font-size:15.5px;margin-bottom:1px}
.pm p{font-size:12.5px;color:var(--mute)}
.pm .btn{margin-left:auto;white-space:nowrap}

/* Service Trail Carousel */
.tt-car{margin-top:36px}
.tt-car h2{margin-bottom:4px}
.tt-sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.tt-trk{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);
  gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:10px;scrollbar-width:none;
}
.tt-trk::-webkit-scrollbar{display:none}
.tt-cc{
  scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;
  padding:20px;border-radius:var(--r);background:var(--surf);border:1px solid var(--ln);
  box-shadow:var(--sh);cursor:pointer;position:relative;
  transition:border-color .2s,transform .2s var(--ease);
}
.tt-cc:hover{border-color:var(--moss);transform:translateY(-2px)}
.tt-ci{
  width:46px;height:46px;border-radius:12px;background:var(--moss-soft);color:var(--moss);
  display:grid;place-items:center;overflow:hidden;
}
.tt-ci img{width:100%;height:100%;object-fit:cover}
.tt-cc h3{font-size:18px;margin-top:4px}
.tt-cc p{font-size:13px;color:var(--mute);line-height:1.55;flex:1}
.tt-cc b{font:600 13.5px var(--mono);color:var(--moss);margin-top:6px}
.tt-cc i{
  position:absolute;right:16px;bottom:16px;width:28px;height:28px;
  border-radius:50%;background:var(--surf2);color:var(--t);
  display:grid;place-items:center;font-style:normal;
}
.tt-ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.tt-ctl button{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);
  background:var(--surf);color:var(--t);display:grid;place-items:center;cursor:pointer;
}
.tt-dots{display:flex;gap:6px}
.tt-dots u{width:7px;height:7px;border-radius:99px;background:var(--ln);transition:width .25s,background .25s}
.tt-dots u.on{width:20px;background:var(--moss)}

/* About & Bento & Stats */
.about{margin-top:56px}
.about3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0 32px}
.about3>div{padding:22px}
.about3 h3{margin-bottom:6px}
.about3 p,.about2 p{font-size:14px;color:var(--mute);line-height:1.7}
.about2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:40px}
.bc{padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bc h4{font:600 13px var(--sans);color:var(--mute)}
.bc small{font-size:12.5px;color:var(--mute)}
.bc .big{font:700 clamp(24px,3.2vw,32px)/1.1 var(--serif)}
.b-st{grid-column:span 6;grid-row:span 2}
.b-ring{grid-column:span 3}
.b-w{grid-column:span 4}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2E8B57;margin-right:8px}
.sd.off{background:var(--rose)}
.sp{width:100%;height:50px;margin-top:auto}
.sp polyline{fill:none;stroke:var(--moss);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rg{display:flex;align-items:center;gap:12px}
.rg svg{width:72px;height:72px;flex:none;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:7}
.rg .t{stroke:var(--surf2)}
.rg .v{stroke:var(--moss);stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset 1s var(--ease)}
.rg.d .v{stroke:var(--gold)}
.rg.h .v{stroke:var(--rose)}
.note0{font-size:12px;color:var(--mute);margin-top:10px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.stat{padding:18px 20px}
.stat b{display:block;font:700 28px/1.1 var(--serif);color:var(--moss);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.stat.sm b{font-size:22px}

/* Claim CTA */
.claim-cta{
  margin-top:36px;border-radius:var(--r-lg);border:1px solid var(--moss-ln);
  background:var(--moss-soft);overflow:hidden;
}
.claim-cta-inner{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:24px 28px;flex-wrap:wrap;
}
.claim-cta-emoji{display:none}
.claim-cta-text{flex:1 1 280px;min-width:0}
.claim-cta-eyebrow{font:700 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--moss)}
.claim-cta-text h2{margin:4px 0 6px}
.claim-cta-text p{font-size:14px;color:var(--mute);max-width:52ch}
.claim-cta-btn{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  padding:12px 24px;border:0;border-radius:var(--r-sm);background:var(--moss);color:var(--on);
  font:700 14.5px var(--sans);cursor:pointer;
}
.claim-cta-btn small{font-size:11px;font-weight:500;opacity:.85}

/* Demo & Top Commands */
.demo2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:center;margin-top:52px}
.phone{
  border-radius:26px;background:var(--surf);border:1px solid var(--ln);
  box-shadow:var(--sh-md);overflow:hidden;
}
.ph-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--moss-soft);border-bottom:1px solid var(--ln)}
.ph-top img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ph-top b{font-size:13.5px;display:block;line-height:1.2}
.ph-top small{font-size:11px;color:var(--moss);font-weight:600}
.ph-body{padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--inset)}
.bub{max-width:86%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--ln);border-bottom-left-radius:4px}
.bub .nm{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--moss);margin-bottom:2px}
.bub code{font-family:var(--mono);font-size:11.5px;color:var(--moss)}

.top10{display:grid;gap:8px;margin-top:16px}
.tc{
  display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px 12px;
  padding:11px 14px;border-radius:var(--r-sm);background:var(--surf);border:1px solid var(--ln);
  cursor:pointer;transition:border-color .2s;
}
.tc:hover{border-color:var(--moss)}
.tc .rk{font:700 15px var(--serif);color:var(--moss);text-align:center}
.tc code{font:600 13px var(--mono)}
.tc small{display:block;color:var(--mute);font-size:12px}
.tc .nb{font:600 13px var(--mono);color:var(--gold)}
.tc .ln{grid-column:2/4;height:4px;border-radius:4px;background:var(--surf2);overflow:hidden}
.tc .ln i{display:block;height:100%;width:var(--w,0);background:var(--moss)}
.tc .who{display:flex;align-items:center;gap:10px;min-width:0}

/* Usage Section */
.usg{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}
.usg-hero{grid-column:span 6;grid-row:span 2;padding:24px}
.usg-big{font:700 clamp(36px,6vw,58px)/1 var(--serif);color:var(--moss);margin:10px 0}
.usg-big small{font-size:.42em;color:var(--mute);margin-left:4px}
.usg-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.usg-meta div{padding:10px;border-radius:10px;background:var(--surf2);border:1px solid var(--ln)}
.usg-meta b{display:block;font:700 18px var(--mono)}
.usg-meta span{font-size:11.5px;color:var(--mute)}
.usg-p{position:relative;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.usg-p1{grid-column:span 6}
.usg-p2,.usg-p3{grid-column:span 3}
.usg-p code{font:600 15px var(--mono)}
.usg-p b{font:700 20px var(--serif);color:var(--gold)}
.usg-rk{position:absolute;right:14px;top:12px;font-size:18px}
.ub{height:4px;border-radius:4px;background:var(--surf2);overflow:hidden;margin-top:6px}
.ub i{display:block;height:100%;background:var(--moss)}
.usg-list{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.usg-i{padding:11px 14px;cursor:pointer;border-radius:12px}
.usg-i div{display:flex;justify-content:space-between;font-size:13px}
.usg-i code{font-family:var(--mono);font-weight:600}
.usg-i span{color:var(--gold);font-weight:600;font-family:var(--mono)}

/* Showcase & Flow & FAQ & End CTA */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.shot{overflow:hidden;display:flex;flex-direction:column;border-radius:var(--r)}
.shot .im{position:relative;background:var(--surf2);padding:12px;cursor:zoom-in}
.shot img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin:0 auto}
.shot .zoom{position:absolute;right:14px;bottom:14px;font-style:normal;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(15,23,19,.72);color:#fff}
.shot .bd{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.cmd{display:inline-block;font:600 12px var(--mono);color:var(--moss);background:var(--moss-soft);padding:3px 9px;border-radius:6px;width:fit-content;cursor:pointer}
.shot.more{align-items:center;justify-content:center;text-align:center;padding:28px;min-height:200px}

#lb{
  position:fixed;inset:0;z-index:95;background:rgba(10,16,12,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;cursor:zoom-out;
}
#lb.on{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px}
#lb small,#lb b{color:#EDE8DC}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;list-style:none;margin-top:22px;counter-reset:fl}
.flow li{padding:20px;border-radius:var(--r);background:var(--surf);border:1px solid var(--ln);box-shadow:var(--sh)}
.flow li::before{
  counter-increment:fl;content:counter(fl);
  width:28px;height:28px;border-radius:50%;background:var(--moss);color:var(--on);
  display:grid;place-items:center;font:700 13px var(--serif);margin-bottom:10px;
}
.flow h3{font-size:17px;margin-bottom:4px}
.flow p{font-size:13.5px;color:var(--mute);line-height:1.6}

.fnotes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.fnote{padding:18px 20px;border-radius:var(--r);background:var(--surf);border:1px solid var(--ln)}
.fnote h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fnote h3 .ico{color:var(--moss)}
.fnote p{font-size:13px;color:var(--mute)}

/* FAQ */
.faq{max-width:860px;margin:56px auto 0}
.faq .fh{text-align:center;margin-bottom:20px}
.faq .fh .sub{max-width:520px;margin:0 auto}
.faq #faqS{margin-bottom:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.pill{
  padding:7px 14px;border-radius:99px;font:600 12.5px var(--sans);
  cursor:pointer;background:var(--surf);border:1px solid var(--ln);color:var(--mute);
  transition:background .2s,color .2s,border-color .2s;
}
.pill:hover{border-color:var(--dash);color:var(--t)}
.pill.on{background:var(--moss);color:var(--on);border-color:var(--moss)}
#faqL{display:grid;gap:10px;margin-top:14px}
.faqi{border-radius:var(--r-sm);background:var(--surf);border:1px solid var(--ln);overflow:hidden}
.faqi summary{
  display:flex;align-items:center;gap:12px;padding:15px 18px;
  cursor:pointer;list-style:none;font:600 14.5px var(--sans);line-height:1.45;
}
.faqi summary::-webkit-details-marker{display:none}
.faqi summary::after{content:"+";margin-left:auto;color:var(--moss);font-size:19px;font-weight:500;transition:transform .2s}
.faqi[open] summary::after{transform:rotate(45deg)}
.faqi[open]{border-color:var(--moss)}
.fqn{
  flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font:700 12px var(--mono);background:var(--moss-soft);color:var(--moss);
}
.fqa{padding:0 18px 18px 56px;color:var(--mute);font-size:14px;line-height:1.75}
.fqa p{margin-bottom:10px}.fqa ul,.fqa ol{margin:8px 0 10px 20px}.fqa li{margin:4px 0}
.fqa .tip{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--gold-soft);color:var(--t);font-size:13px}
.faqcta{padding:26px 22px;margin-top:24px;text-align:center}

.endcta{
  margin-top:52px;padding:34px 24px;text-align:center;border-radius:var(--r-lg);
  background:var(--moss-soft);border:1px solid var(--moss-ln);
}
.endcta p{max-width:52ch;margin:6px auto 0;color:var(--mute);font-size:14.5px}

/* Footer */
footer.f2{
  border-top:1px solid var(--ln);background:var(--surf);
  padding:40px 16px calc(28px + env(safe-area-inset-bottom));font-size:13.5px;
}
.f2 .in2{max-width:1180px;margin:0 auto}
.f2 .cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:28px}
.f2 h4{font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.f2 p{color:var(--mute);max-width:300px;margin-top:10px;line-height:1.65}
.f2 ul{list-style:none;display:grid;gap:8px}
.f2 a{color:var(--mute);cursor:pointer;transition:color .2s}
.f2 a:hover{color:var(--moss)}
.f2 .bot{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  margin-top:28px;padding-top:18px;border-top:1px solid var(--ln);font-size:12.5px;color:var(--mute);
}
.f2 .up{padding:7px 14px;border:1px solid var(--ln);border-radius:9px;background:var(--surf2);font-weight:600;color:var(--t)}
.soc{display:flex;gap:8px;margin-top:14px}
.soc a{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:var(--surf2);border:1px solid var(--ln);color:var(--t);transition:border-color .2s,color .2s;
}
.soc a:hover{border-color:var(--moss);color:var(--moss)}
.soc svg{width:17px;height:17px;fill:currentColor}

/* Catalog */
.kt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.kt-head h2{font-size:clamp(26px,4vw,38px);margin-bottom:6px}
.kt-head p{color:var(--mute);max-width:52ch}
.kt-trust{display:flex;flex-wrap:wrap;gap:10px 16px;list-style:none}
.kt-trust li{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mute)}
.kt-trust li b{width:6px;height:6px;border-radius:50%;background:var(--moss);flex:none}

.kt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.kt-card{
  display:flex;flex-direction:column;gap:14px;padding:24px;cursor:pointer;
  transition:border-color .2s,box-shadow .2s,transform .2s var(--ease);
}
.kt-card:hover{border-color:var(--moss);box-shadow:var(--sh-md);transform:translateY(-2px)}
.kt-top{display:flex;align-items:center;gap:14px}
.kt-ic{
  width:56px;height:56px;flex:none;border-radius:14px;
  background:var(--moss-soft);border:1px solid var(--moss-ln);color:var(--moss);
  display:grid;place-items:center;overflow:hidden;
}
.kt-ic.lg{width:72px;height:72px;border-radius:18px}
.kt-ic img{width:100%;height:100%;object-fit:contain;background:var(--surf2)}
.kt-ttl{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kt-ttl h3{font-size:20px}
.kt-cnt{padding:3px 10px;border-radius:99px;background:var(--surf2);border:1px solid var(--ln);font-size:11.5px;font-weight:600;color:var(--mute)}
.kt-off{padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font:700 11.5px var(--sans)}
.kt-desc{font-size:13.5px;color:var(--mute);line-height:1.6}
.kt-tags{display:flex;flex-wrap:wrap;gap:6px}
.kt-tags span{padding:3px 9px;border-radius:7px;background:var(--surf2);border:1px solid var(--ln);font-size:11.5px;font-weight:600;color:var(--mute)}
.kt-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto;padding-top:14px;border-top:1px solid var(--ln)}
.kt-from small{display:block;font-size:11px;color:var(--mute)}
.kt-from b{font:700 20px/1.1 var(--mono);color:var(--t)}
.kt-go{
  display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;
  background:var(--moss);color:var(--on);font:600 13px var(--sans);
}
.kt-go i{font-style:normal}
.kt-help{
  margin-top:28px;padding:22px 24px;border-radius:var(--r);
  background:var(--surf);border:1px solid var(--ln);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.kt-help-a{display:flex;gap:10px;flex-wrap:wrap}

/* Category View */
.kp-hero{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:22px 24px;border-radius:var(--r);background:var(--surf);border:1px solid var(--ln);
  box-shadow:var(--sh);margin-bottom:20px;
}
.kp-hero-t{flex:1;min-width:200px}
.kp-hero-t h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.kp-meta{display:flex;gap:16px}
.kp-meta div{padding:10px 14px;border-radius:12px;background:var(--surf2);border:1px solid var(--ln);text-align:center;min-width:92px}
.kp-meta b{display:block;font:700 18px var(--mono);color:var(--moss)}
.kp-meta span{font-size:11px;color:var(--mute)}
.kp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:20px}
.kp-card{
  display:flex;flex-direction:column;gap:12px;padding:20px;cursor:pointer;
  transition:border-color .2s,transform .2s var(--ease);
}
.kp-card:hover{border-color:var(--moss);transform:translateY(-2px)}
.kp-img{width:44px;height:44px;border-radius:10px;object-fit:contain;background:var(--surf2);border:1px solid var(--ln)}
.kp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kp-price{margin-top:auto;padding-top:12px;border-top:1px solid var(--ln)}
.kp-price s{display:block;font-size:12px;color:var(--mute)}
.kp-price b{font:700 22px var(--mono);color:var(--t)}
.kp-price small{font-size:12px;color:var(--mute)}
.kp-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;
  border-radius:10px;background:var(--moss-soft);color:var(--moss);font:700 13px var(--sans);
}
.kp-card:hover .kp-btn{background:var(--moss);color:var(--on)}
.kp-btn i{font-style:normal}

/* Help Box */
.help{
  padding:20px;border-radius:var(--r);background:var(--surf2);
  border:1px solid var(--ln);margin-top:16px;font-size:13.5px;
}
.help h4{font:700 15px var(--serif);margin-bottom:6px}
.help p{color:var(--mute);line-height:1.65}
.help ol{list-style:none;counter-reset:hs;display:grid;gap:8px;margin-top:10px}
.help ol li{
  counter-increment:hs;position:relative;padding:10px 12px 10px 44px;
  background:var(--surf);border:1px solid var(--ln);border-radius:10px;
  color:var(--t);font-size:13px;line-height:1.55;
}
.help ol li::before{
  content:counter(hs);position:absolute;left:12px;top:10px;
  width:22px;height:22px;border-radius:50%;background:var(--moss);color:var(--on);
  display:grid;place-items:center;font:700 11.5px var(--mono);
}

/* Buy / Checkout Page */
.bxp{max-width:1040px;margin:0 auto;padding:0!important;background:none!important;border:0!important;box-shadow:none!important}
.bx{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}
.bx-side,.bx-main{background:var(--surf);border:1px solid var(--ln);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.bx-side{position:sticky;top:84px}
.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-top:8px}
.pkg{
  position:relative;padding:16px 14px;border-radius:var(--r-sm);
  background:var(--surf2);border:1.5px solid var(--ln);cursor:pointer;
  transition:border-color .18s,background .18s;
}
.pkg:hover{border-color:var(--dash)}
.pkg.on{border-color:var(--moss);background:var(--moss-soft)}
.pkg .radio{
  position:absolute;top:12px;right:12px;width:18px;height:18px;
  border-radius:50%;border:1.5px solid var(--dash);display:grid;place-items:center;
}
.pkg.on .radio{border-color:var(--moss);background:var(--moss)}
.pkg.on .radio::after{content:"✓";font-size:11px;font-weight:800;color:var(--on)}
.pkg h4{font:700 14.5px var(--sans);padding-right:24px;margin-bottom:4px}
.pkg .pr{font:700 17px var(--mono);color:var(--moss)}
.pkg .pr s{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.pkg .desc{font-size:11.5px;color:var(--mute);margin-top:4px}
.off-badge{
  display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:99px;
  background:var(--gold);color:#fff;font:700 10.5px var(--mono);
}
.pspec{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.pspec span{font-size:11px;color:var(--mute);background:var(--surf);padding:2px 7px;border-radius:6px;border:1px solid var(--ln)}

.pu{margin-top:16px;padding:14px;border-radius:var(--r-sm);border:1px dashed var(--dash);background:var(--surf2)}
.pu label{margin-top:0;display:flex;align-items:center;gap:8px}
.pu .req{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.pu-in{position:relative;margin-top:8px}
.pu-in input{padding-right:38px;font-family:var(--mono)}
.pu-st{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800}
.pu-h{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.5}
.pu[data-s=ok]{border-style:solid;border-color:var(--moss)}
.pu[data-s=ok] .pu-st,.pu[data-s=ok] .pu-h{color:var(--moss)}
.pu[data-s=bad]{border-style:solid;border-color:var(--rose)}
.pu[data-s=bad] .pu-st,.pu[data-s=bad] .pu-h{color:var(--rose)}

/* Bot Picker Grid */
.bot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.bot-card{
  display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);
  border:1.5px solid var(--ln);background:var(--surf2);color:var(--t);
  text-align:left;cursor:pointer;transition:border-color .18s,background .18s;
}
.bot-card:hover{border-color:var(--dash)}
.bot-card.on{border-color:var(--moss);background:var(--moss-soft)}
.bot-badge{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:var(--surf);border:1px solid var(--ln);
  display:grid;place-items:center;font:700 12px var(--mono);color:var(--moss);
}
.bot-card.on .bot-badge{background:var(--moss);color:var(--on);border-color:var(--moss)}
.bot-meta{flex:1;min-width:0}
.bot-meta b{display:block;font-size:13.5px;line-height:1.25}
.bot-meta small{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.bot-meta em{display:block;font-style:normal;font-size:11px;color:var(--moss);margin-top:1px}
.bot-chk{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dash);flex:none;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:transparent;
}
.bot-card.on .bot-chk{background:var(--moss);border-color:var(--moss);color:var(--on)}

/* ==========================================================================
   ORDER & TRANSFER PROOF PAGE (.ord-page) — Redesigned Clean Fintech Flow
   ========================================================================== */
.ord-page{display:grid;gap:20px;max-width:980px;margin:0 auto}
.ord-steps{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:16px 14px;border-radius:var(--r);background:var(--surf);
  border:1px solid var(--ln);box-shadow:var(--sh);
}
.os{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;font-size:12px;font-weight:600;color:var(--mute);
}
.os::before{
  content:"";position:absolute;top:17px;left:calc(-50% + 22px);right:calc(50% + 22px);
  height:2px;background:var(--ln);
}
.os:first-child::before{display:none}
.os i{
  position:relative;z-index:1;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:var(--surf2);border:1.5px solid var(--ln);
  color:var(--mute);font-style:normal;
}
.os.done i{background:var(--moss);border-color:var(--moss);color:var(--on)}
.os.done::before,.os.now::before{background:var(--moss)}
.os.now i{border-color:var(--moss);background:var(--moss-soft);color:var(--moss);box-shadow:0 0 0 4px rgba(35,88,59,.12)}
.os.now,.os.done{color:var(--t)}
.os.bad i{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}

.ord-grid{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:20px;align-items:start;
}
.ord-card{padding:24px;min-width:0}
.ord-narrow{max-width:580px;margin:0 auto;width:100%}
.ord-card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ord-card-h .ord-ic{
  width:34px;height:34px;border-radius:10px;background:var(--moss-soft);color:var(--moss);
  display:grid;place-items:center;flex:none;
}
.ord-card-h h2,.ord-card-h h3{margin:0;font-size:20px}

.rc{
  border-radius:var(--r-sm);background:var(--surf2);border:1px solid var(--ln);
  padding:4px 16px;margin-bottom:18px;
}
.rc-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--ln);font-size:13.5px;
}
.rc-row:last-child{border-bottom:0}
.rc-l{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:500}
.rc-l .ico{color:var(--mute)}
.rc-v{font-weight:600;text-align:right;word-break:break-word;display:inline-flex;align-items:center;gap:6px}
.rc-v code{
  font:500 12.5px var(--mono);background:var(--surf);padding:3px 8px;
  border-radius:6px;border:1px solid var(--ln);
}
.rc-cp{
  border:1px solid var(--ln);background:var(--surf);color:var(--t);
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;cursor:pointer;
}
.rc-cp:hover{border-color:var(--moss);color:var(--moss)}
.rc-row.tot{padding:13px 0}
.rc-row.tot .rc-v{font:700 20px var(--mono);color:var(--moss)}

.ord-how{margin-top:4px}
.ord-how h4{font:600 14.5px var(--serif);margin-bottom:10px}
.ord-how ol{list-style:none;counter-reset:s;display:grid;gap:8px}
.ord-how li{
  counter-increment:s;position:relative;padding-left:34px;
  font-size:13px;line-height:1.55;color:var(--mute);
}
.ord-how li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;
  border-radius:50%;background:var(--moss-soft);color:var(--moss);
  display:grid;place-items:center;font:700 11.5px var(--mono);
}
.ord-how li b{color:var(--t)}

/* Payment & Upload Card */
.payamt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-radius:var(--r-sm);
  background:var(--moss-soft);border:1px solid var(--moss-ln);margin-bottom:18px;
}
.payamt small{display:block;font-size:11.5px;font-weight:600;color:var(--moss)}
.payamt b{font:700 24px/1.15 var(--mono);color:var(--t)}

.qrbox{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:18px;border-radius:var(--r-sm);background:var(--surf2);
  border:1px solid var(--ln);margin-bottom:20px;
}
.qrframe{
  width:min(220px,100%);aspect-ratio:1;padding:10px;border-radius:14px;
  background:#FFFFFF;border:1px solid #E2DACB;
  display:grid;place-items:center;
}
.qrframe img{width:100%;height:100%;object-fit:contain;border-radius:6px}

.pay-sep{height:1px;background:var(--ln);margin:4px 0 18px}

.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:24px 16px;margin:0 0 14px;
  border:1.5px dashed var(--dash);border-radius:var(--r-sm);
  background:var(--surf2);cursor:pointer;text-align:center;
  transition:border-color .2s,background .2s;
}
.drop:hover{border-color:var(--moss);background:var(--moss-soft)}
.drop.has{border-style:solid;border-color:var(--moss);background:var(--surf)}
.drop .dz-i{
  width:42px;height:42px;border-radius:12px;background:var(--surf);
  border:1px solid var(--ln);color:var(--moss);display:grid;place-items:center;
}
.drop b{font-size:13.5px;color:var(--t);word-break:break-all}
.drop small{font-size:12px;color:var(--mute)}
.drop-pv{
  max-width:100%;max-height:220px;border-radius:10px;
  border:1px solid var(--ln);object-fit:contain;margin-bottom:6px;
}
.drop-meta{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
  background:var(--moss-soft);color:var(--moss);font:600 11.5px var(--mono);
}

.ord-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:20px}
.ow-ic{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:var(--moss-soft);color:var(--moss);border:1px solid var(--moss-ln);
}
.ow-ic.warn{background:var(--gold-soft);color:var(--gold);border-color:rgba(168,106,46,.3)}
.ow-ic.bad{background:var(--rose-soft);color:var(--rose);border-color:rgba(185,59,47,.3)}
.ow-ic.ok{background:var(--moss);color:var(--on);border-color:var(--moss)}
.ord-state p{color:var(--mute);max-width:40ch;font-size:14px}

/* Credential Boxes */
.pbox{padding:20px;margin-top:16px}
.pbox-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pbox-ic{
  width:42px;height:42px;border-radius:12px;background:var(--moss-soft);
  color:var(--moss);display:grid;place-items:center;flex:none;
}
.pbox-h h3{font-size:17px;margin-bottom:1px}
.pbox-h small{font-size:12px;color:var(--mute)}
.pbox-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pbox.rs .pbox-s{grid-template-columns:1fr}
.pbox-s div{padding:8px;border-radius:10px;background:var(--surf2);border:1px solid var(--ln);text-align:center}
.pbox-s small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase}
.pbox-s b{font:700 14px var(--mono)}
.cred{
  display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;
  border-radius:11px;background:var(--surf2);border:1px solid var(--ln);
}
.cred-i{
  width:30px;height:30px;border-radius:8px;background:var(--surf);border:1px solid var(--ln);
  color:var(--moss);display:grid;place-items:center;flex:none;font:700 12px var(--mono);
}
.cred-b{flex:1;min-width:0}
.cred-b small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase}
.cred-b b{display:block;font-size:13px;word-break:break-all}
.cred-a{display:flex;gap:6px;flex:none}
.cpb{
  display:inline-flex;align-items:center;gap:4px;padding:6px 10px;
  border:1px solid var(--moss);border-radius:8px;background:var(--moss);color:var(--on);
  font:600 12px var(--sans);cursor:pointer;
}
.cpb.ghost{background:var(--surf);color:var(--t);border-color:var(--ln)}
.pbox-w{
  margin-top:12px;padding:10px 12px;border-radius:10px;
  background:var(--rose-soft);border:1px solid rgba(185,59,47,.25);font-size:12.5px;line-height:1.55;
}
.pbox-w.ok{background:var(--moss-soft);border-color:var(--moss-ln)}
.pbox-steps{margin-top:14px}
.pbox-steps h4{font-size:14px;margin-bottom:8px}
.pbox-steps ol{list-style:none;counter-reset:ps;display:grid;gap:6px}
.pbox-steps li{
  counter-increment:ps;position:relative;padding:8px 10px 8px 36px;
  border-radius:10px;background:var(--surf2);border:1px solid var(--ln);font-size:13px;
}
.pbox-steps li::before{
  content:counter(ps);position:absolute;left:10px;top:8px;width:20px;height:20px;
  border-radius:50%;background:var(--moss);color:var(--on);display:grid;place-items:center;
  font:700 11px var(--mono);
}

/* ==========================================================================
   OWNER PANEL (.ow-*) — Clean, Crisp Admin Workspace
   ========================================================================== */
.ow-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ow-stats{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px;
}
.ow-stat{
  padding:16px 18px;border-radius:var(--r);background:var(--surf);
  border:1px solid var(--ln);box-shadow:var(--sh);min-width:0;
}
.ow-stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ow-stat-top span{font-size:12px;font-weight:600;color:var(--mute)}
.ow-stat-ic{
  width:28px;height:28px;border-radius:8px;background:var(--surf2);color:var(--moss);
  display:grid;place-items:center;flex:none;
}
.ow-stat b{display:block;font:700 22px/1.15 var(--mono);color:var(--t);word-break:break-word}
.ow-stat.hl b{color:var(--moss)}
.ow-stat.warn b{color:var(--gold)}
.ow-status{display:inline-flex;align-items:center;gap:7px;font:700 16px var(--sans)}
.ow-status i{width:8px;height:8px;border-radius:50%;background:#2E8B57}
.ow-status.off i{background:var(--rose)}

.ow-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.ow-panel{padding:24px;min-width:0}
.ow-panel-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ow-panel-h .ow-stat-ic{width:34px;height:34px;border-radius:10px}
.ow-panel-h h3{margin:0;font-size:20px}
.ow-disc-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}
.ow-disc-grid label{margin-top:10px;font-size:12px}
.ow-dur-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ow-sep{height:1px;background:var(--ln);margin:20px 0 16px}
.ow-sec-t{margin-bottom:12px}
.ow-sec-t b{display:block;font-size:14.5px}
.ow-sec-t small{font-size:12.5px;color:var(--mute)}

.ow-toggle-list{display:grid;gap:10px;margin-top:12px}
.ow-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 16px;margin:0;border-radius:var(--r-sm);
  border:1px solid var(--ln);background:var(--surf2);cursor:pointer;
  transition:border-color .2s,background .2s;
}
.ow-toggle:hover{border-color:var(--dash)}
.ow-toggle:has(input:checked){border-color:var(--moss-ln);background:var(--moss-soft)}
.ow-tg-l{display:flex;align-items:flex-start;gap:12px;min-width:0;flex:1}
.ow-tg-ic{
  width:34px;height:34px;border-radius:10px;background:var(--surf);
  border:1px solid var(--ln);color:var(--moss);display:grid;place-items:center;flex:none;
}
.ow-tg-copy{min-width:0}
.ow-tg-copy strong{display:block;font-size:13.5px;line-height:1.35;color:var(--t)}
.ow-tg-copy small{display:block;font-size:12px;line-height:1.5;color:var(--mute);margin-top:2px;font-weight:400}

.switch-wrap{position:relative;width:42px;height:24px;flex:none}
.switch-wrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch-ui{
  position:absolute;inset:0;border-radius:99px;background:var(--dash);
  transition:background .22s var(--ease);
}
.switch-ui::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);
  transition:transform .24s var(--ease);
}
.switch-wrap input:checked+.switch-ui{background:var(--moss)}
.switch-wrap input:checked+.switch-ui::after{transform:translateX(18px)}

.ow-orders{margin-top:20px;padding:24px}
.ow-table-wrap{margin-top:14px;overflow-x:auto}
.ow-table{width:100%;border-collapse:collapse;font-size:13.5px}
.ow-table th{
  padding:10px 12px;text-align:left;font:700 11.5px var(--sans);
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  border-bottom:1px solid var(--ln);background:var(--surf2);
}
.ow-table td{padding:12px;border-bottom:1px solid var(--ln);vertical-align:middle}
.ow-table tr:last-child td{border-bottom:0}
.ow-id{font:500 12px var(--mono);color:var(--t)}
.ow-amt{font:600 13px var(--mono);color:var(--moss);margin-top:2px}
.ow-prod{font-weight:600;color:var(--t)}
.ow-buyer{font-size:12px;color:var(--mute);margin-top:2px}
.ow-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

@media(max-width:980px){
  .ow-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ow-grid{grid-template-columns:1fr}
  .ow-disc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:680px){
  .ow-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ow-stat:last-child{grid-column:1/-1}
  .ow-panel,.ow-orders{padding:18px}
  .ow-disc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ow-table thead{display:none}
  .ow-table,.ow-table tbody,.ow-table tr,.ow-table td{display:block;width:100%}
  .ow-table tr{
    padding:14px;margin-bottom:10px;border-radius:var(--r-sm);
    background:var(--surf2);border:1px solid var(--ln);
  }
  .ow-table td{padding:0;border:0}
  .ow-table td+td{margin-top:8px}
  .ow-table td:first-child{display:flex;justify-content:space-between;align-items:center}
  .ow-acts{justify-content:flex-start;padding-top:8px;border-top:1px dashed var(--dash)}
  .ow-acts:empty{display:none}
  .ow-table td:has(.ow-acts:empty){display:none}
  .ow-acts .btn{flex:1}
}

/* Auth Page */
.ax{
  display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);
  max-width:920px;margin:10px auto 0;border:1px solid var(--ln);
  border-radius:var(--r-lg);overflow:hidden;background:var(--surf);box-shadow:var(--sh);
}
.ax-side{
  position:relative;padding:34px 28px 130px;background:#1A3524;color:#EFECE2;
  display:flex;flex-direction:column;overflow:hidden;
}
.ax-side>*{position:relative;z-index:1}
.ax-logo{width:56px;height:56px;border-radius:16px;object-fit:cover;border:1.5px solid rgba(255,255,255,.25)}
.ax-side h2{font-size:26px;color:#FAF7F0;margin:14px 0 4px}
.ax-side p{font-size:13.5px;color:#B8C9BC;line-height:1.65}
.ax-perks{list-style:none;margin-top:18px}
.ax-perks li{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px dashed rgba(255,255,255,.15);font-size:13px;color:#EFECE2;
}
.ax-perks li .ico{color:#93D5AD}
.ax-hills{position:absolute!important;left:0;right:0;bottom:0;width:100%;height:110px;z-index:0!important}
.ax-form{padding:32px}
.ax-seg{
  display:grid;grid-template-columns:1fr 1fr;background:var(--surf2);
  border:1px solid var(--ln);border-radius:12px;padding:4px;position:relative;margin-bottom:20px;
}
.ax-seg button{
  position:relative;z-index:1;border:0;background:none;padding:9px;
  font:600 13.5px var(--sans);color:var(--mute);cursor:pointer;
}
.ax-seg button.on{color:var(--on)}
.ax-seg i{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
  border-radius:9px;background:var(--moss);transition:transform .28s var(--ease);
}
.ax-seg.up i{transform:translateX(100%)}
.ax-f{position:relative}
.ax-f>.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.ax-f input{padding-left:40px!important}
.ax-or{display:flex;align-items:center;gap:12px;margin:16px 0 4px;font-size:12px;color:var(--mute)}
.ax-or::before,.ax-or::after{content:"";flex:1;border-top:1px solid var(--ln)}
.ax-go{margin-top:20px;width:100%;min-height:46px}
.ax-sw{margin-top:14px;text-align:center;font-size:13px;color:var(--mute)}
.ax-sw a{color:var(--moss);font-weight:700;cursor:pointer}
.gbtn{display:flex;justify-content:center;min-height:44px}

/* Profile */
.pr{display:grid;gap:18px;max-width:1040px;margin:0 auto}
.pr-hero{overflow:hidden}
.pr-cover{
  height:112px;position:relative;display:flex;justify-content:flex-end;align-items:flex-start;
  padding:14px;background:linear-gradient(125deg,#1C3828,#2E5E42);
}
.pr-out{position:relative;z-index:2}
.pr-main{
  display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;
  padding:0 24px 10px;margin-top:-44px;position:relative;z-index:2;
}
.pr-av{
  position:relative;width:92px;height:92px;border-radius:50%;padding:0;
  border:4px solid var(--surf);background:var(--moss-soft);cursor:pointer;flex:none;
}
.pr-av-img{
  display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  overflow:hidden;position:relative;font:700 32px var(--serif);color:var(--moss);
}
.pr-av-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr-cam{
  position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;
  background:var(--moss);color:var(--on);display:grid;place-items:center;border:2px solid var(--surf);
}
.pr-id{flex:1;min-width:200px;padding-top:48px}
.pr-id h2{font-size:24px;margin-bottom:2px}
.pr-lv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.pr-lv em{font-style:normal;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:11px}
.pr-xp{height:6px;border-radius:6px;background:var(--surf2);border:1px solid var(--ln);overflow:hidden;margin:8px 0 4px;max-width:340px}
.pr-xp i{display:block;height:100%;background:var(--moss)}
.pr-xpt{font-size:12px;color:var(--mute)}
.pr-s3{display:flex;border:1px solid var(--ln);border-radius:12px;background:var(--surf2);overflow:hidden}
.pr-s3>div{padding:8px 16px;text-align:center;border-right:1px solid var(--ln)}
.pr-s3>div:last-child{border:0}
.pr-s3 b{display:block;font:700 18px var(--mono);color:var(--moss)}
.pr-s3 span{font-size:11px;color:var(--mute)}
.pr-info{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px 20px}
.pr-chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;
  border:1px solid var(--ln);background:var(--surf2);font-size:12.5px;
}
.pr-chip.warn{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pr-tabs{
  display:flex;gap:4px;padding:4px;background:var(--surf);border:1px solid var(--ln);
  border-radius:14px;width:fit-content;max-width:100%;overflow-x:auto;
}
.pr-tabs button{
  display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 15px;
  border-radius:10px;font:600 13.5px var(--sans);color:var(--mute);cursor:pointer;
}
.pr-tabs button.on{background:var(--moss);color:var(--on)}
.pr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pr-stat{padding:16px 18px;border-radius:var(--r);background:var(--surf);border:1px solid var(--ln);box-shadow:var(--sh)}
.pr-stat b{display:block;font:700 22px var(--mono)}
.pr-stat b.ok{color:var(--moss)}.pr-stat b.gd{color:var(--gold)}
.pr-stat span{font-size:12px;color:var(--mute)}
.pr-card{padding:22px}
.pr-ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pr-ch h3{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.pr-ch h3 .ico{color:var(--moss)}
.pr-ch p,.pr-muted{font-size:13px;color:var(--mute)}
.pr-cnt{font:600 12px var(--mono);color:var(--mute);background:var(--surf2);padding:3px 10px;border-radius:99px;border:1px solid var(--ln)}
.pr-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pr-wa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pr-wa div{padding:12px 14px;border-radius:12px;background:var(--surf2);border:1px solid var(--ln)}
.pr-wa b{display:block;font:700 17px var(--mono);color:var(--moss)}
.pr-wa span{font-size:11.5px;color:var(--mute)}
.pr-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.pr-badge{padding:12px;border-radius:12px;background:var(--surf2);border:1px dashed var(--dash);opacity:.6}
.pr-badge.on{opacity:1;border-style:solid;border-color:var(--moss-ln);background:var(--moss-soft)}
.pr-badge i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surf);color:var(--moss);margin-bottom:8px;font-style:normal}
.pr-badge.on i{background:var(--moss);color:var(--on)}
.pr-badge b{display:block;font-size:13px}.pr-badge small{display:block;font-size:11.5px;color:var(--mute);line-height:1.4}
.pr-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mute)}
.pr-pills{display:flex;flex-wrap:wrap;gap:8px}
.pr-pills button{border:1px solid var(--ln);background:var(--surf);color:var(--mute);border-radius:99px;padding:6px 12px;font:600 12.5px var(--sans);cursor:pointer}
.pr-pills button.on{background:var(--moss);color:var(--on);border-color:var(--moss)}
.pr-orders{display:grid;gap:10px}
.pr-order{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 16px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--ln);cursor:pointer;transition:border-color .18s;
}
.pr-order:hover{border-color:var(--moss)}
.pr-o-main small{color:var(--mute);font-size:12px}
.pr-o-side{text-align:right;display:grid;gap:4px;justify-items:end}
.pr-o-side b{font:700 14px var(--mono)}
.pr-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pr-empty{text-align:center;padding:36px 20px;color:var(--mute)}
.rl{font-size:10.5px;background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:2px 8px;font-weight:700;vertical-align:middle}
.rl.big{font-size:12px;padding:2px 10px}

/* Chat & AI */
.cx{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.cx-side{padding:20px}
.cx-side h3{margin-bottom:10px}
.cx-rules{list-style:none;display:grid;gap:8px;margin-bottom:14px}
.cx-rules li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute)}
.cx-rules .ico{color:var(--moss);margin-top:2px}
.cx-ai{display:flex;gap:12px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.cx-ai img{width:46px;height:46px;border-radius:12px;object-fit:cover;border:1px solid var(--ln)}
.cx-ai small{font-size:12px;color:var(--mute)}
.cx-q{display:flex;flex-wrap:wrap;gap:6px}
.cx-q button{
  border:1px solid var(--ln);background:var(--surf2);color:var(--t);
  border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;
}
.cx-q button:hover{border-color:var(--moss)}
.cx-win{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cx-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--surf2)}
.cx-head small{margin-left:auto;font-size:11.5px;color:var(--mute)}
.cx-dot{width:8px;height:8px;border-radius:50%;background:#2E8B57}
.chat{
  display:flex;flex-direction:column;gap:12px;
  height:clamp(320px,56vh,540px);overflow-y:auto;padding:16px;background:var(--inset);
}
.cm{display:flex;gap:10px;align-items:flex-end;max-width:86%}
.cm.mine{margin-left:auto;flex-direction:row-reverse}
.avt{
  display:inline-grid;place-items:center;border-radius:50%;background:var(--moss);
  color:var(--on);font-weight:700;overflow:hidden;flex:none;position:relative;
}
.avt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cm .bx{min-width:0;display:flex;flex-direction:column;gap:3px}
.cm.mine .bx{align-items:flex-end}
.cm .nm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
.cm .nm .x{border:0;background:none;color:var(--rose);font-size:11px;cursor:pointer}
.cm .tx,.m{
  padding:9px 13px;border-radius:14px 14px 14px 4px;
  background:var(--surf);border:1px solid var(--ln);color:var(--t);font-size:14px;word-break:break-word;
}
.cm.mine .tx,.m.me{
  background:var(--moss);color:var(--on);border-color:var(--moss);
  border-radius:14px 14px 4px 14px;
}
.m{max-width:84%}.m.me{align-self:flex-end;margin-left:auto}.m.bot{align-self:flex-start}
.cx-send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ln);background:var(--surf)}
.cx-send input{flex:1}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.3;transform:translateY(-3px)}}

/* Leaderboard */
.rkh{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:center}
.rkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.rkstats .glass{padding:16px}
.rkstats b{display:block;font:700 22px var(--mono);color:var(--moss)}
.rkstats small{font-size:12px;color:var(--mute)}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:12px;align-items:end;margin:24px 0 18px}
.pd{position:relative;text-align:center;padding:28px 10px 0;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.pd .crown{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:18px}
.pav{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;
  font:700 20px var(--serif);color:var(--moss);background:var(--moss-soft);margin-bottom:8px;border:2px solid var(--ln);
}
.pd.p1 .pav{width:64px;height:64px;border-color:var(--moss)}
.pav img,.lav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lav{
  position:relative;overflow:hidden;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;flex:none;font:700 15px var(--serif);
  background:var(--moss-soft);color:var(--moss);
}
.pnm{font-weight:700;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmask{font-size:11px;color:var(--mute)}
.pco{font:700 14px var(--mono);color:var(--gold);margin:6px 0 10px}
.pbase{width:calc(100% + 20px);margin:0 -10px;padding:10px 0;font:700 16px var(--serif);background:var(--surf2);border-top:1px solid var(--ln)}
.pd.p1 .pbase{padding:18px 0;background:var(--moss-soft);color:var(--moss)}
.lr{display:grid;grid-template-columns:30px 38px 1fr auto;align-items:center;gap:6px 12px;padding:12px 14px;margin-top:8px}
.lrk{font:700 14px var(--mono);color:var(--moss);text-align:center}
.lnm b{display:block;font-size:14px}.lnm small{font-size:11.5px;color:var(--mute)}
.lco{font:700 13.5px var(--mono);color:var(--gold)}
.lbar{grid-column:2/5;height:4px;border-radius:4px;background:var(--surf2);overflow:hidden}
.lbar i{display:block;height:100%;width:var(--w,0);background:var(--moss)}
.rkcmd{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rkcmd code{cursor:pointer;padding:5px 11px;border-radius:8px;background:var(--surf2);border:1px solid var(--ln);font:600 12.5px var(--mono)}

/* Notes (Spellbook) */
.nt-head{margin-top:36px}
.nt{margin-top:14px;overflow:hidden}
.nt-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surf2);border-bottom:1px solid var(--ln);font-size:13px}
.dots3{display:flex;gap:6px}.dots3 i{width:10px;height:10px;border-radius:50%;background:var(--dash)}
.nt-body{display:grid;grid-template-columns:190px 270px minmax(0,1fr);height:min(600px,74vh)}
.nt-side{background:var(--surf2);border-right:1px solid var(--ln);padding:10px 8px;overflow:auto}
.nt-side h5{font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 8px 4px}
.nt-f{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:none;color:var(--t);font-size:13px;cursor:pointer;text-align:left}
.nt-f span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-f em{font-style:normal;color:var(--mute);font-size:11.5px;font-family:var(--mono)}
.nt-f.on{background:var(--moss);color:var(--on)}.nt-f.on em{color:var(--on)}
.nt-list{border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.nt-search{padding:10px;border-bottom:1px solid var(--ln)}
.nt-search input{min-height:36px;padding:7px 11px;font-size:13px}
.nt-rows{overflow:auto;flex:1;padding:6px}
.nt-rows h6{font:700 11px var(--sans);color:var(--mute);margin:8px 8px 4px}
.nt-r{padding:9px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--ln)}
.nt-r b{display:block;font:600 13.5px var(--mono);color:var(--moss)}
.nt-r span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-r span i{font-style:normal;color:var(--t);margin-right:6px;font-weight:600}
.nt-r.on{background:var(--moss-soft)}
.nt-ed{display:flex;flex-direction:column;min-height:0;background:var(--surf)}
.nt-tool{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.nt-tool .sp{flex:1;font-size:12px;color:var(--mute)}
.nt-tool button{border:1px solid var(--ln);background:var(--surf2);color:var(--t);padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.nt-back{display:none}
.nt-paper{padding:24px;overflow:auto;flex:1}
.nt-paper h3{font:700 24px var(--mono);margin-bottom:6px}
.nt-paper h4{font-size:14px;margin:18px 0 6px}
.nt-paper ul{list-style:none;display:grid;gap:6px}
.nt-paper code{padding:2px 7px;border-radius:6px;background:var(--moss-soft);color:var(--moss);font-family:var(--mono);font-weight:600;cursor:pointer}
.nt-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--surf2);border:1px solid var(--ln);margin-right:6px;font-weight:600}
.nt-empty{margin:auto;text-align:center;color:var(--mute);padding:20px;font-size:13.5px}
.nt-more{width:100%;padding:9px;margin-top:6px;border-radius:8px;border:1px dashed var(--dash);background:none;color:var(--mute);cursor:pointer}

.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bars.scroll{max-height:340px;overflow-y:auto;padding-right:4px}
.bar-r{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.bar-r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-r div{height:7px;border-radius:7px;background:var(--surf2);overflow:hidden}
.bar-r div i{display:block;height:100%;background:var(--moss);transition:width .7s var(--ease)}
.bar-r span:last-child{text-align:right;color:var(--mute);font-family:var(--mono)}
.feat{padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--moss-soft);display:grid;place-items:center;font-size:22px}
.demo{margin-top:6px;padding:10px;border-radius:10px;background:var(--surf2);font-size:12px;display:flex;flex-direction:column;gap:5px}
.demo span{padding:5px 9px;border-radius:8px;width:fit-content}
.demo .u{align-self:flex-end;background:var(--me)}
.demo .b{background:var(--surf);border:1px solid var(--ln)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

/* Free Premium Page (.gr-wrap) */
.gr-wrap{max-width:880px;margin:0 auto}
.gr-box{
  display:grid;grid-template-columns:1.05fr .95fr;
  border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--ln);
  background:var(--surf);box-shadow:var(--sh);
}

}
.gr-form{

.gr-note,.gr-footer{font-size:12px;color:var(--mute);text-align:center;margin-top:12px}

.gr-error{padding:14px;border-radius:12px;background:var(--rose-soft);color:var(--rose);margin-bottom:14px}

/* Toast & To-Top */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;
  background:var(--t);color:var(--bg);opacity:0;pointer-events:none;z-index:99;
  transition:opacity .22s,transform .24s var(--ease);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.totop{
  position:fixed;right:16px;bottom:20px;z-index:45;width:40px;height:40px;
  border-radius:12px;border:1px solid var(--ln);background:var(--surf);color:var(--t);
  box-shadow:var(--sh);cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .22s,transform .22s;
}
.totop.show{opacity:1;transform:none;pointer-events:auto}

/* Reveal utility */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.reveal.in,.reveal.rv-in{opacity:1;transform:none}

  v1: {
    id: "v1",

    endpoint: "/api/claim/v3",

let SEL_BOT = localStorage.getItem("tt_bot_ver") || "v1";
let BUYBOT = localStorage.getItem("tt_buy_bot_ver") || "v1";
if (!BOT_INSTANCES[SEL_BOT]) SEL_BOT = "v1";
if (!BOT_INSTANCES[BUYBOT]) BUYBOT = "v1";

function selectBotVer(ver) {
  if (!BOT_INSTANCES[ver]) return;
  SEL_BOT = ver;
  try { localStorage.setItem("tt_bot_ver", ver); } catch {}
  document.querySelectorAll("#claimSection .bot-card").forEach(el => {
    const on = el.dataset.bot === ver;
    el.classList.toggle("on", on);
    el.setAttribute("aria-pressed", String(on));
    const chk = el.querySelector(".bot-chk");
    if (chk) chk.textContent = on ? "✓" : "";
  });
  const badge = $("#claimActiveBot");
  const b = BOT_INSTANCES[ver];
  if (badge) badge.textContent = "Target: " + b.label + " (" + b.waDisplay + ")";
  toast("Bot aktif: " + b.label + " (" + b.waDisplay + ")");
}

function selectBuyBot(v) {
  if (!BOT_INSTANCES[v]) return;
  BUYBOT = v;
  try { localStorage.setItem("tt_buy_bot_ver", v); } catch {}
  document.querySelectorAll("#buyBotGrid .bot-card").forEach(el => {
    const on = el.dataset.bot === v;

    if (chk) chk.textContent = on ? "✓" : "";
  });
  toast("Bot sewa: " + BOT_INSTANCES[v].label);
}

async function submitClaim() {
  const inp = $("#claimInput");
  const btn = $("#claimBtn");
  const resBox = $("#claimResult");
  const rawVal = (inp?.value || "").trim();
  if (!rawVal) {
    toast("Isi nomor WhatsApp-mu dulu ya");
    inp?.focus();
    return;
  }
  const botInfo = BOT_INSTANCES[SEL_BOT] || BOT_INSTANCES.v1;
  const digits = rawVal.replace(/\D/g, "");
  const normWa = digits ? (digits.startsWith("0") ? "62" + digits.slice(1) : digits) : "";
  if (digits.length < 10) {
    toast("Nomor WhatsApp-nya belum pas, coba periksa lagi");
    inp?.focus();
    return;
  }
  const payload = {
    source: "ourin-webhook",
    webhook: "ourin-webhook",
    bot: botInfo.id,
    botLabel: botInfo.label,
    botWa: botInfo.waRaw,
    target: rawVal,
    wa: normWa || undefined,
    code: normWa ? undefined : rawVal,
    timestamp: new Date().toISOString()
  };
  if (btn) { btn.disabled = true; btn.textContent = "Mengirim…"; }
  try {
    const r = await fetch(WEBHOOK_URL(), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Webhook-Source": "ourin-webhook",
        "X-Bot-Version": botInfo.id,
        ...(TOK ? { Authorization: "Bearer " + TOK } : {})
      },
      body: JSON.stringify(payload)
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data?.message || `Gagal (${r.status})`);
    if (resBox) {
      resBox.className = "claim-res";
      resBox.innerHTML = `<b>Hadiah dalam perjalanan!</b>
        <div class="sub" style="margin-top:6px">${esc(data.message || "Klaimmu sudah terkirim. Bot akan mengetuk pintumu sebentar lagi.")}</div>
        <div class="sub mono" style="margin-top:6px;font-size:11.5px">Tujuan: ${esc(botInfo.waDisplay)} · Nomor: ${esc(rawVal)}</div>`;
    }
    toast("Hadiah dikirim lewat " + botInfo.label);
  } catch (err) {
    if (resBox) {
      resBox.className = "claim-res err";
      resBox.innerHTML = `<b>Belum berhasil</b>
        <div class="sub" style="margin-top:6px">${esc(err.message || "Klaim belum bisa terkirim. Coba lagi sebentar ya.")}</div>`;
    }
    toast("" + (err.message || "Klaim belum terkirim"));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Terima Hadiah"; }
  }
}

 if(!obs){

   entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("in");obs.unobserve(entry.target)}});
  },{threshold:0.01,rootMargin:"0px 0px -4% 0px"});
 }
 items.forEach(el=>obs.observe(el));
}
